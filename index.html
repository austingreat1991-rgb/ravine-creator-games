<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ravine Creator Games</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Ravine Creator Games">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Ravine's creator program — your numbers, the swipe library, quests and weekly ad reviews.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#07080A; --bg2:#0B0D11;
 --gl:rgba(255,255,255,.045); --gl2:rgba(255,255,255,.07); --gl3:rgba(255,255,255,.028);
 --ln:rgba(255,255,255,.085); --ln2:rgba(255,255,255,.14);
 --tx:#EDEFF2; --tx2:#9AA2AE; --tx3:#646C79; --tx4:#454C58;
 --o:#FF6E20; --o2:#FFA25C; --oGlow:rgba(255,110,32,.28);
 --gr:#3DDC84;--warn:#FFB020;--bad:#FF5C4D; --gr2:rgba(61,220,132,.14);
 --bl:#5B9DFF;
 --r:22px; --r2:16px; --r3:12px;
 --sh:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.42);
 --sh2:0 24px 70px rgba(0,0,0,.6);
 --ease:cubic-bezier(.22,1,.36,1);
 --spring:cubic-bezier(.34,1.56,.64,1);
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
}
html,body{overflow-x:clip;background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:
  radial-gradient(720px 480px at 12% -6%, rgba(255,110,32,.10), transparent 62%),
  radial-gradient(620px 420px at 92% 4%, rgba(91,157,255,.07), transparent 60%),
  radial-gradient(900px 700px at 50% 108%, rgba(61,220,132,.05), transparent 62%)}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.035'/></svg>")}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ================= SHELL ================= */
#app{display:none;position:relative;z-index:1;min-height:100dvh}
.wrap{display:grid;grid-template-columns:246px minmax(0,1fr);gap:0;min-height:100dvh}
.wrap>*{min-width:0}

/* ---- rail ---- */
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:22px 14px 16px;
 background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
 border-right:1px solid var(--ln);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.blogo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
 background:linear-gradient(145deg,#FF8A3D,#E64E00);box-shadow:0 6px 20px var(--oGlow),inset 0 1px 0 rgba(255,255,255,.35)}
.blogo svg{width:19px;height:19px}
.blogo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
/* the mark carries its own ground and gold ring — drop the orange tile and glow
   underneath it so the two do not fight */
.blogo:has(img){background:none;box-shadow:none;border-radius:50%;overflow:hidden}
.bname{font-size:13.5px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.bsub{font-size:9.5px;letter-spacing:2.1px;color:var(--tx4);font-weight:800;margin-top:2px}
.nlbl{font-size:9.5px;letter-spacing:1.9px;color:var(--tx4);font-weight:800;padding:16px 10px 7px}
.rail nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.rail nav button{display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:11px;
 font-size:13.5px;font-weight:550;color:var(--tx2);position:relative;transition:.18s var(--ease);width:100%;text-align:left}
.rail nav button:hover{background:var(--gl);color:var(--tx)}
.rail nav button.on{background:linear-gradient(90deg,rgba(255,110,32,.16),rgba(255,110,32,.04));color:#fff;font-weight:650}
.rail nav button.on:before{content:"";position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--o);box-shadow:0 0 12px var(--o)}
.rail nav svg{width:17px;height:17px;flex:none;opacity:.85}
.pip{margin-left:auto;background:var(--o);color:#fff;font-size:9.5px;font-weight:800;padding:1.5px 6px;border-radius:99px;box-shadow:0 2px 8px var(--oGlow)}
.rfoot{border-top:1px solid var(--ln);padding-top:12px;margin-top:8px}
.who{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:13px;background:var(--gl3);border:1px solid var(--ln)}
.who .nm{font-size:12.5px;font-weight:650;line-height:1.2}
.who .tr{font-size:9.5px;letter-spacing:1.3px;font-weight:800;margin-top:2.5px}
.rfoot select{width:100%;margin-top:8px;background:var(--gl3);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--tx2);cursor:pointer}
.rfoot .out{width:100%;margin-top:7px;font-size:11px;color:var(--tx4);padding:6px;border-radius:9px;transition:.15s}
.rfoot .out:hover{color:var(--tx2);background:var(--gl3)}

/* ---- main ---- */
main{padding:26px 30px 60px;max-width:1320px;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
h1.pt{font-size:31px;font-weight:800;letter-spacing:-1.1px;line-height:1.05}
.psub{font-size:13.5px;color:var(--tx2);margin-top:6px;max-width:640px;line-height:1.5}
.tools{display:flex;align-items:center;gap:9px}
.icb{width:38px;height:38px;border-radius:12px;background:var(--gl);border:1px solid var(--ln);display:grid;place-items:center;position:relative;transition:.18s var(--ease)}
.icb:hover{background:var(--gl2);transform:translateY(-1px)}
.icb svg{width:17px;height:17px;color:var(--tx2)}
.icb b{position:absolute;top:-5px;right:-5px;background:var(--o);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;box-shadow:0 2px 8px var(--oGlow)}
.heat{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:12px;background:var(--gl);border:1px solid var(--ln);font-size:13.5px;font-weight:700}

/* ---- live pill ---- */
.livep{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 11px;border-radius:99px;
 font-size:9.5px;font-weight:800;letter-spacing:1.2px;white-space:nowrap;vertical-align:middle}
.livep i{width:7px;height:7px;border-radius:50%;font-style:normal;flex:none}
.livep.on{background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.32);color:var(--gr)}
.livep.on i{background:var(--gr);box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:blip 1.6s infinite}
.livep.snap{background:rgba(255,180,60,.09);border:1px solid rgba(255,180,60,.26);color:#F0B542}
.livep.snap i{background:#F0B542;box-shadow:0 0 0 0 rgba(240,181,66,.6);animation:blip 2.6s infinite}
@keyframes blip{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 7px transparent;opacity:.65}100%{box-shadow:0 0 0 0 transparent;opacity:1}}

/* ---- glass primitives ---- */
.g{background:var(--gl);border:1px solid var(--ln);border-radius:var(--r);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--sh);position:relative;overflow:hidden}
.g:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);pointer-events:none}
.p{padding:20px}
.g h3{font-size:15px;font-weight:700;letter-spacing:-.3px}
.g .sub{font-size:12.5px;color:var(--tx3);margin-top:4px;line-height:1.5}
.lbl{font-size:9.5px;letter-spacing:1.9px;font-weight:800;color:var(--tx4)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:34px 0 15px}
.sec h2{font-size:16.5px;font-weight:700;letter-spacing:-.4px}
.more{font-size:12px;color:var(--tx3);font-weight:600;transition:.15s}
.more:hover{color:var(--o)}
.narrow{max-width:880px}
.vidwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:#0A0C0F;display:block}
.vidwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.5s var(--ease)}
.vidwrap:hover img{transform:scale(1.04)}
.vidwrap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.45))}
.vidwrap .pb{position:absolute;inset:0;z-index:3;display:grid;place-items:center}
.vidwrap .pb i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;color:#fff;
 background:rgba(255,110,32,.92);box-shadow:0 12px 36px rgba(0,0,0,.55),0 0 0 8px rgba(255,110,32,.12);transition:.24s var(--spring)}
.vidwrap:hover .pb i{transform:scale(1.09);box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 0 12px rgba(255,110,32,.16)}
.wkchip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 13px;border-radius:99px;
 background:rgba(255,110,32,.13);border:1px solid rgba(255,110,32,.28);color:var(--o2);font-size:11px;font-weight:800;letter-spacing:1.4px}
.note{background:var(--gl3);border:1px solid var(--ln);border-radius:var(--r3);padding:13px 15px;font-size:12.5px;color:var(--tx2);line-height:1.6}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:13px;
 font-size:13.5px;font-weight:650;letter-spacing:-.1px;color:#fff;
 background:linear-gradient(145deg,#FF8036,#EF5B05);box-shadow:0 6px 22px var(--oGlow),inset 0 1px 0 rgba(255,255,255,.28);
 transition:.18s var(--ease)}
.btn:hover{transform:translateY(-1.5px);box-shadow:0 10px 30px var(--oGlow),inset 0 1px 0 rgba(255,255,255,.32)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.gh{background:var(--gl);border:1px solid var(--ln2);box-shadow:none;color:var(--tx)}
.btn.gh:hover{background:var(--gl2);box-shadow:none}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px;border-radius:11px}
.chip{height:33px;padding:0 13px;border-radius:99px;background:var(--gl3);border:1px solid var(--ln);
 font-size:12px;font-weight:600;color:var(--tx2);transition:.16s var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--gl);color:var(--tx)}
.chip.on{background:linear-gradient(145deg,#FF8036,#EF5B05);color:#fff;border-color:transparent;box-shadow:0 4px 16px var(--oGlow)}
.chip i{font-style:normal;opacity:.55;font-size:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
/* ---- analytics chart ---- */
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats.three .v{font-size:19px}
.stats.three .k{font-size:9px;letter-spacing:.06em}
.vthumb{width:44px;height:78px;border-radius:9px;object-fit:cover;flex:0 0 auto;border:1px solid var(--ln);background:#111}
.vthumb.ph{display:block}
.chartwrap{position:relative;margin:2px 0 0}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;z-index:8;opacity:0;transform:translate(-50%,-118%);transition:opacity .12s;
 background:rgba(10,12,16,.96);border:1px solid var(--ln);border-radius:11px;padding:9px 11px;min-width:132px;
 box-shadow:0 14px 34px rgba(0,0,0,.6);backdrop-filter:blur(12px)}
.ctip.on{opacity:1}
.ctip b{display:block;font-size:11.5px;font-weight:700;color:var(--tx);margin-bottom:5px;letter-spacing:-.1px}
.ctip .r{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--tx3);line-height:1.7}
.ctip .r i{font-style:normal;color:var(--tx);font-weight:650;font-variant-numeric:tabular-nums}
.clg{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--ln)}
.clg span{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--tx3);letter-spacing:.02em}
.clg i{width:9px;height:9px;border-radius:50%;display:block}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.hero .hv{font-size:52px;font-weight:800;letter-spacing:-2.4px;line-height:.94;font-variant-numeric:tabular-nums}
.hero .hs{font-size:12.5px;color:var(--tx3);padding-bottom:7px;line-height:1.5}
.chips.row{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;margin-left:-4px;margin-right:-4px;padding:2px 4px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.chips.row::-webkit-scrollbar{display:none}
.chips.row>*{flex:0 0 auto;scroll-snap-align:start}
.flab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx4);font-weight:700;margin:2px 0 7px}
.search{flex:1;min-width:190px;height:38px;padding:0 15px;border-radius:12px;background:var(--gl3);border:1px solid var(--ln);font-size:13px;transition:.16s}
.search:focus{border-color:rgba(255,110,32,.5);background:var(--gl);box-shadow:0 0 0 3px rgba(255,110,32,.09)}
.search::placeholder{color:var(--tx4)}

/* ---- hero ---- */
.hero{position:relative;border-radius:26px;overflow:hidden;padding:26px 28px;
 background:linear-gradient(150deg,rgba(255,110,32,.13),rgba(255,255,255,.04) 42%,rgba(91,157,255,.05));
 border:1px solid var(--ln);box-shadow:var(--sh2);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.hero:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
.hero:after{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-220px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,110,32,.20),transparent 66%);pointer-events:none}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center;position:relative;z-index:2}
.hgrid>*{min-width:0}
.tbadge{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:1.7px}
.tbadge i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;font-style:normal}
.bignum{display:flex;align-items:flex-end;gap:11px;margin:14px 0 3px}
.bignum b{font-size:64px;font-weight:800;letter-spacing:-3.4px;line-height:.86}
.bignum span{font-size:14px;color:var(--tx3);font-weight:600;padding-bottom:9px}
.bignum .dl{margin-left:auto}
.hmeta{font-size:13px;color:var(--tx2);display:flex;gap:9px;flex-wrap:wrap;align-items:center;row-gap:5px}
.hmeta em{font-style:normal;color:var(--tx4)}
.trk{margin-top:20px}
.trkb{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.trkf{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6E20,#FFB36B);box-shadow:0 0 16px var(--oGlow);
 transition:width 1.1s var(--ease)}
.trkl{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--tx3)}
.trkl b{color:var(--tx)}
.delta{display:inline-flex;align-items:center;gap:4px;height:25px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.delta.up{background:var(--gr2);color:var(--gr);border:1px solid rgba(61,220,132,.26)}
.delta.dn{background:rgba(255,110,32,.1);color:var(--o2);border:1px solid rgba(255,110,32,.24)}
.delta.fl{background:var(--gl3);color:var(--tx4);border:1px solid var(--ln)}

/* ---- stat tiles ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:11px;margin-top:14px}
.st{background:var(--gl3);border:1px solid var(--ln);border-radius:var(--r2);padding:14px 15px;transition:.2s var(--ease);position:relative;overflow:hidden}
.st:hover{background:var(--gl);transform:translateY(-2px);border-color:var(--ln2)}
.st .v{font-size:25px;font-weight:750;letter-spacing:-1px;line-height:1.05}
.st .v.warm{color:var(--o2)}.st .v.pos{color:var(--gr)}
.st .k{font-size:10px;letter-spacing:1.3px;font-weight:750;color:var(--tx4);margin-top:6px;text-transform:uppercase}
.st .spk{position:absolute;right:0;bottom:0;left:0;height:26px;opacity:.5}

/* ---- feed mode switch ---- */
.fmode{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.fmode button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 17px;border-radius:14px;
 background:var(--gl3);border:1px solid var(--ln);font-size:13.5px;font-weight:650;color:var(--tx2);transition:.2s var(--ease)}
.fmode button:hover{background:var(--gl);color:var(--tx);transform:translateY(-1px)}
.fmode button.on{background:linear-gradient(140deg,rgba(255,110,32,.2),rgba(255,110,32,.06));
 border-color:rgba(255,110,32,.42);color:#fff;box-shadow:0 8px 26px rgba(255,110,32,.14)}
.fmode button i{font-style:normal;font-size:11.5px;opacity:.6;font-weight:700}
.fmode svg{width:16px;height:16px}
.fmode .swipebtn{margin-left:auto;background:linear-gradient(145deg,#FF8036,#EF5B05);color:#fff;border-color:transparent;
 box-shadow:0 6px 22px var(--oGlow)}
.fmode .swipebtn:hover{color:#fff}

/* ---- video cards ---- */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:15px}
.rail2{display:grid;grid-auto-flow:column;grid-auto-columns:186px;gap:14px;overflow-x:auto;padding:3px 3px 14px;scroll-snap-type:x mandatory}
.rail2>*{scroll-snap-align:start}
.vc{cursor:pointer;transition:.24s var(--ease)}
.vc:hover{transform:translateY(-4px)}
.vt{position:relative;aspect-ratio:9/14;border-radius:var(--r2);overflow:hidden;background:#0C0E12;border:1px solid var(--ln);box-shadow:var(--sh)}
.vt img,.vt svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.5s var(--ease)}
.vc:hover .vt img{transform:scale(1.06)}
.vt:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 26%,transparent 42%,rgba(4,6,8,.9) 100%)}
.vo{position:absolute;left:12px;right:12px;bottom:11px;z-index:3}
.vo .t{font-size:12.5px;font-weight:650;color:#fff;line-height:1.28;text-shadow:0 1px 8px rgba(0,0,0,.7);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vo .m{font-size:10.5px;color:rgba(255,255,255,.62);margin-top:3px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vd{position:absolute;top:9px;right:9px;z-index:3;font-size:9px;letter-spacing:.9px;font-weight:800;
 padding:4px 8px;border-radius:7px;background:rgba(8,10,13,.72);backdrop-filter:blur(10px);color:rgba(255,255,255,.8)}
.rk{position:absolute;top:9px;left:9px;z-index:3;width:23px;height:23px;border-radius:8px;display:grid;place-items:center;
 font-size:11.5px;font-weight:800;background:rgba(8,10,13,.75);backdrop-filter:blur(10px);color:#fff}
.rk.g{background:linear-gradient(145deg,#FF8036,#EF5B05);box-shadow:0 3px 12px var(--oGlow)}
.vp{position:absolute;inset:0;z-index:4;display:grid;place-items:center;opacity:0;transition:.24s var(--ease)}
.vc:hover .vp{opacity:1}
.vp div{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;
 background:rgba(255,110,32,.9);backdrop-filter:blur(8px);box-shadow:0 8px 26px rgba(0,0,0,.5);transform:scale(.86);transition:.24s var(--spring)}
.vc:hover .vp div{transform:scale(1)}
.vf{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px 0}
.pill{font-size:9.5px;letter-spacing:.7px;font-weight:750;padding:3.5px 8px;border-radius:7px;background:var(--gl3);border:1px solid var(--ln);color:var(--tx3)}
.pill.hi{background:var(--gr2);border-color:rgba(61,220,132,.24);color:var(--gr)}
.pill.live{background:rgba(255,110,32,.12);border-color:rgba(255,110,32,.26);color:var(--o2)}
.mini{font-size:11px;color:var(--tx4)}

/* ---- detail / player ---- */
.player{display:grid;grid-template-columns:minmax(270px,352px) minmax(0,1fr);gap:26px;align-items:start}
.player>*{min-width:0}
.stage{position:relative;aspect-ratio:9/16;border-radius:24px;overflow:hidden;background:#0A0C0F;
 border:1px solid var(--ln);box-shadow:var(--sh2)}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stagegrad{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:22px 20px;
 background:linear-gradient(180deg,transparent,rgba(5,7,9,.92) 55%)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx3);font-weight:600;margin-bottom:14px;transition:.15s}
.back:hover{color:var(--tx)}

/* ---- forms ---- */
.form{display:grid;gap:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:9.5px;letter-spacing:1.5px;font-weight:800;color:var(--tx4);margin-bottom:7px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;background:var(--gl3);border:1px solid var(--ln);border-radius:12px;
 padding:12px 14px;font-size:13.5px;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(255,110,32,.5);background:var(--gl);box-shadow:0 0 0 3px rgba(255,110,32,.09)}
.field input::placeholder,.field textarea::placeholder{color:var(--tx4)}

/* ---- pay split ---- */
.paysplit{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.paysplit>div{background:var(--gl3);border:1px solid var(--ln);border-radius:var(--r3);padding:12px 13px}
.paysplit b{display:block;font-size:21px;font-weight:800;letter-spacing:-.7px;margin:5px 0 3px}
.paysplit .mini{display:block;line-height:1.4}

/* ---- rows / leaderboard ---- */
.row{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:var(--r2);transition:.18s var(--ease)}
.row+.row{margin-top:4px}
.row:hover{background:var(--gl3)}
.row.me{background:linear-gradient(90deg,rgba(255,110,32,.13),transparent);border:1px solid rgba(255,110,32,.2)}
.rn{width:26px;font-size:13px;font-weight:750;color:var(--tx4);text-align:center;flex:none}
.rnm{flex:1;min-width:0}
.rnm .n{font-size:13.5px;font-weight:650;line-height:1.2}
.rnm .t{font-size:10.5px;letter-spacing:1.1px;font-weight:750;margin-top:3px}
.rx{font-size:15px;font-weight:750;letter-spacing:-.4px}
.rx small{font-size:9.5px;color:var(--tx4);margin-left:3px;font-weight:700}
.av{border-radius:50%;display:grid;place-items:center;font-weight:750;color:#fff;flex:none;
 box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);letter-spacing:-.3px}

/* ---- podium ---- */
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;align-items:end;margin-bottom:16px}
.pc{text-align:center;padding:20px 12px 16px;border-radius:var(--r);background:var(--gl3);border:1px solid var(--ln);position:relative;transition:.24s var(--ease)}
.pc:hover{transform:translateY(-3px);background:var(--gl)}
.pc.p1{padding-top:30px;padding-bottom:24px;background:linear-gradient(170deg,rgba(255,110,32,.16),var(--gl3));border-color:rgba(255,110,32,.26);box-shadow:0 14px 44px rgba(255,110,32,.14)}
.pc .cr{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:22px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.pc .av{margin:0 auto}
.pc .n{font-size:13px;font-weight:700;margin-top:11px;letter-spacing:-.2px}
.pc .x{font-size:23px;font-weight:800;letter-spacing:-.9px;margin-top:9px}

/* ---- tier ladder ---- */
.ladder{display:grid;gap:11px}
.tier{position:relative;border-radius:var(--r);border:1px solid var(--ln);background:var(--gl3);padding:17px 19px;overflow:hidden;transition:.24s var(--ease)}
.tier:hover{background:var(--gl);border-color:var(--ln2);transform:translateY(-2px)}
.tier.cur{border-color:rgba(255,110,32,.42);background:linear-gradient(120deg,rgba(255,110,32,.13),var(--gl3) 58%);box-shadow:0 14px 44px rgba(255,110,32,.13)}
.tier.lock{opacity:.5}
.tier.lock:hover{opacity:.75}
.thead{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.tnum{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.tname{font-size:16px;font-weight:800;letter-spacing:-.4px}
.treq{font-size:11.5px;color:var(--tx3);margin-top:2px}
.tpay{margin-left:auto;text-align:right}
.tpay b{display:block;font-size:20px;font-weight:800;letter-spacing:-.7px;color:var(--gr)}
.tpay span{font-size:9.5px;letter-spacing:1.4px;font-weight:800;color:var(--tx4)}
.tperks{display:grid;gap:6px;margin-top:13px;padding-top:13px;border-top:1px solid var(--ln)}
.tperks div{font-size:12.5px;color:var(--tx2);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.tperks i{color:var(--o);font-style:normal;flex:none;font-size:11px;line-height:1.55}
.treach{display:flex;align-items:center;gap:10px;margin-top:13px}
.treach .t{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.treach .f{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6E20,#FFB36B)}
.treach .l{font-size:10.5px;color:var(--tx4);font-weight:650;white-space:nowrap}
.youare{display:inline-block;vertical-align:middle;margin-left:10px;font-size:8.5px;letter-spacing:1.4px;font-weight:800;padding:4px 9px;border-radius:7px;background:var(--o);color:#fff;box-shadow:0 3px 12px var(--oGlow)}

/* ---- prize pool ---- */
.poolhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;border-radius:var(--r);overflow:hidden;
 border:1px solid var(--ln);background:var(--gl);backdrop-filter:blur(24px);box-shadow:var(--sh2);position:relative}
.poolhero:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent)}
.ph1{padding:22px 24px;background:linear-gradient(140deg,rgba(61,220,132,.13),transparent 62%)}
.ph2{padding:22px 24px;border-left:1px solid var(--ln);background:linear-gradient(140deg,rgba(255,110,32,.11),transparent 62%)}
.poolist{display:grid;gap:3px}
.prow{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:var(--r2);transition:.18s var(--ease)}
.prow:hover{background:var(--gl3)}
.prow.me{background:linear-gradient(90deg,rgba(255,110,32,.15),transparent 72%);box-shadow:inset 0 0 0 1px rgba(255,110,32,.26)}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.1);outline:none;padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;cursor:pointer;
 background:linear-gradient(145deg,#FF8036,#EF5B05);box-shadow:0 3px 12px var(--oGlow),inset 0 1px 0 rgba(255,255,255,.35)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border:0;border-radius:50%;cursor:pointer;background:#EF5B05}

/* ---- prizes ---- */
.prz{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pz{border-radius:var(--r2);padding:16px 17px;background:var(--gl3);border:1px solid var(--ln);transition:.22s var(--ease)}
.pz:hover{transform:translateY(-2px);background:var(--gl)}
.pz b{display:block;font-size:26px;font-weight:800;letter-spacing:-1.1px;color:var(--gr)}
.pz .w{font-size:12.5px;font-weight:650;margin-top:6px}
.pz .d{font-size:11px;color:var(--tx4);margin-top:3px;line-height:1.5}

/* ---- board rows v2 ---- */
.brow{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:11px 13px;border-radius:var(--r2);transition:.18s var(--ease);position:relative}
.brow+.brow{margin-top:3px}
.brow:hover{background:var(--gl3)}
.brow.me{background:linear-gradient(90deg,rgba(255,110,32,.15),transparent 72%);box-shadow:inset 0 0 0 1px rgba(255,110,32,.26)}
.bmeta{display:flex;gap:9px;align-items:center;font-size:10.5px;color:var(--tx4);margin-top:4px;flex-wrap:wrap}
.bmeta b{color:var(--tx3);font-weight:650}
.bbar{height:4px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:7px}
.bbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6E20,#FFB36B);opacity:.85}
.bright{text-align:right;display:flex;align-items:center;gap:11px}
.gap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:17px 20px;border-radius:var(--r);
 background:linear-gradient(120deg,rgba(91,157,255,.1),var(--gl3) 60%);border:1px solid var(--ln)}
.dist{display:flex;height:11px;border-radius:99px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.05)}
.dist i{display:block;height:100%}
.distl{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px}
.distl span{font-size:10.5px;color:var(--tx3);display:flex;align-items:center;gap:6px;font-weight:600}
.distl em{width:8px;height:8px;border-radius:3px;font-style:normal}

/* ---- quests ---- */
.qim{position:relative;width:76px;height:100px;border-radius:12px;overflow:hidden;flex:none;background:#0C0E12;border:1px solid var(--ln)}
.qim img,.qim svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qim:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.75))}
.qxp{position:absolute;left:6px;bottom:5px;z-index:2;font-size:12px;font-weight:800;color:var(--o2);letter-spacing:-.3px;text-shadow:0 1px 6px #000}
.qcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 15px;
 border-radius:var(--r2);background:var(--gl3);border:1px solid var(--ln);transition:.2s var(--ease)}
.qcard:hover{background:var(--gl);transform:translateX(2px);border-color:var(--ln2)}
.qcard.done{opacity:.5}
.qx{display:none}
.qx b{font-size:20px;font-weight:800;letter-spacing:-.7px;color:var(--o2);display:block;line-height:1}
.qx small{font-size:9px;letter-spacing:1.2px;font-weight:800;color:var(--tx4)}
.qtt{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qdd{font-size:11.5px;color:var(--tx3);margin-top:4px;line-height:1.5;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qpr{display:flex;align-items:center;gap:9px;margin-top:9px}
.qbar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.qbf{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6E20,#FFB36B)}
.qhero{position:relative;border-radius:24px;overflow:hidden;min-height:270px;display:flex;align-items:flex-end;
 border:1px solid var(--ln);box-shadow:var(--sh2);cursor:pointer;transition:.26s var(--ease)}
.qhero:hover{transform:translateY(-3px)}
.qhero>svg{position:absolute;inset:0;width:100%;height:100%}
.qhero .qbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) saturate(.75) brightness(.42);transform:scale(1.15)}
.qhero:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(5,7,9,.94) 30%,rgba(5,7,9,.55) 62%,rgba(5,7,9,.75))}
.qhero .in{position:relative;z-index:3;padding:24px 26px;width:100%;display:flex;align-items:center;gap:24px}
.qtxt{flex:1;min-width:0}
.qposter{position:relative;width:132px;flex:none;aspect-ratio:9/16;border-radius:14px;overflow:hidden;border:1px solid var(--ln2);box-shadow:var(--sh2)}
.qposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qposter .pill{position:absolute;left:7px;bottom:7px;z-index:2;background:rgba(8,10,13,.72);backdrop-filter:blur(8px);color:#fff}
.ft{display:inline-block;font-size:9px;letter-spacing:1.8px;font-weight:800;padding:4px 9px;border-radius:7px;
 background:rgba(255,110,32,.9);color:#fff;margin-bottom:9px}

/* ---- grids ---- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);gap:16px}

/* ---- season strip ---- */
.season{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:17px 22px;border-radius:var(--r);
 background:linear-gradient(110deg,rgba(255,110,32,.15),rgba(255,110,32,.03) 55%,transparent);
 border:1px solid rgba(255,110,32,.2);margin-bottom:16px;position:relative;overflow:hidden}
.season h3{font-size:19px;font-weight:800;letter-spacing:-.7px;margin-top:3px}
.season .meta{font-size:12px;color:var(--tx2);margin-top:5px}
.cd{display:flex;gap:8px}
.cd div{min-width:52px;text-align:center;padding:8px 6px;border-radius:12px;background:rgba(8,10,13,.42);border:1px solid var(--ln)}
.cd b{font-size:19px;font-weight:800;letter-spacing:-.7px;display:block;line-height:1}
.cd span{font-size:8.5px;letter-spacing:1.3px;font-weight:800;color:var(--tx4);margin-top:4px;display:block}

/* ---- activity ---- */
.act{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.act:last-child{border-bottom:none}
.act .x{font-size:14px;font-weight:750;color:var(--o2);letter-spacing:-.3px}

/* ---- hover preview ---- */
.vprev{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .32s var(--ease);background:#000}
.vprev.on{opacity:1}
.vprev iframe,.vprev video{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;border:0;object-fit:cover;pointer-events:none}
.vc:hover .vt:after{opacity:.85}

/* ---- swipe feed ---- */
.pushcard{display:flex;gap:13px;align-items:flex-start;padding:15px;border:1px solid var(--ln);border-radius:16px;
 background:linear-gradient(140deg,rgba(255,128,54,.10),var(--gl3));margin-bottom:15px}
.pci{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:var(--gl);color:var(--o2)}
.apalert{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid color-mix(in srgb,var(--warn) 40%,var(--ln));
 border-radius:14px;background:var(--gl3);margin-bottom:14px;cursor:pointer;transition:.2s var(--ease)}
.apalert:hover{background:var(--gl)}
.apalert b{font-size:13.5px;font-weight:700}
/* ---- submissions / approvals ---- */
.apc{display:flex;gap:13px;align-items:flex-start;padding:13px;border:1px solid var(--ln);border-radius:14px;background:var(--gl3)}
.apt{position:relative;flex:0 0 84px;width:84px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#0A0C0F;cursor:pointer;border:1px solid var(--ln)}
.apt img{width:100%;height:100%;object-fit:cover}
.apt .ph{width:100%;height:100%;background:linear-gradient(150deg,#171B21,#0D1014)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.qdrop{display:flex;align-items:center;gap:13px;padding:16px;border:1.5px dashed var(--ln);border-radius:14px;cursor:pointer;
 background:var(--gl3);transition:.2s var(--ease)}
.qdrop:hover{border-color:var(--o2);background:var(--gl)}
.qdi{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;background:var(--gl);color:var(--o2)}
.qdrop b{font-size:14px;font-weight:700}
.qupfile{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--gl3);margin-top:10px}
.qupfile img{width:44px;height:78px;object-fit:cover;border-radius:8px;flex:0 0 44px;background:#000}
.qupfile .ph{width:44px;height:78px;border-radius:8px;flex:0 0 44px;background:linear-gradient(150deg,#171B21,#0D1014)}
.npush{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--ln);border-radius:12px;background:var(--gl3);margin-bottom:13px}
.npush b{font-size:13px}
/* ---- B-roll ---- */
#brview{position:fixed;inset:0;z-index:260;background:#05070A;display:none;flex-direction:column}
#brview.show{display:flex}
.brstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:56px 8px 8px}
.brmedia{height:100%;max-width:min(100%,520px);display:flex;align-items:center;justify-content:center}
.brmedia video,.brmedia img{max-height:100%;max-width:100%;width:auto;border-radius:16px;background:#000;display:block}
.brnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;border:1px solid var(--ln);
 background:rgba(12,14,18,.72);color:#fff;font-size:26px;line-height:1;cursor:pointer;backdrop-filter:blur(8px);z-index:3}
.brnav:hover{background:rgba(30,34,42,.9)}
.brnav.l{left:10px}.brnav.r{right:10px}
.brbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
 border-top:1px solid var(--ln);background:#0A0C10}
.brg{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:13px}
.brc{cursor:pointer;transition:.22s var(--ease);position:relative}
.brc:hover{transform:translateY(-3px)}
.brc.sel .brt{outline:2px solid var(--o2);outline-offset:2px}
.brt{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#0A0C0F;border:1px solid var(--ln)}
.brt img{width:100%;height:100%;object-fit:cover;transition:.3s var(--ease)}
.brc:hover .brt img{transform:scale(1.05)}
.brd{position:absolute;right:7px;bottom:7px;z-index:2;background:rgba(0,0,0,.74);color:#fff;font:600 10.5px/1 ui-monospace,monospace;
 padding:4px 6px;border-radius:5px;letter-spacing:.4px}
.brd.img{letter-spacing:.9px;font-size:9.5px}
.brpick{position:absolute;left:6px;top:6px;z-index:3;width:22px;height:22px;border-radius:99px;border:1.5px solid rgba(255,255,255,.55);
 background:rgba(0,0,0,.3);color:#fff;font-size:12px;font-weight:800;cursor:pointer;padding:0;opacity:.45;transition:.18s var(--ease)}
.brc:hover .brpick,.brc.sel .brpick{opacity:1}
.brc.sel .brpick{background:var(--o2);border-color:transparent}
.brn{font-size:12.5px;font-weight:640;line-height:1.35;margin-top:8px;color:var(--tx);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brm{font-size:11px;color:var(--tx4);margin-top:3px}
.brsel{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;
 background:var(--gl3);margin-bottom:14px}
.brsel b{font-size:13px}
@media(max-width:640px){.brg{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.brnav{display:none}}
#swipe{position:fixed;inset:0;z-index:250;background:#000;display:none}
#swipe.show{display:block}
.swtrack{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.swtrack::-webkit-scrollbar{display:none}
.swcard{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#07080A}
.swcard>img,.swcard>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.swplay{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .3s var(--ease)}
.swplay.on{opacity:1}
.swplay iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
/* Stay transparent until there are real frames, so the poster shows through
   while the clip loads instead of a black rectangle. */
.swplay video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;

.spyrow{display:flex;flex-direction:column;gap:3px}

.spylab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.5}
.spyflag{margin:0;font-size:12.5px;opacity:.75;display:flex;align-items:center;gap:6px}

/* ---- RAVINE-POLISH-V1 ---- */
#nav{overflow-y:auto;overscroll-behavior:contain}
.nlbl{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;
 user-select:none;border-radius:8px;padding-right:6px}
.nlbl:hover{color:var(--tx)}
.nlbl .chev{width:14px;height:14px;flex:0 0 auto;opacity:.5;transition:transform .16s ease}
.ngrp.shut .chev{transform:rotate(-90deg)}
.ngrp.shut .nitm{display:none}
.ngrp{display:flex;flex-direction:column;gap:2px}
.ngrp+.ngrp{margin-top:10px}
.nlbl .cnt{font-size:11px;opacity:.42;font-variant-numeric:tabular-nums}
.ngrp.shut .cnt{opacity:.62}
/* even out the card rhythm across views */
main .g.p{padding:18px}
main .g.p+.g.p{margin-top:14px}
main .stats{gap:12px}
main h2{letter-spacing:-.01em}
main .note{line-height:1.55}
@media(prefers-reduced-motion:reduce){.nlbl .chev{transition:none}}

/* ---- RAVINE-QUESTSOON-V1 ---- */
.nsoon{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:9px;
 border:1px dashed var(--line,#2a2a2a);background:rgba(255,122,26,.05);cursor:default;margin:2px 0}
.nsoon svg{flex:0 0 auto;margin-top:2px;opacity:.55}
.nsoon>span{min-width:0}
.nsoon .st{display:block;font-size:13px;font-weight:600;color:var(--tx);background:none;border:0;padding:0;margin:0;box-shadow:none}
.nsoon .ss{display:block;font-size:11px;line-height:1.35;margin-top:2px;opacity:.6}
.msoon{opacity:.42;pointer-events:none}
.qsoon{text-align:center;padding:52px 22px}
.qsoon .qbadge{display:inline-block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
 color:#ff9a4a;border:1px solid #ff7a1a;border-radius:999px;padding:5px 13px;margin-bottom:18px}
.qsoon h2{margin:0 0 10px;font-size:26px}
.qsoon p{margin:0 auto;max-width:430px;line-height:1.6;opacity:.72}

.mono,.bignum b,.st .v{font-variant-numeric:tabular-nums}
/* tighten the hero number so it stops eating the phone viewport */
.bignum b{}

.pushcard{opacity:.9}
.pushcard .btn{font-size:13px;padding:8px 14px}

.mestick{position:sticky;bottom:10px;z-index:5;margin-top:10px;

/* ---- RAVINE-POLISH-V2 ---- */
.fh-title{font-family:var(--disp);font-weight:800;font-size:54px;line-height:.92;letter-spacing:-.6px;text-transform:uppercase;margin:16px 0 12px}
.fh-title em{font-style:normal;color:var(--o2,#FF9A4A)}
.fh-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.fh-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;min-width:250px;max-width:300px}
.fh-steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--ln);transition:.2s var(--ease)}
.fh-steps li:hover{background:rgba(255,255,255,.07);transform:translateX(3px);border-color:var(--ln2)}

.fh-steps span{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px;line-height:1.4}

.g.p[onclick]{cursor:pointer}
.g.p[onclick]:hover{border-color:var(--ln2);transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.35)}

.btn:active{transform:translateY(0) scale(.985)}
.tbadge{transition:.18s var(--ease)}.tbadge:hover{filter:brightness(1.15);transform:translateY(-1px)}
.mm svg polyline{stroke-dasharray:600;stroke-dashoffset:600;animation:mmdraw 1.3s var(--ease) forwards}
.mm svg circle{opacity:0;animation:mmdot .3s 1.1s ease forwards}
@keyframes mmdraw{to{stroke-dashoffset:0}}
@keyframes mmdot{to{opacity:1}}
#main{animation:fadeup .28s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* RAVINE-MOMENTUM-V1 — cumulative sales, one point per refresh day. Replaces the
   empty "videos to go" ring for anyone who has history; the ring stays for
   brand-new creators. One series, so no legend: the title names it. */
function momentum(c){
 const h=c.hist; if(!h||!h.s||h.s.length<2||h.s[h.s.length-1]<=0) return '';
 const s=h.s, n=s.length, first=s[0], last=s[n-1], delta=last-first;
 const W=228,H=74,PX=6,PY=10;
 const lo=Math.min(...s), hi=Math.max(...s), span=Math.max(1,hi-lo);
 const X=i=>PX+(W-2*PX)*i/(n-1), Y=v=>PY+(H-2*PY)*(1-(v-lo)/span);
 const pts=s.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
 const line=pts.join(' ');
 const area=`${X(0).toFixed(1)},${H} ${line} ${X(n-1).toFixed(1)},${H}`;
 const up=delta>=0;
 const days=(()=>{const a=h.d[0],b=h.d[n-1];const md=(m,d)=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+d);return md(...a.split('-'))+' – '+md(...b.split('-'))})();
 // last-7-days delta if we have enough points
 let wk='';
 if(n>=3){
  // walk back to the first point at least 7 days older than the latest
  const dn=x=>{const [m,d]=x.split('-').map(Number);return m*31+d};
  const lastD=dn(h.d[n-1]); let i7=0;
  for(let i=n-2;i>=0;i--){ if(lastD-dn(h.d[i])>=7){i7=i;break} }
  const dw=last-s[i7], gap=lastD-dn(h.d[i7]);
  wk=`<span class="mmwk">${dw>=0?'+':'-'}$${Math.abs(dw).toLocaleString()} <i>last ${gap} days</i></span>`;}
 return `<div class="mm">
  <div class="mmhead"><span class="lbl">MOMENTUM</span><span class="mmrange">${days}</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-label="Sales over time">
   <defs><linearGradient id="mmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6E20" stop-opacity=".28"/><stop offset="1" stop-color="#FF6E20" stop-opacity="0"/></linearGradient></defs>
   <polygon points="${area}" fill="url(#mmg)"/>
   <polyline points="${line}" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="4.5" fill="#FFB86B" stroke="#14110F" stroke-width="2"/>
  </svg>
  <div class="mmfoot"><b class="mono ${up?'pos':''}">${up?'+':'-'}$${Math.abs(delta).toLocaleString()}</b><span class="mini">since ${days.split(' – ')[0]}</span>${wk}</div>
 </div>`}

/* Each clip is an 8s (inspiration) or 30s (Meta ad) slice inside one big reel
   file. Getting that right is the whole ballgame for how this feels:

   The old order was src -> load() -> play(), then seek to the slice once
   metadata arrived. That seek ABORTED the in-flight play, the play promise
   rejected, and the reject handler forced the video back to muted. Result: the
   first tap looked dead, you tapped again, and it came back silent. One race
   caused all three complaints — the double tap, the delay, and the missing
   sound on inspiration clips (which sit deeper into bigger reels than the ads
   do, so they lost the race far more often).

   Now: point the media fragment at the slice so the very first byte-range
   request already lands in the right place, wait until the video is genuinely
   positioned AND buffered, and only then play. */
function mountSeg(el, ref, muted){
 el.__ref=ref;
 el.muted=!!muted; el.playsInline=true; el.setAttribute('playsinline','');
 el.preload='auto';
 el.src=ref.u+'#t='+ref.s.toFixed(2)+','+(ref.s+ref.d).toFixed(2);
 const land=()=>{ if(Math.abs(el.currentTime-ref.s)>0.3){ try{el.currentTime=ref.s}catch(e){} } };
 el.addEventListener('loadedmetadata',land,{once:true});
 el.addEventListener('timeupdate',()=>{
  if(el.currentTime>=ref.s+ref.d-0.06 || el.currentTime<ref.s-0.5){ try{el.currentTime=ref.s}catch(e){} }
 });
 el.addEventListener('loadeddata',()=>el.classList.add('ready'),{once:true});
 el.load();
 return el;
}

/* Resolves once the clip is both parked on its slice and has enough buffered to
   run. Capped so a bad connection degrades to "plays late" instead of "hangs". */
function segReady(el,cap){
 const ref=el.__ref; if(!ref)return Promise.resolve();
 return new Promise(res=>{
  let done=false;
  const fin=()=>{if(done)return;done=true;
   el.removeEventListener('seeked',chk);el.removeEventListener('canplay',chk);
   el.removeEventListener('canplaythrough',chk);el.removeEventListener('loadeddata',chk);res()};
  const chk=()=>{ if(el.readyState>=3 && Math.abs(el.currentTime-ref.s)<=0.4) fin() };
  el.addEventListener('seeked',chk);el.addEventListener('canplay',chk);
  el.addEventListener('canplaythrough',chk);el.addEventListener('loadeddata',chk);
  chk();
  setTimeout(fin,cap||7000);
 });
}

/* Play immediately — waiting for a full buffer before starting just makes the
   tap feel dead on a slow connection. The only thing worth retrying is an
   AbortError, which means a seek cut the play off; that is settled by the time
   we get here. A genuine autoplay block is the one case that drops to muted. */
async function playSeg(el,wantSound){
 el.muted=!wantSound;
 const go=async()=>{try{await el.play();return true}catch(e){return (e&&e.name)||'Error'}};
 let r=await go();
 if(r===true)return !!wantSound;
 if(r==='AbortError'){ await segReady(el,2500); r=await go(); if(r===true)return !!wantSound }
 if(wantSound){ el.muted=true; if(await go()===true)return false }
 return false;
}

/* ===================== ACTIONS ===================== */
/* The inspiration grid was building all 584 tiles on every single render — a
   4.7 MB HTML string rebuilt when you clicked a card, typed in search, or liked
   something. That is what made opening a video feel like it ignored the first
   click: the click registered, the browser then spent a second re-laying out
   the whole grid. Now it renders a page at a time and appends, so nothing is
   ever rebuilt from scratch. */
const PAGESZ=48;
let LPAGE=1;
window.moreGrid=()=>{
 const L=feedList(), g=document.getElementById('vgrid'); if(!g)return;
 const from=LPAGE*PAGESZ; LPAGE++;
 const next=L.slice(from,LPAGE*PAGESZ);
 if(next.length)g.insertAdjacentHTML('beforeend',next.map((x,i)=>vc(x,null,from+i)).join(''));
 const m=document.getElementById('vmore');
 if(!m)return;
 const left=L.length-LPAGE*PAGESZ;
 if(left<=0)m.remove();
 else m.querySelector('.mini').textContent=left+' left';
};
window.bindGrid=()=>{
 const m=document.getElementById('vmore'); if(!m||!('IntersectionObserver' in window))return;
 const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ const before=LPAGE; moreGrid();
   if(!document.getElementById('vmore')){io.disconnect();return}
   if(LPAGE===before){io.disconnect();return}
   io.observe(document.getElementById('vmore')); } });
 },{rootMargin:'700px'});
 io.observe(m);
};

/* The ordering here is the whole reason Inspiration felt broken. "playable"
   counted a TikTok embed the same as a clip we host, so the first dozen cards
   were all iframes: slow to boot, they swallow the first tap inside TikTok's own
   player, and their audio cannot be controlled from our side because the frame
   is cross-origin. Meta ads are 100% locally hosted, which is why only those
   ever had sound. Rank by what actually plays well in-app. */
const playRank=v=>vref(v)?2:(ttid(v)?1:0);
function feedList(){
 let base=FMODE==='angles'?LIB.filter(isAngle):LIB.filter(isInspo);
 if(FMODE!=='angles')base=base.slice().sort((a,b)=>playRank(b)-playRank(a));
 const q=LQ.toLowerCase();
 return base.filter(v=>(LANG==='All'||v.a===LANG)&&(LFMT==='All'||v.f===LFMT)&&(!q||v.h.toLowerCase().includes(q)||v.a.toLowerCase().includes(q)||(v.br||'').toLowerCase().includes(q)||(v.f||'').toLowerCase().includes(q)||(v.cp||'').toLowerCase().includes(q)));
}

 if(!u){toast('Paste a video link');return}
 const m=u.match(/@([\w.\-]+)/);
 const id=2000+LIB.length;
 LIB.push({id,a:ang,p:'TikTok',u,h:h||(m?'@'+m[1]:'Reference'),sc:'porch',why});

/* ===================== PAYOUT MODEL ===================== */
window.econ=()=>{
 const g=id=>{const el=$('#'+id);return el?(parseFloat(el.value)||0):0};
 ECON={sub:g('eSub'),vol:g('eVol'),tof:g('eTof'),bof:g('eBof'),gmv:g('eGmv'),margin:g('eMar'),qualRate:g('eQr')};
 const roster=CR.filter(x=>!x.admin);
 // split GMV by funnel using the real angle mix in the library
 const bofShare=LIB.filter(v=>BOF_ANGLES.includes(v.a)).length/LIB.length;
 const gmvBof=ECON.gmv*bofShare, gmvTof=ECON.gmv-gmvBof;
 const comm=gmvTof*ECON.tof/100 + gmvBof*ECON.bof/100;
 const subs=ECON.vol*ECON.sub;
 const pool=POOL.amount;
 const monthly=comm+subs+pool;
 const gross=ECON.gmv*ECON.margin/100;
 const contrib=gross-monthly;
 const qualified=Math.round(ECON.vol*ECON.qualRate/100);
 const perQual=qualified?monthly/qualified:0;
 const pctSales=ECON.gmv?monthly/ECON.gmv*100:0;
 const row=(v,k,cls,note)=>`<div class="st"><div class="v ${cls||''} mono">${v}</div><div class="k">${k}</div>${note?`<div class="mini" style="margin-top:5px">${note}</div>`:''}</div>`;
 $('#eOut').innerHTML=`<div class="stats">
  ${row('$'+Math.round(monthly).toLocaleString(),'Creator cost / month','warm')}
  ${row(pctSales.toFixed(1)+'%','Of attributed sales', pctSales>20?'warm':'pos')}
  ${row('$'+Math.round(perQual).toLocaleString(),'Cost per qualified video')}
  ${row((contrib<0?'-$':'$')+Math.abs(Math.round(contrib)).toLocaleString(),'Left after creator cost', contrib>0?'pos':'warm')}
 </div>
 <div class="note" style="margin-top:13px">${contrib>0
   ? `At these settings the program clears <b style="color:var(--gr)">$${Math.round(contrib).toLocaleString()}</b> a month after paying creators, and creators take <b style="color:var(--tx)">${pctSales.toFixed(1)}%</b> of attributed sales.`
   : `<b style="color:var(--o2)">These settings lose money.</b> Creator cost exceeds gross profit by $${Math.abs(Math.round(contrib)).toLocaleString()} a month. Drop the per-submission rate or the commission.`}
  Commission is <b style="color:var(--tx)">$${Math.round(comm).toLocaleString()}</b>, the ${POOL.month} pool is a fixed <b style="color:var(--tx)">$${pool.toLocaleString()}</b>, and per-submission is <b style="color:var(--tx)">$${Math.round(subs).toLocaleString()}</b>.
  ${ECON.sub>0?` That per-submission line is ${Math.round(subs/monthly*100)}% of your spend and the only one that pays for effort rather than results.`:` You are paying nothing per submission — every dollar is tied to a sale, a pool share, or a milestone.`}</div>`;

 const at=t=>roster.filter(x=>x.xp>=t.xp).length;
 const oneOff=XPT;
 $('#ePrz').innerHTML=`<div class="stats">${oneOff.map(t=>{const n=at(t);
  return `<div class="st"><div class="v mono" style="font-size:21px">${n}</div><div class="k">at ${t.xp} XP · $${t.one.toLocaleString()} each</div>
   <div class="mini" style="margin-top:5px">$${(n*t.one).toLocaleString()} owed</div></div>`}).join('')}</div>
  <div class="note" style="margin-top:12px">Total XP-bonus exposure at today's XP standings: <b style="color:var(--gr)">$${oneOff.reduce((s,t)=>s+at(t)*t.one,0).toLocaleString()}</b>. Plus the monthly sales prizes if anyone clears $10k, $25k or $50k GMV.</div>`;
};

/* ===================== SWIPE FEED (mobile-first) ===================== */
let SWI=0, SWT=null;
function swMount(){
 const tr=$('#swtrack'); if(!tr)return;
 const L=feedList();
 [...tr.children].forEach((s,n)=>{
  const holder=s.querySelector('.swplay');
  if(!holder)return;
  // Mount the current card AND the next one. The next sits paused and buffering,
  // so a swipe is instant instead of starting the whole fetch-and-seek from cold.
  const near = (n===SWI||n===SWI+1);
  if(near){
   if(holder.firstChild){ if(n===SWI){const vd=holder.querySelector('video'); if(vd&&vd.paused)playSeg(vd,!SWMUTE)} return }
   const v=L[n], ref=vref(v), id=ttid(v);
   if(ref){
    const el=document.createElement('video');
    el.controls=false;
    mountSeg(el, ref, n===SWI?SWMUTE:true);
    el.addEventListener('click',async e=>{e.stopPropagation();
     if(SWMUTE){ SWMUTE=false;setMutePref(false);paintMute();
      const ok=await playSeg(el,true);
      if(!ok){SWMUTE=true;setMutePref(true);paintMute()}
      return }
     if(el.paused)playSeg(el,!SWMUTE); else el.pause();});
    holder.appendChild(el); holder.classList.add('on');
    if(n===SWI){
     holder.classList.add('load');
     playSeg(el,!SWMUTE).then(ok=>{
      holder.classList.remove('load');
      if(!ok&&!SWMUTE){SWMUTE=true;setMutePref(true);paintMute()}
     });
    }
   } else if(id){
    if(n!==SWI)return;                        // only embed the visible one
    const f=document.createElement('iframe');
    f.src=ttsrc(id,true); f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.setAttribute('allowfullscreen','');
    holder.appendChild(f); holder.classList.add('on');
   }
  } else if(holder.firstChild){
   const vid=holder.querySelector('video'); if(vid){vid.pause();vid.removeAttribute('src');vid.load()}
   holder.innerHTML=''; holder.classList.remove('on','load');
  }
 });
}
// read straight from storage: lsGet lives in a file that loads after this one
let SWMUTE=(()=>{try{return localStorage.getItem('rcg_mute')!=='false'}catch(e){return true}})();
const setMutePref=v=>{try{localStorage.setItem('rcg_mute',v?'true':'false')}catch(e){}};
window.swMute=async()=>{
 const tr=$('#swtrack'); const card=tr&&tr.children[SWI];
 if(card&&card.querySelector('.swplay iframe')){toast('TikTok controls its own sound — tap the video');return}
 SWMUTE=!SWMUTE;setMutePref(SWMUTE);paintMute();
 const v=card&&card.querySelector('.swplay video');
 if(!v)return;
 if(SWMUTE){v.muted=true;return}
 const ok=await playSeg(v,true);
 if(!ok){SWMUTE=true;setMutePref(true);paintMute();toast('Your browser blocked sound — tap the video itself')}};
function paintMute(){const b=$('#swMuteBtn'); if(!b)return;
 const tr=$('#swtrack');
 const card=tr&&tr.children[SWI];
 const isEmbed=!!(card&&card.querySelector('.swplay iframe'));
 if(isEmbed){
  // A cross-origin TikTok frame will not take instructions about its own audio.
  // Saying TAP FOR SOUND here would be a lie, so say what is actually true.
  b.className='swx wide off';
  b.innerHTML=ico('mute',18)+'<span>TIKTOK PLAYER · TAP IT</span>';
  return;
 }
 b.className='swx wide'+(SWMUTE?' off':'');
 b.innerHTML=SWMUTE?ico('mute',18)+'<span>TAP FOR SOUND</span>':ico('sound',18)+'<span>SOUND ON</span>';
}

/* ===================== HOVER PREVIEW (desktop grid) ===================== */
let HOVT=null, HOVEL=null;
function hoverIn(el,vid){
 if(window.matchMedia('(hover:none)').matches)return;
 const v=LIB.find(x=>x.id===vid); if(!v)return;
 const ref=vref(v), id=ttid(v);
 if(!ref&&!id)return;
 clearTimeout(HOVT);
 HOVT=setTimeout(()=>{
  hoverOut(true);
  const vt=el.querySelector('.vt'); if(!vt)return;
  const h=document.createElement('div');h.className='vprev';
  if(ref){
   const m=document.createElement('video');
   mountSeg(m, ref, true);
   h.appendChild(m);vt.appendChild(h);HOVEL=h;
   playSeg(m,false);
  }else{
   const f=document.createElement('iframe');
   f.src=ttsrc(id,true);f.allow='autoplay; encrypted-media; picture-in-picture';
   h.appendChild(f);vt.appendChild(h);HOVEL=h;
  }
  requestAnimationFrame(()=>h.classList.add('on'));
 },420);
}
function hoverOut(){clearTimeout(HOVT);
 if(HOVEL){const v=HOVEL.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}
  HOVEL.remove();HOVEL=null}}
window.hoverIn=hoverIn;window.hoverOut=hoverOut;

/* ===================== PRIZE POOL SPLIT ===================== */
/* Pool shares are computed at build time from data nobody but the brand holds.
   Every creator receives only their own pct/amt in their private file. The list
   below is ordering plus your own row — there is nothing here to reverse. */
function poolShares(){
 const roster=ACTIVE().filter(x=>!x.admin);
 return roster.slice().sort((a,b)=>(a.rank||999)-(b.rank||999))
  .map(x=>({c:x, pct:(x.pool?x.pool.pct:0), amt:(x.pool?x.pool.amt:0)}));
}
const myShare=()=>poolShares().find(r=>r.c.id===ME)||null;
window.setPool=()=>{
 const g=id=>{const e=$('#'+id);return e?(parseFloat(e.value)||0):0};
 POOL.amount=g('pAmt');
 let wg=Math.max(0,Math.min(100,g('pW')));
 POOL.wGmv=wg;POOL.wSub=100-wg;
 const lbl=$('#pWlbl');if(lbl)lbl.textContent=`${POOL.wGmv}% sales · ${POOL.wSub}% submissions`;
 paintPool();try{econ()}catch(e){}
};
function paintPool(full){
 const el=$('#poolOut');if(!el)return;
 const isAdmin=full===true||me().admin;
 const rows=poolShares();
 el.innerHTML=`<div class="poolist">${rows.map((r,i)=>{
  const mine=r.c.id===ME;
  const show=isAdmin||mine;
  return `<div class="prow ${mine?'me':''}">
  <div class="rn mono">${i+1}</div>${av(r.c,32,12)}
  <div style="min-width:0;flex:1">
   <div style="font-size:13px;font-weight:650">${esc(r.c.n)}${mine?' <span style="color:var(--o2)">· you</span>':''}</div>
   <div class="bbar" style="margin-top:6px"><i style="width:${Math.round(r.pct/rows[0].pct*100)}%"></i></div>
   <div class="bmeta" style="margin-top:5px">${show?`<b>$${r.c.sales.toLocaleString()}</b> sales <b>${r.c.v}</b> approved`:`<b>${r.c.v}</b> approved`}</div></div>
  <div style="text-align:right">${show

function ago(iso){
 const ms=Date.now()-new Date(iso).getTime();
 if(!isFinite(ms))return '';
 const m=Math.round(ms/60000);
 if(m<1)return 'just now';
 if(m<60)return m+'m ago';
 const h=Math.round(m/60); if(h<24)return h+'h ago';
 return Math.round(h/24)+'d ago';
}
/* ---- LIVE TRACKER -------------------------------------------------------
   The pill goes green the moment a data feed exists at ./data.json next to
   index.html. Shape:
     {"at":"<ISO timestamp>","source":"Trybe","trybeSales":0,
      "metaSales":0,"creators":[{"n":"<creator name>","v":0,"sub":0,"sales":0,"$":0}]}
   Match creators by name. Anything missing is left as-is. Re-checks every 5 min. */
async function pullFeed(){
 try{
  const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)return false;
  const d=await r.json();
  if(!d||!d.at)return false;
  if(Array.isArray(d.creators)){
   d.creators.forEach(row=>{
    const c=CR.find(x=>x.n.toLowerCase()===String(row.n||'').toLowerCase());
    if(!c)return;
    ['v','sub','sales','$','xp'].forEach(k=>{ if(row[k]!=null)c[k]=row[k] });
   });

  SYNC.at=d.at; SYNC.live=true;

  if(d.trybeSales!=null)SYNC.trybeSales=d.trybeSales;
  if(d.metaSales!=null)SYNC.metaSales=d.metaSales;
  return true;
 }catch(e){ return false }
}

let APF='pending';
window.setAPF=v=>{APF=v;render()};
function subCard(s,adminView){
 const st=s.status;
 const badge=st==='pending'?'<span class="pill warn">● Waiting</span>':st==='approved'?'<span class="pill live">✓ Approved</span>':'<span class="pill bad">Sent back</span>';
 return `<div class="apc">
  <div class="apt" onclick="playSub('${s.id}')">
   ${s.poster?`<img src="${s.poster}" alt="">`:'<div class="ph"></div>'}
   <div class="vp"><div>▶</div></div>
   ${s.dur?`<span class="brd">${Math.floor(s.dur/60)}:${String(s.dur%60).padStart(2,'0')}</span>`:''}</div>
  <div style="min-width:0;flex:1">
   <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${badge}<span class="mini">${agoTs(s.ts)==='just now'?'just now':agoTs(s.ts)+' ago'}</span></div>
   <div style="font-size:14px;font-weight:700;letter-spacing:-.2px;margin-top:6px">${esc(s.qtitle)}</div>
   <div class="mini" style="margin-top:3px">${adminView?esc(s.cname)+' · ':''}${esc(s.file)} · ${(s.size/1048576).toFixed(1)} MB · worth +${s.xp*M()} XP</div>
   ${s.note?`<div class="mini" style="margin-top:6px;color:var(--tx2)">“${esc(s.note)}”</div>`:''}
   ${s.reason?`<div class="note" style="margin-top:8px;padding:9px 11px"><b style="color:var(--tx)">Notes back.</b> ${esc(s.reason)}</div>`:''}
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">
    <button class="btn sm gh" onclick="playSub('${s.id}')">${ico('play',14)} Watch</button>
    ${adminView&&st==='pending'?`<button class="btn sm" onclick="decideQ('${s.id}','approved')">Approve · +${s.xp*M()} XP</button>
     <button class="btn sm gh" onclick="decideQ('${s.id}','denied')">Send back</button>`:''}
    ${s.link?`<a class="btn sm gh" href="${esc(s.link)}" target="_blank" rel="noopener">${ico('ext',14)} Their post</a>`:''}
   </div></div></div>`;
}
function approvalsView(){
 /* RAVINE-QUESTSOON-V1 */ if(!me().admin)return QSOON_VIEW();
 const admin=me().admin;
 const all=admin?SUBS:SUBS.filter(s=>s.cid===ME);
 const pend=all.filter(s=>s.status==='pending');
 const app=all.filter(s=>s.status==='approved');
 const den=all.filter(s=>s.status==='denied');
 const L=APF==='pending'?pend:APF==='approved'?app:APF==='denied'?den:all;
 const xpOut=app.reduce((a,s)=>a+s.xp*M(),0);
 /* SUBSFIX-V1 */
 const meC=me(), meRate=meC.sub?Math.round(meC.v/meC.sub*100):0;
 return `${bar(admin?'Approvals':'My submissions',
   admin?'Every quest video waiting on you. Points only move when you approve — nothing is automatic.'
        :'Your Ravine submissions and where each one stands.')}
 <div class="anim">
 ${admin&&!LIVE()?`<div class="note" style="margin-bottom:15px;border-color:var(--warn)"><b style="color:var(--warn)">Running on this device.</b> Submissions and approvals are stored in this browser until a backend is connected — creators on their own phones won’t sync yet. <button class="btn sm gh" style="margin-left:8px" onclick="go('admin')">Connect one</button></div>`:''}
 ${admin?`<div class="stats three" style="margin-bottom:16px">
  <div class="st"><div class="v mono" style="color:${pend.length?'var(--warn)':'var(--tx)'}">${pend.length}</div><div class="k">waiting on you</div></div>
  <div class="st"><div class="v mono" style="color:var(--gr)">${app.length}</div><div class="k">approved</div></div>
  <div class="st"><div class="v mono">${xpOut.toLocaleString()}</div><div class="k">XP awarded</div></div>
 </div>`:`<div class="stats three" style="margin-bottom:16px">
  <div class="st"><div class="v mono">${meC.sub}</div><div class="k">submitted to Ravine</div></div>
  <div class="st"><div class="v mono" style="color:var(--gr)">${meC.v}</div><div class="k">approved</div></div>
  <div class="st"><div class="v mono">${meRate}%</div><div class="k">approval rate</div></div>
 </div>
 <div class="note" style="margin-bottom:18px">That is your record on Trybe. Open <b style="color:var(--tx)">Analytics</b> to see the spend and hook rate behind each video.</div>
 <h3 style="margin:0 0 4px">Quest entries</h3>
 <div class="sub" style="margin-bottom:12px">Videos you have sent in for a quest inside this app. Separate from your Trybe submissions above.</div>`}
 <div class="chips row">
  <button class="chip ${APF==='pending'?'on':''}" onclick="setAPF('pending')">Waiting<i>${pend.length}</i></button>
  <button class="chip ${APF==='approved'?'on':''}" onclick="setAPF('approved')">Approved<i>${app.length}</i></button>
  <button class="chip ${APF==='denied'?'on':''}" onclick="setAPF('denied')">Sent back<i>${den.length}</i></button>
  <button class="chip ${APF==='all'?'on':''}" onclick="setAPF('all')">Everything<i>${all.length}</i></button>
 </div>
 <div style="display:grid;gap:12px">${L.map(s=>subCard(s,admin)).join('')||
   `<div class="note">${admin?(APF==='pending'?'Nothing waiting. You are clear.':'Nothing here yet.'):'You have not entered a quest in the app yet. Your Trybe submissions are counted above.'}</div>`}</div>
 </div>`;
}
/* ---------- the upload panel that lives inside a quest ---------- */
function questUpload(q){
 const cl=claimed(q.id);
 const mine=subsFor(ME,q.id);
 const pend=mine.filter(s=>s.status==='pending');
 if(!cl)return `<div class="g p" style="margin-top:14px" id="qUpWrap"><h3>Take this quest</h3>
  <div class="sub">Claim it, cut it, upload it here. Austin watches it and approves — that is when the ${q.x*M()} XP lands.</div>
  <button class="btn" style="margin-top:14px" onclick="claimQ(${q.id})">${ico('target',16)} I'm working on this quest</button></div>`;
 return `<div class="g p" style="margin-top:14px" id="qUpWrap">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
   <h3 style="margin:0">Upload your video</h3><span class="pill live">● Claimed</span></div>
  <div class="sub" style="margin-top:6px">Attach the cut. It stays on your phone — Austin gets it to review, and the ${q.x*M()} XP lands the moment he approves.</div>
  <div class="form" style="margin-top:14px">
   <label class="qdrop" for="qUpInput">
    <input type="file" id="qUpInput" accept="video/*" hidden onchange="pickQFile(this,${q.id})">
    <div class="qdi">${ico('play',22)}</div>
    <div><b>Choose your video</b><div class="mini">MP4 or MOV, up to 500MB</div></div>
   </label>
   <div id="qUpState"></div>
   <div class="field"><label>Where you posted it <span class="mini">(optional)</span></label>
    <input id="qUpLink" placeholder="Paste the TikTok / Reels / Trybe link"></div>
   <div class="field"><label>Anything Austin should know <span class="mini">(optional)</span></label>
    <input id="qUpNote" placeholder="Shot at the range at golden hour, hook lands at 1s"></div>
   <div style="display:flex;gap:9px;flex-wrap:wrap">
    <button class="btn" id="qSendBtn" onclick="sendQ(${q.id})">Send for approval</button>
    <button class="btn gh" onclick="unclaimQ(${q.id})">Drop this quest</button></div>
  </div>
  ${mine.length?`<div class="sec" style="margin-top:20px"><h2 style="font-size:14px">Your submissions to this quest</h2>
    <span class="mini">${pend.length} waiting</span></div>
   <div style="display:grid;gap:11px">${mine.map(s=>subCard(s,false)).join('')}</div>`:''}
  </div>`;
}

function v2hist(vals,mine,lo,hi,step,unit){
 const bins=[]; for(let x=lo;x<hi;x+=step)bins.push({a:x,b:x+step,n:0});
 vals.forEach(v=>{const i=Math.min(bins.length-1,Math.max(0,Math.floor((v-lo)/step)));bins[i].n++});
 const mx=Math.max(1,...bins.map(b=>b.n));
 const mi=mine==null?-1:Math.min(bins.length-1,Math.max(0,Math.floor((mine-lo)/step)));
 return `<div class="hgm">${bins.map((b,i)=>`<div class="hgb ${i===mi?'mine':''}" title="${b.a}–${b.b}${unit}: ${b.n} video${b.n===1?'':'s'}">
   <i style="height:${(b.n/mx*100).toFixed(1)}%"></i></div>`).join('')}</div>
  <div class="hgx">${bins.map((b,i)=>`<span>${(i%2===0)?b.a:''}</span>`).join('')}</div>`;
}

/* RAVINE-POLISH-V2 — hero number counts up once per value, not on every render.
   Honors prefers-reduced-motion. */
const _CU={};
function countUp(){
 const els=document.querySelectorAll('[data-countup]'); if(!els.length) return;
 const rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
 els.forEach(el=>{
  const to=+el.dataset.countup||0, pre=el.dataset.prefix||'', key=ME+':'+VIEW+':'+to;
  if(rm||_CU[key]||to<=0){ el.textContent=pre+to.toLocaleString(); _CU[key]=1; return; }
  _CU[key]=1;
  const from=0, t0=performance.now(), dur=Math.min(1400,700+to/40);
  const ease=x=>1-Math.pow(1-x,3);
  const step=()=>{ const k=Math.max(0,Math.min(1,(performance.now()-t0)/dur)); const v=Math.round(from+(to-from)*ease(k));
   el.textContent=pre+v.toLocaleString(); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
 });
}

 const angOf=v=>v.a||'Untagged';
 const counts={}; ADP.forEach(v=>{const a=angOf(v);counts[a]=(counts[a]||0)+1});
 const angs=['All',...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];

 if(ADSEL){
  const v=ADP.find(x=>x.s===ADSEL);
  if(v){
   const peers=ADP.filter(x=>x.c===v.c&&x.s!==v.s).sort((a,b)=>b.sp-a.sp).slice(0,6);
   return `${bar('Ad performance','One creative, and what the account did with it.')}
   <button class="btn gh" onclick="adBack()" style="margin-bottom:15px">${ico('chart',16)} Back to all ads</button>
   <div class="adwrap">
    <div class="adplayer"><video controls playsinline preload="none" poster="${th(v.s)}" src="${vu(v.s)}"></video></div>
    <div style="flex:1;min-width:260px">
     <div class="g p">
      <h3>${esc(v.c)}</h3><div class="sub">Posted ${esc(v.d)} &middot; ${esc(angOf(v))}</div>
      <div class="stats" style="margin-top:15px">
       <div class="st"><div class="v mono">${mo(v.sp)}</div><div class="k">ad spend behind it</div></div>
       <div class="st"><div class="v mono">${v.hk?v.hk.toFixed(1)+'%':'&mdash;'}</div><div class="k">hook rate</div></div>
      </div>
      <div class="note" style="margin-top:15px">Spend is the account voting with money. If a video is still holding budget, it is working.</div>
     </div>
     <div class="g p" style="margin-top:15px">
      <h3>Why it worked</h3>
      <div class="sub">Being written from the transcript. Not up yet for this one.</div>
     </div>
    </div>
   </div>
   ${peers.length?`<div class="sec"><h2>More from ${esc(v.c)}</h2><span class="mini">${peers.length}</span></div>
   <div class="adgrid">${peers.map(card).join('')}</div>`:''}`;
  }
 }

 function card(v){
  return `<div class="vc adcard" onclick="adOpen('${v.s}')">
   <div class="vt"><img src="${th(v.s)}" loading="lazy" alt="">
    <span class="vd">${mo(v.sp)}</span>
    ${v.hk?`<span class="rk ${v.hk>=45?'g':''}">${Math.round(v.hk)}%</span>`:''}</div>
   <div class="adm"><b>${esc(v.c)}</b><span>${esc(v.d)}</span></div></div>`;
 }

 let L=ADP.slice();
 const q=(ADQ||'').toLowerCase();
 if(q)L=L.filter(x=>x.c.toLowerCase().includes(q)||angOf(x).toLowerCase().includes(q));
 if(ADANG!=='All')L=L.filter(x=>angOf(x)===ADANG);
 if(ADSORT==='hook')L.sort((a,b)=>(b.hk||0)-(a.hk||0));
 else if(ADSORT==='new')L.sort((a,b)=>new Date(b.d)-new Date(a.d));
 else L.sort((a,b)=>b.sp-a.sp);

 const tot=ADP.reduce((n,x)=>n+x.sp,0), nCr=new Set(ADP.map(x=>x.c)).size;
 return `${bar('Ad performance',`Every Ravine creative with real money behind it. ${ADP.length} videos, ${mo(tot)} of spend, ${nCr} creators. Tap any one to watch it and see its numbers.`)}
  <div class="fmode">
   <button class="${ADSORT==='spend'?'on':''}" onclick="adSort('spend')">${ico('chart',16)} Most spend</button>
   <button class="${ADSORT==='hook'?'on':''}" onclick="adSort('hook')">${ico('flame',16)} Best hook</button>
   <button class="${ADSORT==='new'?'on':''}" onclick="adSort('new')">${ico('play',16)} Newest</button>
  </div>
  <div class="chips"><input class="search" placeholder="Search a creator" value="${esc(ADQ)}" oninput="adQ(this.value)">
   ${angs.map(a=>`<button class="chip ${ADANG===a?'on':''}" onclick="adAng('${esc(a)}')">${esc(a)}${a!=='All'?` <i>${counts[a]}</i>`:''}</button>`).join('')}</div>
  ${L.length?`<div class="adgrid">${L.map(card).join('')}</div>`
    :`<div class="g p"><h3>Nothing here</h3><div class="sub">No creative matches that filter.</div></div>`}
  <div class="note" style="margin-top:18px">These are our own ads, pulled from Trybe. Numbers refresh when the board does. Recreate the structure, never the script.</div>`;
};
window.adOpen=s=>{ADSEL=s;render();scrollTop()};
window.adBack=()=>{ADSEL=null;render();scrollTop()};
window.adSort=k=>{ADSORT=k;render()};
window.adAng=a=>{ADANG=a;ADSEL=null;render()};
window.adQ=v=>{ADQ=v;ADSEL=null;render()};
