<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ravine Creator Games</title>
<link rel="icon" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#07080A">
<style>/* Ravine Creator Games · October build · design tokens from the live app, extended */
@font-face{font-family:'BC';font-weight:600;font-style:normal;font-display:swap;src:url('./fonts/bc-600.woff2') format('woff2')}
@font-face{font-family:'BC';font-weight:700;font-style:normal;font-display:swap;src:url('./fonts/bc-700.woff2') format('woff2')}
@font-face{font-family:'BC';font-weight:800;font-style:normal;font-display:swap;src:url('./fonts/bc-800.woff2') format('woff2')}
:root{
  --bg:#07080A;--bg2:#0B0D11;--sf:#111419;--sf2:#161A21;--sf3:#1D222B;
  --ln:rgba(255,255,255,.085);--ln2:rgba(255,255,255,.14);
  --tx:#EDEFF2;--tx2:#B4BAC5;--tx3:#848C99;--tx4:#5A6270;
  --o:#FF6E20;--o2:#FFA25C;--o-ink:#1A0A00;--o-soft:rgba(255,110,32,.14);
  --gold:#E8B64A;--gold-soft:rgba(232,182,74,.14);
  --gr:#3DDC84;--gr-soft:rgba(61,220,132,.14);--bl:#5B9DFF;--bl-soft:rgba(91,157,255,.14);
  --warn:#FFB020;--warn-soft:rgba(255,176,32,.16);--bad:#FF5C4D;--bad-soft:rgba(255,92,77,.14);
  --r:18px;--r2:12px;--r3:8px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --disp:'BC',var(--f);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,1,.36,1);
  --sb:248px;--gut:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:var(--o2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r3);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--o);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
img{max-width:100%;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);letter-spacing:.2px}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.1;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
p{color:var(--tx2)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shell */
.shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--ln);background:var(--bg2);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-family:var(--disp);font-size:18px;letter-spacing:.3px}
.brand small{display:block;color:var(--tx3);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.ngrp{margin-top:8px}
.nlbl{font-size:11px;letter-spacing:1.6px;color:var(--tx4);font-weight:700;padding:6px 10px 4px}
.nitm{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:var(--tx2);font-weight:600;font-size:14px;text-align:left}
.nitm:hover{background:var(--sf);color:var(--tx)}
.nitm.on{background:var(--o-soft);color:var(--o2)}
.nitm svg{width:18px;height:18px;flex:none}
.nitm .pip{margin-left:auto;background:var(--o);color:var(--o-ink);font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;font-family:var(--mono)}
.main{min-width:0;padding:24px clamp(16px,3vw,40px) 90px}
.who{margin-top:auto;padding:12px 10px;border-top:1px solid var(--ln);font-size:13px;color:var(--tx3)}
.who b{display:block;color:var(--tx);font-size:14px}
.mobbar,.mobtop{display:none}
.mode{position:fixed;top:10px;right:12px;z-index:60;background:var(--sf2);border:1px solid var(--ln2);color:var(--tx2);font-size:12px;padding:6px 10px;border-radius:99px;box-shadow:var(--sh);font-family:var(--mono)}
.mode.fx{border-color:var(--warn);color:var(--warn)}
.mode:not(.fx){display:none}
@media (max-width:900px){
  :root{--gut:16px}
  .mode{top:auto;bottom:78px;right:8px;font-size:11px}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobtop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;background:rgba(7,8,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px var(--gut)}
  .mobtop .brand{padding:0}.mobtop .brand b{font-size:16px}
  .mobtop button.menu{padding:8px 10px;border:1px solid var(--ln2);border-radius:10px;color:var(--tx2);font-weight:600;font-size:13px}
  .main{padding:16px var(--gut) 96px}
  .mobbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,13,17,.96);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--tx3);padding:6px 2px;border-radius:10px}
  .mobbar button svg{width:20px;height:20px}
  .mobbar button.on{color:var(--o2)}
  .mode{bottom:78px}
  .sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none}
  .sheet.open{display:block}
  .sheet .inner{position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--bg2);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--ln2)}
}
@media (min-width:901px){.sheet{display:none}}

/* ---- page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--o2);font-weight:700;margin-bottom:6px}
.ph p{margin-top:6px;max-width:640px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---- surfaces */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card.hi{border-color:rgba(255,110,32,.4);background:linear-gradient(180deg,rgba(255,110,32,.07),transparent 60%),var(--sf)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gauto{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2{font-size:19px}
.sec .mini{color:var(--tx3)}
.mini{font-size:13px;color:var(--tx3)}
.small{font-size:13px;color:var(--tx2)}
.muted{color:var(--tx3)}
.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-weight:700}
.hr{height:1px;background:var(--ln);margin:14px 0}
.divider{border-top:1px solid var(--ln);margin:14px 0}

/* ---- metric cards */
.metric{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:14px 16px;min-width:0}
.metric .k{font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.3px}
.metric .v{font-family:var(--disp);font-size:28px;font-weight:800;margin-top:4px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.metric .v.na{color:var(--tx4);font-size:18px;font-family:var(--f);font-weight:600}
.metric .sub{font-size:12px;color:var(--tx3);margin-top:3px}
.metric.gold .v{color:var(--gold)}.metric.orange .v{color:var(--o2)}.metric.green .v{color:var(--gr)}

/* ---- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--o);color:var(--o-ink);border:1px solid transparent;min-height:40px;transition:transform .12s var(--ease),filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.07);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.gh{background:transparent;color:var(--tx);border-color:var(--ln2)}
.btn.gh:hover{background:var(--sf2)}
.btn.soft{background:var(--o-soft);color:var(--o2)}
.btn.sm{padding:7px 12px;min-height:32px;font-size:13px;border-radius:9px}
.btn.gold{background:var(--gold);color:#241A05}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled],.btn.pending{opacity:.55;cursor:not-allowed;filter:none}
.btn.pending::after{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn svg{width:16px;height:16px}
.link{color:var(--o2);font-weight:600}

/* ---- badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.2px;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.n{background:var(--sf3);color:var(--tx2)}         /* neutral / available */
.badge.p{background:var(--bl-soft);color:var(--bl)}      /* in progress */
.badge.r{background:var(--warn-soft);color:var(--warn)}  /* in review / pending */
.badge.g{background:var(--gr-soft);color:var(--gr)}      /* approved / eligible */
.badge.c{background:var(--o-soft);color:var(--o2)}       /* changes needed */
.badge.x{background:var(--bad-soft);color:var(--bad)}    /* rejected / excluded */
.badge.d{background:var(--gold-soft);color:var(--gold)}  /* draft / gold */
.badge.v{background:var(--sf3);color:var(--tx3);border-color:var(--ln2);border-style:dashed}  /* verification needed */
.badge.noicon::before{display:none}
.xp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:13px}

/* ---- progress */
.bar{height:8px;background:var(--sf3);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--o);border-radius:99px;transition:width .5s var(--ease)}
.bar.gold i{background:var(--gold)}.bar.green i{background:var(--gr)}.bar.blue i{background:var(--bl)}
.bar .tick{position:absolute;top:-3px;width:2px;height:14px;background:var(--tx2)}
.plabel{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-bottom:5px;font-weight:600}
.plabel b{color:var(--tx)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:6px;border-radius:99px;background:var(--sf3)}.steps i.on{background:var(--o)}.steps i.pend{background:var(--warn)}

/* ---- quest cards */
.qcard{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s var(--ease);cursor:pointer;text-align:left;width:100%;color:inherit}
.qcard:hover{border-color:var(--ln2);transform:translateY(-1px)}
.qcard:focus-visible{outline:2px solid var(--o)}
.qcard .art{width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--sf3);flex:none}
.qcard .art svg{width:100%;height:100%}
.qcard .ttl{font-family:var(--disp);font-size:18px;font-weight:700;line-height:1.15}
.qcard .out{color:var(--tx2);font-size:13.5px;margin-top:3px;line-height:1.45}
.qcard .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.qcard .foot .btn{margin-left:auto}
.qcard.done{opacity:.85}
.qcard .prog{margin-top:10px}
@media (max-width:640px){.qcard{grid-template-columns:72px 1fr}.qcard .art{width:72px;height:72px}.qcard .foot .btn{margin-left:0;width:100%}}
.featured{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center}
@media (max-width:800px){.featured{grid-template-columns:1fr}}
.featured .art{border-radius:14px;overflow:hidden;background:var(--sf3);aspect-ratio:16/7;max-height:220px}
.featured .art svg{width:100%;height:100%}

/* ---- filters / tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--tx2);font-weight:600;font-size:13px;background:var(--sf)}
.tabs button.on{background:var(--o-soft);color:var(--o2);border-color:rgba(255,110,32,.4)}
.tabs button i{font-style:normal;font-family:var(--mono);color:var(--tx3);margin-left:5px;font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.filters input[type=search]{max-width:280px}
.filters select{width:auto}

/* ---- drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg2);border-left:1px solid var(--ln2);z-index:81;transform:translateX(100%);transition:transform .28s var(--ease);overflow:auto;padding:20px 22px 40px;box-shadow:var(--sh)}
.drawer.open{transform:none}
.drawer .close{position:sticky;top:0;float:right;z-index:2;background:var(--sf2);border:1px solid var(--ln2);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;color:var(--tx2)}
.drawer h2{margin-top:6px;padding-right:48px}
.drawer .art{aspect-ratio:16/7;max-height:200px;border-radius:14px;overflow:hidden;background:var(--sf3);margin:14px 0}
.drawer .art svg,.drawer .art img{width:100%;height:100%;object-fit:cover}
.drawer section{margin-top:18px}
.drawer section h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-family:var(--f);margin-bottom:8px}
.drawer ol,.drawer ul{padding-left:20px;color:var(--tx2);font-size:14px;display:grid;gap:5px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer;color:var(--tx2);font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--o)}
.chk.on{color:var(--tx)}
.field{margin-top:12px}.field label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.field .help{font-size:12px;color:var(--tx3);margin-top:4px}
.field.err input,.field.err textarea{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12px;margin-top:4px;font-weight:600}
.note{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:12px 14px;font-size:13.5px;color:var(--tx2)}
.note.warn{border-color:rgba(255,176,32,.4);background:var(--warn-soft);color:var(--tx)}
.note.good{border-color:rgba(61,220,132,.35);background:var(--gr-soft);color:var(--tx)}
.note.bad{border-color:rgba(255,92,77,.4);background:var(--bad-soft);color:var(--tx)}
.note.draft{border-color:rgba(232,182,74,.4);background:var(--gold-soft);color:var(--tx)}
.timeline{display:grid;gap:8px;font-size:13px}
.timeline div{display:grid;grid-template-columns:150px 1fr;gap:10px;color:var(--tx2)}
.timeline time{color:var(--tx3);font-family:var(--mono);font-size:12px}

/* ---- toast / xp pop */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--sf2);border:1px solid var(--ln2);padding:10px 16px;border-radius:12px;z-index:100;opacity:0;transition:all .25s var(--ease);box-shadow:var(--sh);font-weight:600;font-size:14px;max-width:min(92vw,520px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:var(--gr)}.toast.bad{border-color:var(--bad)}
.xppop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:54px;font-weight:800;color:var(--gold);z-index:101;pointer-events:none;animation:pop 1.2s var(--ease) forwards;text-shadow:0 6px 30px rgba(232,182,74,.5)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@media (max-width:900px){.toast{bottom:84px}}

/* ---- skeleton / empty / error */
.sk{background:linear-gradient(90deg,var(--sf) 25%,var(--sf3) 50%,var(--sf) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px;min-height:16px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--ln2);border-radius:var(--r);color:var(--tx2)}
.empty h3{color:var(--tx);margin-bottom:6px}
.empty .ill{width:84px;height:84px;margin:0 auto 12px;opacity:.9}
.state{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--tx3)}
.state .dot{width:8px;height:8px;border-radius:50%;background:var(--gr)}
.state.stale .dot{background:var(--warn)}.state.err .dot{background:var(--bad)}

/* ---- tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);padding:8px 10px;border-bottom:1px solid var(--ln);font-weight:700}
.tbl td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
.tbl tr.me td{background:var(--o-soft)}
.tbl td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tblwrap{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---- 20-slot board */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.slot{position:relative;aspect-ratio:4/5;border-radius:12px;border:1px solid var(--ln);background:var(--sf);overflow:hidden;text-align:left;padding:0;color:inherit;transition:border-color .15s,transform .15s var(--ease)}
.slot:hover{border-color:var(--ln2);transform:translateY(-1px)}
.slot .n{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:12px;font-weight:800;background:rgba(0,0,0,.55);color:var(--tx);padding:2px 7px;border-radius:99px;z-index:2}
.slot .th{position:absolute;inset:0;background:var(--sf3)}
.slot .th img{width:100%;height:100%;object-fit:cover}
.slot .th svg{width:100%;height:100%}
.slot .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 9px 9px;background:linear-gradient(transparent,rgba(0,0,0,.88) 60%);font-size:12px;line-height:1.3}
.slot .cap b{display:block;color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.slot.empty{border-style:dashed;background:var(--bg2)}
.slot.empty .cap{background:none;color:var(--tx4);font-weight:600}
.slot.q{border-color:rgba(61,220,132,.5)}.slot.r{border-color:rgba(255,176,32,.5)}.slot.x{border-color:rgba(255,92,77,.45)}.slot.v{border-color:rgba(255,255,255,.25);border-style:dashed}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.podium{grid-template-columns:1fr}}
.podium .p{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:16px;text-align:center}

.podium .p .place{font-size:11px;letter-spacing:1.6px;color:var(--tx3);font-weight:700}
.podium .p .amt{font-family:var(--disp);font-size:34px;font-weight:800;margin-top:4px;color:var(--gold)}

/* ---- rewards */
.rcard{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;width:100%;color:inherit;display:flex;flex-direction:column}

.rcard .art svg{width:100%;height:100%}
.rcard .body{padding:16px}
.rcard .amt{font-family:var(--disp);font-size:32px;font-weight:800;color:var(--gold)}
.rcard.lock .amt{color:var(--tx2)}
.rcard .req{display:grid;gap:10px;margin-top:12px}

/* ---- video cards */
.vcard{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;cursor:pointer;text-align:left;width:100%;color:inherit;display:flex;flex-direction:column}
.vcard .th{aspect-ratio:16/9;background:var(--sf3);position:relative}
.vcard .th img{width:100%;height:100%;object-fit:cover}
.vcard .th svg{width:100%;height:100%}
.vcard .th .tag{position:absolute;top:8px;left:8px}
.vcard .body{padding:12px 14px}
.vcard .ttl{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .meta{font-size:12px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.vcard .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--tx3)}

.vcard .kv b{color:var(--tx);font-family:var(--mono);font-weight:600}
.icard .body .hook{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sf3);color:var(--tx2)}
.chip.o{background:var(--o-soft);color:var(--o2)}

/* ---- charts */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--sf2);border:1px solid var(--ln2);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx3);margin-top:8px}

/* ---- misc */
.kpi{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.kpi .big{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1}
.ol{counter-reset:s;display:grid;gap:8px;list-style:none}
.ol li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:var(--tx2);font-size:14px}
.ol li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--o-soft);color:var(--o2);display:grid;place-items:center;font-weight:800;font-size:12px}
details.rules summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--tx)}
.anim{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.login{max-width:420px;margin:12vh auto;padding:0 var(--gut)}
.login .card{padding:26px}
kbd{font-family:var(--mono);background:var(--sf3);padding:1px 6px;border-radius:5px;font-size:12px}
.admin-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--ln)}
@media (max-width:640px){.admin-row{grid-template-columns:1fr}}

/* ---- analytics (September layout, refreshed) */
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}

.ahero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--ln);padding:22px 22px 18px;

.vthumb{width:48px;height:64px;border-radius:9px;overflow:hidden;background:var(--sf3);border:1px solid var(--ln)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;border:1px solid var(--ln2);background:var(--sf2);color:var(--tx3);font-family:var(--mono);white-space:nowrap}

.chartwrap{position:relative;max-width:680px;margin:0 auto}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .cdot{cursor:pointer;transition:opacity .15s}
.ctip{position:absolute;pointer-events:none;z-index:8;opacity:0;transform:translate(-50%,-112%);transition:opacity .12s;background:var(--sf2);border:1px solid var(--ln2);border-radius:10px;padding:9px 11px;min-width:170px;box-shadow:var(--sh)}

.clg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}
.clg span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx3)}
.clg i{width:9px;height:9px;border-radius:50%;display:block}
.vplay{border-radius:14px;overflow:hidden;background:#000;margin:14px 0;display:flex;justify-content:center}

  .brow .bright{grid-column:3;text-align:left;display:flex;gap:6px;align-items:baseline}
  .vthumb{width:42px;height:56px}
}

.cd span{font-size:9.5px;letter-spacing:1.3px;font-weight:800;color:var(--tx3);margin-top:4px;display:block}

.pc2 .n{font-weight:700;font-size:14px;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc2 .pl{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx3);font-weight:800;margin-top:6px}

.lbrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);transition:background .15s}

.lbrow:hover{background:var(--sf2)}

/* ---- facelift: depth, light and motion, same layout */
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(255,110,32,.07),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(91,157,255,.04),transparent 60%),var(--bg);background-attachment:fixed}
.card,.metric{position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);pointer-events:none}
.card.pad0::before{display:none}
.card[onclick]{transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.card[onclick]:hover{transform:translateY(-2px);border-color:var(--ln2);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.ph h1{font-size:34px;letter-spacing:.3px}
.ph .eyebrow{display:inline-flex;align-items:center;gap:6px}

.btn.gold{box-shadow:0 6px 18px rgba(232,182,74,.22),inset 0 1px 0 rgba(255,255,255,.3)}

.sec h2{display:flex;align-items:center;gap:8px}

.lbh-prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:420px}

/* same validator as app.validate_evidence, so the client can pre-check and the server stays authoritative */
function validateEvidence(proof,draft){ const errs=[]; const isUrl=u=>/^https?:\/\/\S+$/i.test(String(u||''));
  for(const f of proof||[]){ let v=draft?.[f.field]; const empty=v==null||v===''||(Array.isArray(v)&&v.filter(x=>String(x).trim()).length===0);
    if(f.required&&empty){ errs.push(`${f.label} is required`); continue; } if(empty) continue;
    if(f.type==='url'&&!isUrl(v)) errs.push(`${f.label} must be a full link starting with http`);
    if(f.type==='url_list'||f.type==='submission_list'){ const arr=(Array.isArray(v)?v:String(v).split(/\n+/)).map(x=>String(x).trim()).filter(Boolean);
      if(f.min&&arr.length<f.min) errs.push(`${f.label} needs ${f.min} items, has ${arr.length}`); if(f.max&&arr.length>f.max) errs.push(`${f.label} allows at most ${f.max} items`);
      if(f.type==='url_list'){ arr.forEach(u=>{ if(!isUrl(u)) errs.push(`${f.label}: "${u.slice(0,40)}" is not a full link`); }); if(new Set(arr.map(x=>x.toLowerCase())).size<arr.length) errs.push(`${f.label} has duplicate links`); } }
    if(f.type==='text'&&String(v).trim().length<(f.min||1)) errs.push(`${f.label} needs at least ${f.min||1} characters`);
    if(f.type==='date'&&isNaN(new Date(v))) errs.push(`${f.label} is not a date`);
    if(f.type==='choice'&&!(f.options||[]).includes(v)) errs.push(`${f.label} must be one of the listed options`); }
  return errs; }

/* ---- charts (single axis, thin marks, hover tooltip) */
function drawChart(el){ const spec=JSON.parse(el.dataset.chart); const W=el.clientWidth||600, H=spec.h||180, P={l:44,r:10,t:10,b:26};
  const rows=spec.rows||[]; if(!rows.length){ el.innerHTML='<div class="mini">No daily rows in this range.</div>'; return; }
  const series=spec.series; const max=Math.max(1,...rows.flatMap(r=>series.map(s=>Number(r[s.key])||0)));
  const x=i=>P.l+(rows.length>1?i/(rows.length-1):0.5)*(W-P.l-P.r), y=v=>P.t+(1-v/max)*(H-P.t-P.b);
  const ticks=[0,.5,1].map(t=>t*max);
  const grid=ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.08)"/><text x="${P.l-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#848C99">${fmt.usd(t)}</text>`).join('');
  const paths=series.map(s=>`<path d="${rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(Number(r[s.key])||0).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`).join('');
  const dots=series.map(s=>rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(Number(r[s.key])||0)}" r="3.5" fill="${s.color}" stroke="#111419" stroke-width="2"/>`).join('')).join('');
  const labels=rows.map((r,i)=>(rows.length<=8||i%Math.ceil(rows.length/6)===0||i===rows.length-1)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#848C99">${fmt.date(r.day)}</text>`:'').join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||'chart')}">${grid}${paths}${dots}${labels}<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg><div class="tip"></div><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
  const tip=el.querySelector('.tip'), svg=el.querySelector('svg');
  svg.addEventListener('mousemove',e=>{ const b=svg.getBoundingClientRect(); const px=(e.clientX-b.left)*W/b.width; let i=Math.round((px-P.l)/((W-P.l-P.r)/Math.max(1,rows.length-1))); i=clamp(i,0,rows.length-1); const r=rows[i];
    tip.style.display='block'; tip.style.left=(x(i)*b.width/W)+'px'; tip.style.top=(y(Math.max(...series.map(s=>Number(r[s.key])||0)))*b.height/H)+'px'; tip.innerHTML=`<b>${fmt.date(r.day)}</b><br>${series.map(s=>`${esc(s.label)}: ${fmt.usd2(r[s.key]||0)}`).join('<br>')}`; });
  svg.addEventListener('mouseleave',()=>tip.style.display='none'); }

/* Home feed: your real video events (submitted / approved) merged with quest and reward events */
function activityFeed(acts,vids){
  const ev=[]; const lab={approved:['g','Approved'],submitted:['r','Submitted'],rejected:['x','Not approved'],changes:['c','Changes requested']};
  vids.forEach(v=>{ const kind=v.media_type==='IMAGE'?'Image':'Video';
    if(v.approved_at) ev.push({at:v.approved_at,k:'approved',v,t:`${kind} approved`});
    if(v.submitted_at) ev.push({at:v.submitted_at,k:v.status==='rejected'?'rejected':v.status==='changes_requested'?'changes':'submitted',v,t:`${kind} submitted`}); });
  acts.forEach(a=>ev.push({at:a.at,k:'other',t:activityText(a)}));
  ev.sort((x,y)=>new Date(y.at)-new Date(x.at)); const L=ev.slice(0,8);
  if(!L.length) return emptyState('Nothing yet','Your first video or quest will show up here.',`<button class="btn" onclick="go('inspo')">Find an angle</button>`,'video');

    <div style="min-width:0;flex:1"><div class="act-t">${esc(e.t)}${e.v&&e.k!=='approved'&&e.k!=='submitted'?` · <span class="muted">${bl.toLowerCase()}</span>`:''}</div><div class="mini">${e.v?(e.k==='approved'?'Sent '+esc(e.v.title||'')+' · approved '+esc(fmt.ago(e.at)||''):esc(e.v.title||'')+' · '+esc(fmt.ago(e.at)||'')):esc(fmt.ago(e.at)||'')}</div></div>
    ${e.v?`<span class="badge ${bk}">${bl}</span>`:''}</${e.v?'button':'div'}>`; }).join('')}</div>`; }
function activityText(a){ const k={submission:{imported:'Video added to your records',approved:'Video approved',rejected:'Video rejected',changes_requested:'Changes requested on a video',funnel_set:'Video stage classified',revision_linked:'Revision linked to its original',corrected:'Video record corrected'},quest:{started:'Started a quest',submitted:'Submitted quest evidence',changes_requested:'Quest returned with notes',approved:'Quest approved',rejected:'Quest not approved',reversed:'Quest award reversed'},claim:{requested:'Reward claim submitted',approved_for_payment:'Reward claim approved for payment',paid:'Reward recorded as paid',rejected:'Reward claim rejected',review_issue:'Review issue opened'}}; return (k[a.kind]||{})[a.event]||`${a.kind}: ${a.event}`; }

const QF=['all','available','in_progress','submitted','approved','needs_changes'];
const QF_LABEL={all:'All',available:'Available',in_progress:'In progress',submitted:'In review',approved:'Completed',needs_changes:'Changes needed'};
function questState(cat,insts){ const mine=insts.filter(i=>i.quest_key===cat.quest_key); const cur=mine.find(i=>i.period_key===cat.period_now&&['in_progress','needs_changes','submitted'].includes(i.state));
  const done=cat.done_in_period||0; const maxThis=cat.per_period_limit; const total=cat.completions_total||0; const maxTotal=cat.max_xp&&cat.xp_value?Math.round(cat.max_xp/cat.xp_value):(cat.period_kind==='reward_period'?maxThis*2:(cat.period_kind==='day'?Math.floor(cat.monthly_xp_cap/cat.xp_value):maxThis));
  let state='available'; if(cur) state=cur.state; else if(cat.period_kind==='day'&&(cat.xp_this_month||0)>=cat.monthly_xp_cap) state='approved'; else if(done>=maxThis&&(cat.period_kind!=='reward_period'||total>=maxTotal)) state='approved'; else if(done>=maxThis) state='approved_period';
  return {cur,mine,done,maxThis,total,maxTotal,state}; }
function reqProgress(cat,inst){ const req=cat.requirement||{}; const n=req.count||1; if(!inst||!inst.draft) return {have:0,need:n,unit:req.unit||''}; const p=(cat.proof||[]).find(f=>f.type==='url_list'||f.type==='submission_list'); let have=0;
  if(p){ const v=inst.draft[p.field]; have=Array.isArray(v)?v.filter(x=>String(x).trim()).length:(v?String(v).split(/\n+/).filter(Boolean).length:0); } else { have=(cat.proof||[]).filter(f=>{ const v=inst.draft[f.field]; return v!=null&&String(v).trim()!==''; }).length?1:0; }
  return {have:Math.min(have,n),need:n,unit:req.unit||''}; }

function nextPeriodDate(st){ const q=S.cache['my_quests{}']; const i=(q?.periods||[]).findIndex(p=>p.key===q.period_now); const n=q?.periods?.[i+1]; return n?fmt.date(n.starts_at):'next month'; }
function levelName(xp){ return xp>=200?'Elite':xp>=100?'Operator':xp>=50?'Builder':xp>=25?'Rookie II':'Rookie'; }
function questCta(st){ return {available:'Start quest',approved_period:'Next period opens '+nextPeriodDate(st),in_progress:'Continue quest',needs_changes:'Fix and resubmit',submitted:'View submission',approved:'View',rejected:'View'}[st.state]||'Open'; }
function questCard(c,st){ const s=st.state; const [k,label]=QSTATE[s]||QSTATE.available; const rp=reqProgress(c,st.cur);
  const capText=c.period_kind==='reward_period'?`${st.done}/${st.maxThis} this period · ${st.total}/${st.maxTotal} this month`:c.period_kind==='day'?`${c.xp_this_month||0}/${c.monthly_xp_cap} XP this month · max ${c.per_period_limit}/day`:`${st.total}/${st.maxTotal} completed`;
  const prog=st.cur&&['in_progress','needs_changes'].includes(st.cur.state)&&rp.need>1?`<div class="prog">${pbar(rp.have,rp.need,{label:`${rp.have} of ${rp.need} ${rp.unit} attached`,fmtv:x=>x})}</div>`:(st.cur&&st.cur.state==='submitted'?`<div class="prog"><div class="plabel"><span>Submitted ${fmt.dt(st.cur.submitted_at)}</span><b>+${c.xp_value} XP pending</b></div><div class="bar"><i style="width:100%;background:var(--warn)"></i></div></div>`:'');
  return `<button class="qcard ${s==='approved'?'done':''}" onclick="openQuest('${c.quest_key}')" aria-label="${esc(c.title)}: ${label}"><div class="art ph">${thumb(questPhoto(c),c.image_key,c.category)}</div><div style="min-width:0"><div class="row between"><span class="badge ${k}">${label}</span><span class="xp">+${c.xp_value} XP</span></div><div class="ttl" style="margin-top:6px">${esc(c.title)}</div><div class="out">${esc(c.outcome)}</div>${prog}<div class="foot"><span class="mini">${capText}</span><span class="btn sm ${s==='approved'||s==='approved_period'?'gh':''}">${questCta(st)}</span></div></div></button>`; }

  openDrawer(`<div class="row"><span class="badge ${QSTATE[inst?.state||'available'][0]}">${QSTATE[inst?.state||'available'][1]}</span><span class="xp">+${c.xp_value} XP</span><span class="mini">${esc(c.category)}</span></div>
   <h2>${esc(c.title)}</h2><div class="art">${photoFrame(questPhoto(c),c.image_key,c.category)}</div>

   ${!canStart&&!inst&&(st.state==='approved'||st.state==='approved_period')?`<section><div class="note good">Completed for ${st.state==='approved_period'?'this reward period':'this campaign'}.${st.state==='approved_period'?' Opens again '+nextPeriodDate(st)+'.':''}</div></section>`:''}
   ${history.length?`<section><h3>History</h3><div class="timeline">${history.map(i=>`<div><time>${fmt.date(i.created_at)}</time><span>${PERIOD_LABEL(i.period_key)} · ${QSTATE[i.state][1]}${i.xp?` · +${i.xp} XP`:''} <a href="#" onclick="openQuest('${key}','${i.id}');return false">open</a></span></div>`).join('')}</div></section>`:''}
   ${inst?.history?.length?`<section><h3>Timeline</h3><div class="timeline">${inst.history.map(h=>`<div><time>${fmt.dt(h.at)}</time><span>${esc(({started:'Started',submitted:'Submitted for review',changes_requested:'Returned with notes',approved:'Approved',rejected:'Not approved',reversed:'Award reversed'})[h.event]||h.event)}${h.detail?.xp?` · +${h.detail.xp} XP`:''}</span></div>`).join('')}</div></section>`:''}`);

function evidenceForm(c,inst){ const editable=['in_progress','needs_changes'].includes(inst.state); const d=inst.draft||{};
  const field=f=>{ const v=d[f.field]; const id='f_'+f.field; let input='';
    if(f.type==='url_list'||f.type==='submission_list') input=`<textarea id="${id}" ${editable?'':'disabled'} placeholder="One per line${f.min?` (${f.min}${f.max&&f.max!==f.min?'–'+f.max:''} ${f.type==='url_list'?'links':'IDs'})`:''}" oninput="draftChanged('${inst.id}')">${esc(Array.isArray(v)?v.join('\n'):(v||''))}</textarea>`;
    else if(f.type==='text') input=`<textarea id="${id}" ${editable?'':'disabled'} oninput="draftChanged('${inst.id}')">${esc(v||'')}</textarea>`;
    else if(f.type==='date') input=`<input id="${id}" type="date" ${editable?'':'disabled'} value="${esc(v||'')}" oninput="draftChanged('${inst.id}')">`;
    else if(f.type==='choice') input=`<select id="${id}" ${editable?'':'disabled'} onchange="draftChanged('${inst.id}')"><option value="">Choose…</option>${(f.options||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else input=`<input id="${id}" type="url" inputmode="url" ${editable?'':'disabled'} value="${esc(v||'')}" placeholder="https://" oninput="draftChanged('${inst.id}')">`;
    return `<div class="field" data-field="${f.field}"><label for="${id}">${esc(f.label)}${f.required?' *':''}</label>${input}<div class="ferr" id="e_${f.field}"></div></div>`; };
  return `<section><h3>${editable?'Your evidence':'Submitted evidence'}</h3>
    ${inst.inspiration_ref?`<div class="note" style="margin-bottom:8px">Started from inspiration <b>${esc(inst.inspiration_ref)}</b>. <a href="#/inspo?id=${encodeURIComponent(inst.inspiration_ref)}">Open it</a></div>`:''}
    <form id="evform" onsubmit="return submitQuest(event,'${inst.id}')">${(c.proof||[]).map(field).join('')}
    <div id="everr" class="ferr" style="margin-top:8px"></div>

function readDraft(c){ const d={}; (c.proof||[]).forEach(f=>{ const el=$('#f_'+f.field); if(!el) return; let v=el.value; if(f.type==='url_list'||f.type==='submission_list') v=v.split(/\n+/).map(x=>x.trim()).filter(Boolean); d[f.field]=v; }); return d; }
let draftTimer; function draftChanged(id){ $('#savestate')&&($('#savestate').textContent='Unsaved changes'); clearTimeout(draftTimer); draftTimer=setTimeout(()=>saveDraft(id,true),1200); }
async function saveDraft(id,auto){ const q=await API.page('my_quests'); const inst=q.instances.find(i=>i.id===id); const c=q.catalog.find(x=>x.quest_key===inst.quest_key); const d=readDraft(c);
  const r=await API.rpc('save_quest_draft',{p_instance:id,p_draft:d}); if(r.ok){ inst.draft=d; inst.updated_at=new Date().toISOString(); $('#savestate')&&($('#savestate').textContent='Saved just now'); if(!auto) toast('Draft saved'); } else toast(r.why,'bad'); }
async function tickStep(id,i,on){ const q=await API.page('my_quests'); const inst=q.instances.find(x=>x.id===id); const ck=[...(inst.checklist||[])]; ck[i]=on; const r=await API.rpc('save_quest_draft',{p_instance:id,p_draft:null,p_checklist:ck}); if(r.ok) inst.checklist=ck; }
async function startQuest(key){ const b=$('#startbtn'); b.classList.add('pending'); b.disabled=true; try{ const r=await API.rpc('start_quest',{p_quest:key,p_inspiration_ref:S.params.ref||null}); if(!r.ok){ toast(r.why,'bad'); return; } API.bust(); await API.page('my_quests'); openQuest(key,r.instance_id); toast(r.why==='resumed'?'Resumed your entry':'Quest started'); render(); } catch(e){ toast(e.message,'bad'); } finally{ b.classList.remove('pending'); b.disabled=false; } }
async function submitQuest(ev,id){ ev.preventDefault(); const q=await API.page('my_quests'); const inst=q.instances.find(i=>i.id===id); const c=q.catalog.find(x=>x.quest_key===inst.quest_key); const d=readDraft(c);
  $$('.ferr').forEach(e=>e.textContent=''); $$('.field').forEach(e=>e.classList.remove('err'));
  const errs=validateEvidence(c.proof,d); if(errs.length){ errs.forEach(e=>{ const f=(c.proof||[]).find(p=>e.startsWith(p.label)); if(f){ $('#e_'+f.field).textContent=e; $(`.field[data-field="${f.field}"]`).classList.add('err'); } else $('#everr').textContent=e; }); $('#everr').textContent=$('#everr').textContent||'Fix the fields above, then submit again.'; return false; }
  const b=$('#subbtn'); b.classList.add('pending'); b.disabled=true;
  try{ const s=await API.rpc('save_quest_draft',{p_instance:id,p_draft:d}); if(!s.ok){ $('#everr').textContent=s.why; return false; }
    inst._req=inst._req||uid(); const r=await API.rpc('submit_quest',{p_instance:id,p_request_id:inst._req});
    if(!r.ok){ (r.errors||[]).forEach(e=>{ const f=(c.proof||[]).find(p=>e.startsWith(p.label)); if(f){ $('#e_'+f.field).textContent=e; $(`.field[data-field="${f.field}"]`).classList.add('err'); } }); $('#everr').textContent=(r.errors||[]).find(e=>!(c.proof||[]).some(p=>e.startsWith(p.label)))||r.why||'Could not submit. Your draft is kept.'; return false; }
    API.bust(); toast(r.why==='already received'?'Already received. Nothing was sent twice.':'Submitted. An admin will verify it.','good'); await API.page('my_quests'); openQuest(c.quest_key,id); render(); }
  catch(e){ $('#everr').textContent='Could not reach the server: '+e.message+'. Your draft is kept, try again.'; }
  finally{ b.classList.remove('pending'); b.disabled=false; } return false; }

/* ROAS vs spend dot plot. Each dot is one video (its thumbnail), x = spend (log), y = ROAS,
   size by spend, ring colour by band. Every number is repeated in the list below it. */
function roasChart(rows){
  const pts=rows.filter(x=>x.spend>0&&x.roas!=null); if(pts.length<2) return '';
  const W=420,H=250,L=34,R=12,T=18,B=28; const lg=v=>Math.log10(Math.max(v,1));
  const xs=pts.map(p=>lg(p.spend)), x0=Math.min(...xs)-.15, x1=Math.max(...xs)+.15;
  const yMax=Math.max(...pts.map(p=>p.roas)); const yTop=Math.max(3,Math.min(8,Math.ceil(yMax*1.12)));   // outliers sit on the top edge, labelled
  const px=v=>L+(lg(v)-x0)/(x1-x0||1)*(W-L-R), py=v=>T+(1-Math.min(v,yTop)/yTop)*(H-T-B);
  const mxs=Math.max(...pts.map(p=>p.spend)); const rad=s=>5+Math.sqrt(s/mxs)*14;
  const ticks=[1,10,100,1000,10000,100000].filter(v=>lg(v)>=x0&&lg(v)<=x1);
  const yt=[]; for(let v=0;v<=yTop;v+=(yTop>6?2:1)) yt.push(v);
  const grid=yt.map(v=>`<line x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}" stroke="rgba(255,255,255,.06)"/><text x="${L-7}" y="${py(v)+3.5}" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">${v}x</text>`).join('');
  const xax=ticks.map(v=>`<text x="${px(v)}" y="${H-9}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">$${v>=1000?(v/1000)+'k':v}</text>`).join('');
  const refs=`<line x1="${L}" y1="${py(1)}" x2="${W-R}" y2="${py(1)}" stroke="#FF5C4D" stroke-width="1.4" stroke-dasharray="4 4" opacity=".55"/><text x="${L+4}" y="${py(1)+12}" font-size="8.5" font-weight="700" fill="#FF5C4D" letter-spacing=".06em">BREAK EVEN</text>${yTop>=2?`<line x1="${L}" y1="${py(2)}" x2="${W-R}" y2="${py(2)}" stroke="#3DDC84" stroke-width="1.4" stroke-dasharray="4 4" opacity=".5"/><text x="${L+4}" y="${py(2)-5}" font-size="8.5" font-weight="700" fill="#3DDC84" letter-spacing=".06em">BRAND KEEPS FEEDING IT</text>`:''}`;
  const order=pts.map((p,i)=>i).sort((a,b)=>pts[b].spend-pts[a].spend); // big dots first, small on top
  const defs=pts.map((p,i)=>p.thumb_url?`<clipPath id="cp${i}"><circle cx="${px(p.spend).toFixed(1)}" cy="${py(p.roas).toFixed(1)}" r="${rad(p.spend).toFixed(1)}"/></clipPath>`:'').join('');
  const dots=order.map(i=>{ const p=pts[i], b=BAND(p.roas), cx=px(p.spend), cy=py(p.roas), r=rad(p.spend);

   <div class="card"><div class="lbl">September history</div><p style="margin-top:6px;font-size:14px">Kept with its original dates. The September pool was settled separately and is not part of October.</p><div class="grid g2" style="gap:8px;margin-top:10px">${metric('Submissions',fmt.int(N.sep_submissions??sep.submissions_in_range))}${metric('Approved',fmt.int(N.sep_approved??sep.approved_in_range))}${metric('September sales',N.sep_sales!=null?fmt.usd(N.sep_sales):(sep.sales==null?null:fmt.usd(sep.sales)))}${metric('All-time sales',N.all_sales==null?null:fmt.usd(N.all_sales),{sub:N.data_through?'as of '+esc(fmt.dt(N.data_through)):''})}</div><div class="row" style="margin-top:12px"><button class="btn gh sm" onclick="go('analytics',{r:'all'})">All-time analytics</button></div></div></div>`;
});
route('amazon',async()=>{ const d=amzGet(); const done=AMZ_STEPS.filter(x=>d[x[0]]).length;
  return `${ph('Amazon','Get set up on the Amazon side while the video work keeps running.',{eyebrow:'Programs'})}
  <div class="card"><div class="row between"><div><div class="lbl">Your setup</div><div class="disp" style="font-size:24px;font-weight:800;margin-top:4px">${done} of ${AMZ_STEPS.length} done</div></div>${window.AMZ_VIDEO?`<a class="btn" ${openExt(window.AMZ_VIDEO)}>Watch the walkthrough</a>`:'<span class="mini">Walkthrough video coming before the next call.</span>'}</div><div class="bar" style="margin-top:12px"><i style="width:${done/AMZ_STEPS.length*100}%"></i></div></div>
  <div class="card" style="margin-top:12px">${AMZ_STEPS.map((x,i)=>`<label class="chk ${d[x[0]]?'on':''}"><input type="checkbox" ${d[x[0]]?'checked':''} onchange="amzTog('${x[0]}')"><span><b>${i+1}. ${esc(x[1])}</b><br><span class="mini">${esc(x[2])}</span></span></label>`).join('')}<div class="mini" style="margin-top:10px">Your ticks are saved on this device only. They are for you, not a report to Austin.</div></div>
  <div class="card" style="margin-top:12px"><div class="lbl">Two things</div><p style="margin-top:8px;font-size:14px">Product is requested in batches so reviews do not all land at once. The affiliate side is the part you can start today.</p><p style="margin-top:8px;font-size:14px">On reviews: do not push them. A rush of five-star reviews is how a listing gets pulled. Let them come naturally.</p></div>`; });
route('onboard',async()=>{ const h=await API.page('my_home'); const c=h.creator||{}; const isT=c.joined_at&&c.joined_at>=TRIAL.from; const U=window.BOOK_URL;
  return `${ph(isT?'Your onboarding call':'Onboarding call',isT?'Twenty minutes with Austin on your content and your numbers.':'Already handled. This is for creators joining from '+fmt.date(TRIAL.from,{year:'numeric'})+'.',{eyebrow:'Programs'})}
  ${isT?`<div class="card hi"><h3>Grab a time with Austin</h3><p style="margin-top:4px">Hook rates, where your videos lose people, and what to make next. No prep needed.</p><div style="margin-top:12px">${U?`<a class="btn" ${openExt(U)}>Book my call</a>`:'<span class="mini">Booking link coming shortly. Message Austin in the meantime.</span>'}</div></div>`:`<div class="card"><h3>You are already onboarded</h3><p>If you want time with Austin anyway, just message him.</p></div>`}
  <div class="sec"><h2>What we cover</h2></div><div class="grid g3"><div class="card"><div class="lbl">01</div><b>Your hook rate</b><p style="font-size:13.5px">Where your first two seconds sit, and what the top videos do differently.</p></div><div class="card"><div class="lbl">02</div><b>Your angles</b><p style="font-size:13.5px">Which angles convert and which to stop making.</p></div><div class="card"><div class="lbl">03</div><b>What is next</b><p style="font-size:13.5px">Amazon, the affiliate side, and where the volume needs to be for Q4.</p></div></div>`; });
route('trial',async()=>{ const h=await API.page('my_home'); const c=h.creator||{}; const isT=c.joined_at&&c.joined_at>=TRIAL.from;
  if(!isT) return `${ph('Your trial','Nothing to worry about: you are grandfathered in.',{eyebrow:'Programs'})}<div class="card"><h3>You are grandfathered in</h3><p>The 30-day trial applies to creators who join from ${fmt.date(TRIAL.from,{year:'numeric'})} onward. You were already on the roster: no sales bar, no clock.</p></div>`;
  const day=Math.max(0,Math.floor((Date.now()-new Date(c.joined_at))/86400000)); const left=Math.max(0,TRIAL.days-day); const sep=await API.page('my_analytics',{p_from:c.joined_at,p_to:'2026-12-31'}); const g=sep.sales;
  return `${ph('Your 30-day trial',`Day ${day} of ${TRIAL.days}.`,{eyebrow:'Programs'})}<div class="card"><div class="lbl">Attributed sales this trial</div><div class="disp" style="font-size:36px;font-weight:800;color:var(--o2);margin-top:4px">${g==null?'<span class="muted" style="font-size:18px">Not available yet</span>':fmt.usd(g)}</div><div class="mini">of ${fmt.usd(TRIAL.bar)} to lock your spot · ${left} day${left===1?'':'s'} left</div><div class="bar" style="margin-top:12px"><i style="width:${g?clamp(g/TRIAL.bar*100,0,100):0}%"></i></div></div>
  <div class="card" style="margin-top:12px"><p style="font-size:14px">You have ${TRIAL.days} days from the day you were added to hit ${fmt.usd(TRIAL.bar)} in attributed sales. It is not a video count: one video that sells beats ten that do not. Clear it and you are on the roster like everyone else.</p></div>`; });

/* ---------------- Admin */
route('admin',async()=>{ const A=await API.page('admin'); const Q=(A.queue||[]).filter(q=>q.state==='submitted'); const other=(A.queue||[]).filter(q=>q.state!=='submitted');
  return `${ph('Review queue',`${Q.length} quest entr${Q.length===1?'y':'ies'} waiting. Approve awards XP once; the database enforces caps and duplicates.`,{eyebrow:'Admin'})}
  ${Q.length?Q.map(q=>`<div class="card" style="margin-bottom:10px"><div class="admin-row"><div><div class="row"><b>${esc(q.display_name)}</b><span class="mini">· ${esc(q.title)} · ${PERIOD_LABEL(q.period_key)} · entry ${q.seq}</span>${q.duplicate_registration?badge('v','Duplicate registration'):''}${q.same_evidence_elsewhere?badge('x','Same evidence as another creator'):''}</div>
     <div class="mini" style="margin-top:4px">Submitted ${fmt.dt(q.submitted_at)} · requests +${q.requested_xp} XP · ${q.done_in_period}/${q.per_period_limit} already awarded this period</div>
     <div style="margin-top:8px;font-size:13.5px">${Object.entries(q.draft||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${Array.isArray(v)?v.map(u=>/^https?:/.test(u)?`<a ${openExt(u)}>${esc(u)}</a>`:esc(u)).join('<br>'):(/^https?:/.test(String(v))?`<a ${openExt(v)}>${esc(v)}</a>`:esc(v))}</div>`).join('')}</div></div>
     <div class="stack"><button class="btn sm" onclick="adminAct('approve_quest','${q.id}')">Approve +${q.requested_xp} XP</button><button class="btn gh sm" onclick="adminNote('return_quest','${q.id}')">Request changes</button><button class="btn danger sm" onclick="adminNote('reject_quest','${q.id}')">Reject</button></div></div></div>`).join(''):emptyState('Queue is empty','Nothing is waiting for review.','','review')}
  <div class="sec"><h2>Recently decided</h2></div><div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Creator</th><th>Quest</th><th>Period</th><th>State</th><th>Note</th></tr></thead><tbody>${other.slice(0,30).map(q=>`<tr><td>${esc(q.display_name)}</td><td>${esc(q.title)}</td><td class="mono">${PERIOD_LABEL(q.period_key)}</td><td>${badge((QSTATE[q.state]||['n',q.state])[0],(QSTATE[q.state]||['n',q.state])[1])}</td><td class="mini">${esc(q.review_note||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="mini">None yet</td></tr>'}</tbody></table></div></div>`; });
async function adminAct(fn,id,extra={}){ try{ const r=await API.rpc(fn,{p_instance:id,...extra}); if(r.ok||r.awarded){ toast(fn==='approve_quest'?`Awarded ${r.xp} XP`:r.why,'good'); if(fn==='approve_quest') xpPop(r.xp); } else toast(r.why,'bad'); API.bust(); render(); }catch(e){ toast(e.message,'bad'); } }
function adminNote(fn,id){ const label=fn==='return_quest'?'Feedback for the creator':'Reason for rejection'; openDrawer(`<h2>${fn==='return_quest'?'Request changes':'Reject entry'}</h2><div class="field"><label for="anote">${label}</label><textarea id="anote"></textarea><div class="help">${fn==='return_quest'?'The creator edits the same entry and resubmits. Rejection is a different event.':'The entry closes. The creator can start a new one if the cap allows.'}</div></div><div class="row" style="margin-top:12px"><button class="btn ${fn==='reject_quest'?'danger':''}" onclick="(async()=>{const n=$('#anote').value.trim(); if(!n){toast('A note is required','bad');return;} closeDrawer(true); await adminAct('${fn}','${id}',${fn==='return_quest'?'{p_note:n}':'{p_reason:n}'});})()">Send</button><button class="btn gh" onclick="closeDrawer()">Cancel</button></div>`); }

route('admin_contest',async()=>{ const A=await API.page('admin'); const c=A.campaign||{}; const snaps=A.snapshots||[]; const fin=snaps.find(x=>x.final); const ended=new Date()>=new Date(c.ends_at);
  const rules=[['Window',`${fmt.dt(c.starts_at)} → ${fmt.dt(c.ends_at)} (exclusive), ${esc(c.tz||'')}`],['Ranked by','October GMV from October videos only: Oct 1–31 (CT) sales on each creator\'s first 20 videos submitted and approved in October. Older videos never count. Creators see everyone\'s place, only their own GMV.'],
    ['Ties',TIE_TEXT(c.tie_rule)],['Prizes',`${(c.prizes||[]).map(p=>`${p.label} ${fmt.usd(p.cents,{cents:true})}`).join(' · ')} = ${fmt.usd(c.prize_total_cents,{cents:true})}`],['Payout',esc(c.payout_terms||'Not set')],['First 20 videos','Each creator\'s first 20 October submissions are their entries; approved ones count toward GMV.']];
  return `${ph('Contest, campaign and imports','The rules every creator sees, the live standings, and the final freeze.',{eyebrow:'Admin'})}
  <div class="grid g2"><div class="card"><div class="row between"><div class="lbl">Campaign ${esc(c.key)}</div>${badge(c.status==='published'?'g':'d',c.status==='published'?'Live':c.status||'draft')}</div>
    <div class="timeline" style="margin-top:10px">${rules.map(([k,v])=>`<div><time>${k}</time><span>${v}</span></div>`).join('')}</div>
    <div class="hr"></div><div class="lbl">Quest periods</div><div class="timeline" style="margin-top:8px">${(A.periods||[]).map(p=>`<div><time>${esc(p.label)}</time><span>${fmt.dt(p.starts_at)} → ${fmt.dt(p.ends_at)} (exclusive)</span></div>`).join('')}</div></div>
   <div class="card"><div class="lbl">Final standings</div>
    ${fin?`<div class="note good" style="margin-top:10px"><b>Frozen ${fmt.dt(fin.taken_at)}.</b> This is the record winners are paid from.</div>${top3Html(fin.top3)}`
      :`<p style="font-size:14px;margin-top:8px">After the last Trybe refresh on Nov 1, freeze the standings. That saves the final order (with the tie-break applied) as a permanent record to pay from. It can only be done once.</p>
       <div class="row" style="margin-top:12px"><button class="btn" ${ended?'':'disabled'} onclick="freezeAsk(true)">Freeze final standings</button><button class="btn gh" onclick="freezeAsk(false)">Save a snapshot now</button></div>
       ${ended?'':`<div class="mini" style="margin-top:8px">Final freeze unlocks when October ends (${fmt.dt(c.ends_at)}).</div>`}`}
    ${snaps.filter(x=>!x.final).length?`<div class="hr"></div><div class="lbl">Saved snapshots</div><div class="timeline" style="margin-top:8px">${snaps.filter(x=>!x.final).slice(0,5).map(x=>`<div><time>${fmt.dt(x.taken_at)}</time><span>${(x.top3||[]).map(t=>`#${t.rank} ${esc(t.name)}`).join(' · ')||'no ranked creators'}</span></div>`).join('')}</div>`:''}</div></div>
  <div class="sec"><h2>Standings (admin view)</h2><span class="mini">Creators only ever see their own GMV</span></div><div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Rank</th><th>Creator</th><th class="num">GMV (Oct videos)</th><th class="num">Approved Oct videos</th></tr></thead><tbody>${(A.standings||[]).filter(s=>s.rank!=null).map(s=>`<tr><td class="mono">${s.rank}${s.tied?' tie':''}</td><td>${esc(s.display_name)}</td><td class="num">${fmt.usd2(s.score_sales)}</td><td class="num">${s.entries}</td></tr>`).join('')||'<tr><td colspan="4" class="mini">No October video sales yet</td></tr>'}</tbody></table></div></div>
  <div class="mini" style="margin-top:6px">${(A.standings||[]).filter(s=>s.rank==null).length} more creators on the roster are still at $0 for October.</div>
  <div class="sec"><h2>Data refreshes</h2><span class="mini">Each Trybe refresh paste logs a run here</span></div>
  <div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Run</th><th>Source</th><th>Status</th><th class="num">Read</th><th class="num">Added</th><th class="num">Updated</th><th>Reports through</th></tr></thead><tbody>${(A.imports||[]).map(r=>`<tr><td class="mono">${fmt.dt(r.started_at)}</td><td>${esc(r.source)}</td><td>${badge(r.status==='complete'?'g':r.status==='failed'?'x':'r',r.status)}</td><td class="num">${r.rows_read??''}</td><td class="num">${r.rows_added??''}</td><td class="num">${r.rows_updated??''}</td><td>${fmt.date(r.reporting_through,{year:'numeric'})||''}</td></tr>`).join('')||'<tr><td colspan="7" class="mini">No runs</td></tr>'}</tbody></table></div></div>
  <div class="sec"><h2>Pending on Trybe</h2><span class="mini">Newest 100 videos still waiting for brand review</span></div><div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Creator</th><th>Video</th><th>Submitted</th><th>Status</th></tr></thead><tbody>${(A.submissions_review||[]).map(s=>`<tr><td>${esc(s.display_name||'')}</td><td>${esc(s.title||'')}</td><td class="mono">${fmt.dt(s.submitted_at)||'<span class="muted">unknown</span>'}</td><td>${badge(SSTATE[s.status]?.[0]||'n',SSTATE[s.status]?.[1]||s.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="mini">Nothing pending</td></tr>'}</tbody></table></div></div>`; });
function top3Html(t){ return `<div class="timeline" style="margin-top:10px">${(t||[]).map(x=>`<div><time>#${x.rank}</time><span><b>${esc(x.name)}</b> · ${fmt.usd2(x.gmv)}</span></div>`).join('')}</div>`; }
function freezeAsk(final){ openDrawer(`<h2>${final?'Freeze final standings':'Save a snapshot'}</h2><p style="margin-top:8px">${final?'This saves the current October order as the final record winners are paid from. Make sure the last Trybe refresh (data through Oct 31) has been run first. It can only be done once.':'Saves today\'s order as a record. Creators see nothing different.'}</p>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="freezeDo(${final})">${final?'Yes, freeze final standings':'Save snapshot'}</button><button class="btn gh" onclick="closeDrawer()">Cancel</button></div>`); }
async function freezeDo(final){ closeDrawer(true); try{ await API.rpc('snapshot_contest',{p_campaign:'2026-10',p_final:final}); toast(final?'Final standings frozen':'Snapshot saved','good'); API.bust(); render(); }catch(e){ toast(e.message,'bad'); } }

route('admin_rewards',async()=>{ const A=await API.page('admin'); const M=A.milestones||[]; const P=A.pacing||{}; const elite=Math.max(0,...M.map(m=>m.xp_required||0)); const on=(A.roster||[]).length;
  const CL={claim_requested:'r',approved_for_payment:'p',paid:'d',rejected:'x'};
  return `${ph('Rewards and claims','Reward tiers, how much XP is reachable, and the claim ledger.',{eyebrow:'Admin'})}
  <div class="grid g3">${M.map(m=>`<div class="card"><div class="row between"><b>${esc(m.name)}</b>${m.published?badge('g','Live'):badge('d','Draft')}</div><div class="disp" style="font-size:28px;font-weight:800;color:var(--gold);margin-top:6px">${fmt.usd(m.cash_total_cents,{cents:true})}</div><div class="mini">${m.xp_required} XP + ${m.concepts_required} approved October videos · month total</div></div>`).join('')}</div>
  <div class="sec"><h2>Claims</h2><span class="mini">Approve, then mark paid once it goes out</span></div><div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Creator</th><th>Tier</th><th class="num">Amount</th><th>State</th><th>Requested</th><th></th></tr></thead><tbody>${(A.claims||[]).map(c=>`<tr><td>${esc(c.display_name)}</td><td>${esc(c.milestone)}</td><td class="num">${fmt.usd(c.amount_cents,{cents:true})}</td><td>${badge(CL[c.state]||'n',c.state.replace(/_/g,' '))}${c.payment_ref?`<div class="mini">${esc(c.payment_ref)}</div>`:''}</td><td class="mono">${fmt.dt(c.requested_at)}</td>
    <td>${c.state==='claim_requested'?`<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" onclick="claimAct('${c.id}','approve')">Approve</button><button class="btn danger sm" onclick="claimAsk('${c.id}','reject')">Reject</button></div>`:c.state==='approved_for_payment'?`<button class="btn sm" onclick="claimAsk('${c.id}','paid')">Mark paid</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mini">No claims yet. Creators claim from Rewards once both bars are full.</td></tr>'}</tbody></table></div></div>
  <div class="sec"><h2>Max XP by join date</h2><span class="mini">From the quest caps</span></div>
  <div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Joins on</th><th class="num">Quest periods left</th><th class="num">Days left</th><th class="num">Max XP (no leaderboard)</th><th class="num">Max XP (all)</th><th>Elite reachable?</th></tr></thead><tbody>${Object.entries(P).sort((a,b)=>+a[0]-+b[0]).map(([d,p])=>`<tr><td>Oct ${d}</td><td class="num">${p.periods_left}</td><td class="num">${p.days_left}</td><td class="num">${p.max_xp_no_leader}</td><td class="num">${p.max_xp_with_leader}</td><td>${p.max_xp_no_leader>=elite?badge('g','Yes'):p.max_xp_with_leader>=elite?badge('r','Only with leaderboard wins'):badge('x','No')}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="sec"><h2>Exposure</h2></div><div class="card"><p style="font-size:14px">Cumulative model: at most $500 per person. ${on} creators on the roster → at most ${fmt.usd(on*500)} in reward payouts if every single one hit Elite, plus the separate $25,000 GMV incentive.</p></div>`; });
function claimAsk(id,action){ const paid=action==='paid'; openDrawer(`<h2>${paid?'Mark claim paid':'Reject claim'}</h2><div class="field"><label for="cnote">${paid?'Payment reference':'Reason (the creator sees this)'}</label>${paid?`<input id="cnote" value="Paid through Trybe">`:`<textarea id="cnote"></textarea>`}</div>
  <div class="row" style="margin-top:12px"><button class="btn ${paid?'':'danger'}" onclick="(async()=>{const n=$('#cnote').value.trim(); if(!n){toast('Required','bad');return;} closeDrawer(true); await claimAct('${id}','${action}',n);})()">${paid?'Mark paid':'Reject'}</button><button class="btn gh" onclick="closeDrawer()">Cancel</button></div>`); }
async function claimAct(id,action,txt){ try{ const r=await API.rpc('decide_claim',{p_claim:id,p_action:action,p_note:action==='reject'?txt:null,p_payment_ref:action==='paid'?txt:null}); toast(r.why||r.state,r.ok?'good':'bad'); API.bust(); render(); }catch(e){ toast(e.message,'bad'); } }
</script>
