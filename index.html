async function saveRpc(a){ try{ return await API.rpc('save_quest_draft',a); }catch(e){ if(a.p_rev!==undefined&&/PGRST202|Could not find the function|p_rev/i.test(e.message||'')){ const {p_rev,...rest}=a; return API.rpc('save_quest_draft',rest); } throw e; } }
function formFor(id){ const f=$('#evform'); return f&&f.dataset.inst===id?f:null; }
function renderSaveState(id){ const st=dstate(id); const el=$('#savestate'); if(!el||el.dataset.inst!==id) return;
  let cls='',html='';
  if(st.inflight) { cls='saving'; html=`<i class="spin" aria-hidden="true"></i> Saving…`; }
  else if(st.err) { cls='bad'; html=`<span aria-hidden="true">⚠</span> Couldn’t save · <a href="#" onclick="saveDraft('${id}');return false">Retry</a>${st.lastSaved?`<small> · last saved ${esc(fmt.ago(st.lastSaved))}</small>`:''}`; }
  else if(st.dirty) { cls='dirty'; html='Unsaved changes'; }
  else if(st.lastSaved) { cls='good'; const age=Date.now()-new Date(st.lastSaved); html=`<span aria-hidden="true">✓</span> Saved ${age<15000?'just now':esc(fmt.ago(st.lastSaved))}`; }
  else html='';
  el.className='mini savestate '+cls; el.innerHTML=html; const m=$('#savestate2'); if(m){ m.className='mini savestate '+cls; m.innerHTML=html; }
  if(cls==='good'||cls==='bad') announce(cls==='good'?'Draft saved':'Draft could not be saved'); }
let ANN_T; function announce(t){ let a=$('#a11y-live'); if(!a){ a=document.createElement('div'); a.id='a11y-live'; a.setAttribute('role','status'); a.setAttribute('aria-live','polite'); a.className='sr'; document.body.appendChild(a); } clearTimeout(ANN_T); ANN_T=setTimeout(()=>{ a.textContent=t; },300); }
function draftChanged(id){ const form=formFor(id); if(!form) return; const st=dstate(id); st.dirty=true; st.err=null; renderSaveState(id);
  const c=form._cat; const snap=readDraft(c); recoverySave(id,snap);               // recovery copy, kept until the server acknowledges
  clearTimeout(st.timer); st.timer=setTimeout(()=>saveDraft(id,true,snap),1000); }
async function saveDraft(id,auto,snapshot){ const st=dstate(id); const form=formFor(id);
  const d=snapshot||(form?readDraft(form._cat):null); if(!d){ const r=recoveryLoad(id); if(!r) return; return saveDraft(id,auto,r.d); }   // form closed: save what was captured
  const seq=++st.seq; st.inflight++; st.err=null; renderSaveState(id);
  try{ const r=await saveRpc({p_instance:id,p_draft:d,p_rev:st.rev});
    st.inflight--;
    if(seq<st.acked){ renderSaveState(id); return; }                               // an older response arrived after a newer one: ignore it
    if(r.ok){ st.acked=seq; st.rev=r.rev??st.rev; st.lastSaved=r.saved_at||new Date().toISOString(); if(seq===st.seq) st.dirty=false;   // only the latest request clears 'unsaved'
      const q=S.cache['my_quests{}']; const inst=q?.instances?.find(i=>i.id===id); if(inst){ inst.draft=d; inst.updated_at=st.lastSaved; inst.draft_rev=st.rev; }
      if(seq===st.seq) recoveryClear(id); if(!auto) toast('Draft saved'); }
    else if(r.why==='stale'){ st.rev=r.rev; if(seq===st.seq){ st.timer=setTimeout(()=>saveDraft(id,true),300); } }   // rebase on the server revision and resend the latest values
    else { st.err=r.why||'not saved'; }
  }catch(e){ st.inflight--; if(seq>=st.acked) st.err=e.message||'network'; }
  renderSaveState(id); }
/* reopening an entry: offer the local recovery copy when it is newer than what the server acknowledged */
function offerRecovery(inst){ const r=recoveryLoad(inst.id); if(!r) return ''; const same=JSON.stringify(r.d)===JSON.stringify(inst.draft||{}); const older=inst.updated_at&&r.at<new Date(inst.updated_at).getTime()-1000;   // a recovery record only survives while a save is unacknowledged
  if(same||older){ recoveryClear(inst.id); return ''; }                                         // identical, or the server has a newer save than this copy: nothing to recover
  return `<div class="note warn recov" id="recov"><b>You have unsaved work on this entry from ${esc(fmt.ago(new Date(r.at).toISOString()))}.</b> <button class="btn sm" onclick="applyRecovery('${inst.id}')">Restore it</button> <button class="btn gh sm" onclick="recoveryClear('${inst.id}');$('#recov')?.remove()">Keep the saved version</button></div>`; }
function applyRecovery(id){ const r=recoveryLoad(id); const form=formFor(id); if(!r||!form) return; (form._cat.proof||[]).forEach(f=>{ const el=$('#f_'+f.field); const v=r.d[f.field]; if(!el||v==null) return; el.value=Array.isArray(v)?v.join('\n'):String(v); }); $('#recov')?.remove(); draftChanged(id); toast('Restored. Saving…'); }
async function openVideoPicker(field,instId,questKey){ let SP={}; try{ SP=await API.page('my_submissions'); }catch(e){} const vids=(SP.videos||[]).filter(v=>v.media_type!=='IMAGE'&&!v.ad_only);
  const q=await API.page('my_quests'); const c=q.catalog.find(x=>x.quest_key===questKey); const f=(c.proof||[]).find(p=>p.field===field); const inst=q.instances.find(i=>i.id===instId);
  const cur=readDraft(c)[field]; const curList=Array.isArray(cur)?cur:(cur?[cur]:[]); const sel=new Set(curList.map(String));
  const usedElsewhere=new Set(); q.instances.filter(i=>i.quest_key===questKey&&i.id!==instId).forEach(i=>{ const v=i.draft?.[field]; (Array.isArray(v)?v:[v]).forEach(x=>x&&usedElsewhere.add(String(x))); });
  const byVal=v=>f.type==='submission_list'?v.id:(v.media_url||v.id); const max=f.max||(f.type==='url'?1:99);
  const html=`<div class="picker" id="vpick"><div class="row between"><div><div class="lbl">Choose my videos</div><h3 style="margin:0">${esc(f.label)}</h3><div class="mini">Tap to select${max>1?` · up to ${max}`:''}${c.reuse_rule?' · '+esc(c.reuse_rule):''}</div></div><button class="licon" aria-label="Close" onclick="closeVideoPicker()">${ico('x',18)}</button></div>
    <div class="pgrid">${vids.map(v=>{ const val=String(byVal(v)); const on=sel.has(val); const used=usedElsewhere.has(val); const [bk,bl]=SSTATE[v.status]||['n',v.status]; return `<button class="pv ${on?'on':''}" data-val="${esc(val)}" onclick="toggleVid(this,${max})"><span class="pth">${thumb(v.thumb_url,'tile','Film')}<span class="pck">${ico('check',12)}</span></span><span class="pt">${esc(v.title||'')}</span><span class="mini">${fmt.date(v.submitted_at)} · <span class="badge ${bk}">${bl}</span>${used?' · used on this quest before':''}</span></button>`; }).join('')||'<p class="mini">No videos on your Trybe account yet.</p>'}</div>
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn" onclick="applyVids('${field}','${instId}','${f.type}')">Attach selected</button><button class="btn gh" onclick="closeVideoPicker()">Cancel</button><span class="mini">Pasting a link still works too.</span></div></div>`;
  const d=$('#drawer'); const box=document.createElement('div'); box.className='pickwrap'; box.innerHTML=html; d.appendChild(box); box.scrollIntoView({behavior:'smooth',block:'start'}); }
function toggleVid(btn,max){ const on=btn.classList.contains('on'); if(!on&&max===1) $$('#vpick .pv.on').forEach(b=>b.classList.remove('on')); if(!on&&$$('#vpick .pv.on').length>=max){ toast(`Up to ${max} for this one`,'bad'); return; } btn.classList.toggle('on',!on); }
function applyVids(field,instId,type){ const vals=$$('#vpick .pv.on').map(b=>b.dataset.val); const el=$('#f_'+field); if(!el) return;
  if(type==='url'){ el.value=vals[0]||''; } else { const cur=el.value.split(/\n+/).map(x=>x.trim()).filter(Boolean); const merged=[...new Set([...cur,...vals])]; el.value=merged.join('\n'); }
  closeVideoPicker(); draftChanged(instId); toast(vals.length?`${vals.length} attached`:'Nothing selected'); }
function closeVideoPicker(){ $$('.pickwrap').forEach(e=>e.remove()); }
async function tickStep(id,i,on){ const q=await API.page('my_quests'); const inst=q.instances.find(x=>x.id===id); const ck=[...(inst.checklist||[])]; ck[i]=on; try{ const r=await API.rpc('save_quest_draft',{p_instance:id,p_draft:null,p_checklist:ck}); if(r.ok) inst.checklist=ck; else toast('Could not save the tick','bad'); }catch(e){ toast('Could not save the tick. Try again.','bad'); } }
async function startQuest(key){ const b=$('#startbtn'); if(b){ b.classList.add('pending'); b.disabled=true; } try{ const useRef=(REF_QUESTS.includes(key)?(S.ui.qref||S.params.ref):null)||null; const r=await API.rpc('start_quest',{p_quest:key,p_inspiration_ref:useRef}); if(!r.ok){ toast(r.why,'bad'); return; } if(useRef){ S.ui.qref=null; saveUI(); } API.bust(); await API.page('my_quests'); openQuest(key,r.instance_id); toast(r.why==='resumed'?'Resumed your entry':'Quest started'); render(); } catch(e){ toast(e.message,'bad'); } finally{ if(b){ b.classList.remove('pending'); b.disabled=false; } } }
async function submitQuest(ev,id){ ev.preventDefault(); const q=await API.page('my_quests'); const inst=q.instances.find(i=>i.id===id); const c=q.catalog.find(x=>x.quest_key===inst.quest_key); const d=readDraft(c);
  $$('.ferr').forEach(e=>e.textContent=''); $$('.field').forEach(e=>e.classList.remove('err'));
  const errs=validateEvidence(c.proof,d); if(errs.length){ errs.forEach(e=>{ const f=(c.proof||[]).find(p=>e.startsWith(p.label)); if(f){ $('#e_'+f.field).textContent=e; $(`.field[data-field="${f.field}"]`).classList.add('err'); } else $('#everr').textContent=e; }); $('#everr').textContent=$('#everr').textContent||'Fix the fields above, then submit again.'; return false; }
  const b=$('#subbtn'); if(b.disabled) return false; b.classList.add('pending'); b.disabled=true;
  try{ const st=dstate(id); clearTimeout(st.timer); const s=await saveRpc({p_instance:id,p_draft:d,p_rev:st.rev}); if(!s.ok&&s.why==='stale'){ st.rev=s.rev; const s2=await saveRpc({p_instance:id,p_draft:d,p_rev:st.rev}); if(!s2.ok){ $('#everr').textContent='Could not save your evidence before submitting: '+(s2.why||'')+'. Your draft is kept.'; return false; } st.rev=s2.rev; }
    else if(!s.ok){ $('#everr').textContent='Could not save your evidence before submitting: '+(s.why||'')+'. Your draft is kept.'; return false; } else st.rev=s.rev??st.rev;
    st.lastSaved=new Date().toISOString(); st.dirty=false; recoveryClear(id);
    inst._req=inst._req||uid(); const r=await API.rpc('submit_quest',{p_instance:id,p_request_id:inst._req});
    if(!r.ok){ (r.errors||[]).forEach(e=>{ const f=(c.proof||[]).find(p=>e.startsWith(p.label)); if(f){ $('#e_'+f.field).textContent=e; $(`.field[data-field="${f.field}"]`).classList.add('err'); } }); $('#everr').textContent=(r.errors||[]).find(e=>!(c.proof||[]).some(p=>e.startsWith(p.label)))||r.why||'Could not submit. Your draft is kept.'; return false; }
    API.bust(); toast(r.why==='already received'?'Already received. Nothing was sent twice.':'Submitted. An admin will verify it.','good'); await API.page('my_quests'); openQuest(c.quest_key,id); render(); }
  catch(e){ $('#everr').textContent='Could not reach the server: '+e.message+'. Your draft is kept, try again.'; }
  finally{ b.classList.remove('pending'); b.disabled=false; } return false; }

/* ---- Refresh status (Oct 21): one entry, fresh from the server, cache bypassed. Never reloads the page or touches other drafts. ---- */
const RS={};   // entry id -> {at, busy, err}
function refreshRow(inst){ const r=RS[inst.id]||{}; const t=r.busy?'Checking…':r.err?`<span class="bad">Couldn’t check status</span> · <a href="#" onclick="refreshStatus('${inst.quest_key}','${inst.id}');return false">Retry</a>${r.at?` <small>· last checked ${esc(fmt.ago(r.at))}</small>`:''}`:r.at?(r.changed?'':`Still in review · checked ${Date.now()-new Date(r.at)<15000?'just now':esc(fmt.ago(r.at))}`):'';
  return `<div class="refrow" id="refrow_${inst.id}"><button class="btn gh sm" ${r.busy?'disabled':''} onclick="refreshStatus('${inst.quest_key}','${inst.id}')">${ico('refresh',13)} ${r.busy?'Checking…':'Refresh status'}</button><span class="mini">${t}</span></div>`; }
async function refreshStatus(key,id){ const r=RS[id]||(RS[id]={}); if(r.busy) return; r.busy=true; r.err=null; const row=$('#refrow_'+id); if(row){ const q0=S.cache['my_quests{}']; const i0=q0?.instances?.find(x=>x.id===id); if(i0) row.outerHTML=refreshRow(i0); }
  try{ const fresh=await API.rpc('my_quest_instance',{p_instance:id}); r.busy=false; if(!fresh) throw new Error('not found');
    r.at=fresh.checked_at||new Date().toISOString(); const q=S.cache['my_quests{}']; const i=q?.instances?.find(x=>x.id===id); const before=i?.state;
    if(i){ Object.assign(i,fresh); } r.changed=before!==fresh.state;
    if(r.changed){ API.bust(); try{ await API.page('my_quests'); await API.page('my_rewards'); }catch(e){} announce(fresh.state==='approved'?'Quest approved':'Quest returned for changes'); toast(fresh.state==='approved'?`Approved · +${fresh.xp||''} XP`:fresh.state==='needs_changes'?'Returned with feedback':'Status updated',fresh.state==='approved'?'good':''); openQuest(key,id); if(S.view==='quests'||S.view==='submissions') render(); }
    else { const row2=$('#refrow_'+id); if(row2&&i) row2.outerHTML=refreshRow(i); announce('Still in review'); }
  }catch(e){ r.busy=false; r.err=e.message||'failed'; const q=S.cache['my_quests{}']; const i=q?.instances?.find(x=>x.id===id); const row2=$('#refrow_'+id); if(row2&&i) row2.outerHTML=refreshRow(i); } }

/* ---------------- Rewards

   No stacking: the highest tier hit in a half is that half's total. A finished half stays claimable after the reset. */
const R_DONE=['eligible','claim_submitted','approved_for_payment','paid','included'];
route('rewards',async()=>{

    <div class="rwhero-steps">${tiers.map(t=>`<span class="${R_DONE.includes(t.status)?'on':''}">${fmt.usd(t.cash_total_cents,{cents:true})} <i>${esc(tierReq(t))}</i></span>`).join('')}</div></div></div>

/* ctx = the half the tier belongs to: {xp, concepts} (the current half is the my_rewards payload itself) */
function tierNeeds(t,ctx){ const xp=ctx.xp||0, cc=ctx.concepts||0, sl=ctx.sales_cents||0, miss=[]; if(!t.xp_met) miss.push(`${t.xp_required-xp} more XP`); if(!t.concepts_met) miss.push(`${t.concepts_required-cc} more approved video${t.concepts_required-cc===1?'':'s'}`); if(t.sales_met===false) miss.push(`${usd0(t.sales_required_cents-sl)} more in Trybe sales`); return miss; }

  <div class="req">${pbar(Math.min(xp,t.xp_required),t.xp_required,{label:'XP',cls:'gold'})}${pbar(Math.min(cc,t.concepts_required),t.concepts_required,{label:'Approved videos',cls:'green'})}${salesBar(t,ctx,'Trybe sales')}</div>

/* ---- Quest reset clock: counts down to 12:00 am CT on the 1st and 16th (the server's period end wins when loaded) */
function ctMidnight(y,m,d){ let t=Date.UTC(y,m-1,d,5); const h=+new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hourCycle:'h23'}).format(new Date(t)); if(h===23) t+=36e5; return t; }
function nextResetAt(){ const now=Date.now(); const q=S.cache['my_quests{}']; const pn=q&&(q.periods||[]).find(p=>p.key===q.period_now);
  if(pn?.ends_at&&new Date(pn.ends_at)>now) return new Date(pn.ends_at).getTime();
  const r=S.cache['my_rewards{}']; if(r?.period?.ends_at&&new Date(r.period.ends_at)>now) return new Date(r.period.ends_at).getTime();
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(now)).map(x=>[x.type,x.value]));
  let y=+p.year,m=+p.month,d=+p.day; if(d<16) return ctMidnight(y,m,16); m++; if(m>12){ m=1; y++; } return ctMidnight(y,m,1); }
function leftParts(ms){ ms=Math.max(0,ms); return {d:Math.floor(ms/864e5),h:Math.floor(ms%864e5/36e5),m:Math.floor(ms%36e5/6e4),s:Math.floor(ms%6e4/1e3)}; }
function leftShort(ms){ const p=leftParts(ms); return (p.d?p.d+'d ':'')+p.h+'h '+String(p.m).padStart(2,'0')+'m '+String(p.s).padStart(2,'0')+'s'; }
function leftWords(ms){ const p=leftParts(ms), w=(n,u)=>`${n} ${u}${n===1?'':'s'}`; return [p.d?w(p.d,'day'):'',w(p.h,'hour'),w(p.m,'minute'),w(p.s,'second')].filter(Boolean).join(', '); }
function resetBig(){ const at=nextResetAt(); const p=leftParts(at-Date.now());
  return `<div class="rclock" data-reset-clock><div class="lbl">⏳ Quest reset in</div>
    <div class="cd rc-cd"><div><b data-u="d">${p.d}</b><span>DAYS</span></div><div><b data-u="h">${p.h}</b><span>HRS</span></div><div><b data-u="m">${p.m}</b><span>MIN</span></div><div><b data-u="s">${p.s}</b><span>SEC</span></div></div>
    <div class="mini" style="margin-top:8px">${esc(fmt.date(new Date(at)))}, 12:00 am CT. XP, approved videos and quests all go back to 0.</div></div>`; }
let RESET_FIRED=0;
function tickReset(){ const at=nextResetAt(); const ms=at-Date.now(); const on=!!S.me;
  [['#qtimer',`<span class="qt-l">Quest reset</span><span class="qt-v">${leftShort(ms)}</span>`],['#qtimer-m',`<span class="qt-l">Quest reset</span><span class="qt-v">${leftShort(ms)}</span>`]].forEach(([sel,html])=>{ const el=$(sel); if(!el) return; el.hidden=!on; if(on){ el.innerHTML=html; el.classList.toggle('soon',ms<6*36e5); el.setAttribute('aria-label',`Quest reset in ${leftWords(ms)}. Open quests`); } });
  $$('[data-reset-clock]').forEach(el=>{ const p=leftParts(ms); ['d','h','m','s'].forEach(u=>{ const b=el.querySelector(`[data-u="${u}"]`); if(b) b.textContent=p[u]; }); el.classList.toggle('soon',ms<6*36e5); });
  // the half just rolled over: reload everything once so the new half shows
  if(on&&ms<=0&&RESET_FIRED!==at){ RESET_FIRED=at; setTimeout(()=>{ API.bust(); render(); toast('New half started. XP and quests are back to 0.','good'); },1500); } }

function shrinkImage(file){ return new Promise((res,rej)=>{ if(file.type&&!/^image\//.test(file.type)) return rej(new Error('Pick an image: a screenshot or a photo.'));

    if(r.status===403||/row-level security|unauthori/i.test(t)) throw new Error('Upload was blocked. Close the app, open your link again and retry.');

async function signShots(urls){ const need=[...new Set(urls)].filter(u=>isShot(u)&&!SIGNED[u]&&!S.shotPreview[u]); if(!need.length) return;

    if(!r.ok) return; const j=await r.json(); (Array.isArray(j)?j:[]).forEach(x=>{ const i=paths.indexOf(x.path); if(i>=0&&x.signedURL) SIGNED[need[i]]=LIVE.url+'/storage/v1'+x.signedURL; }); }catch(e){} }

/* ROAS vs spend dot plot. Each dot is one video (its thumbnail), x = spend (log), y = ROAS,
   size by spend, ring colour by band. Every number is repeated in the list below it. */
function roasChart(rows){
  const pts=rows.filter(x=>x.spend>0&&x.roas!=null); if(pts.length<2) return '';
  const W=420,H=250,L=34,R=12,T=18,B=28; const lg=v=>Math.log10(Math.max(v,1));
  const xs=pts.map(p=>lg(p.spend)), x0=Math.min(...xs)-.15, x1=Math.max(...xs)+.15;
  const yMax=Math.max(...pts.map(p=>p.roas)); const yTop=Math.max(3,Math.min(8,Math.ceil(yMax*1.12)));   // outliers sit on the top edge, labelled
  const px=v=>L+(lg(v)-x0)/(x1-x0||1)*(W-L-R), py=v=>T+(1-Math.min(v,yTop)/yTop)*(H-T-B);
  const mxs=Math.max(...pts.map(p=>p.spend)); const rad=s=>5+Math.sqrt(s/mxs)*14;
  const ticks=[1,10,100,1000,10000,100000].filter(v=>lg(v)>=x0&&lg(v)<=x1);
  const yt=[]; for(let v=0;v<=yTop;v+=(yTop>6?2:1)) yt.push(v);
  const grid=yt.map(v=>`<line x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}" stroke="rgba(255,255,255,.06)"/><text x="${L-7}" y="${py(v)+3.5}" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">${v}x</text>`).join('');
  const xax=ticks.map(v=>`<text x="${px(v)}" y="${H-9}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">$${v>=1000?(v/1000)+'k':v}</text>`).join('');
  const refs=`<line x1="${L}" y1="${py(1)}" x2="${W-R}" y2="${py(1)}" stroke="#FF5C4D" stroke-width="1.4" stroke-dasharray="4 4" opacity=".55"/><text x="${L+4}" y="${py(1)+12}" font-size="8.5" font-weight="700" fill="#FF5C4D" letter-spacing=".06em">BREAK EVEN</text>${yTop>=2?`<line x1="${L}" y1="${py(2)}" x2="${W-R}" y2="${py(2)}" stroke="#3DDC84" stroke-width="1.4" stroke-dasharray="4 4" opacity=".5"/><text x="${L+4}" y="${py(2)-5}" font-size="8.5" font-weight="700" fill="#3DDC84" letter-spacing=".06em">BRAND KEEPS FEEDING IT</text>`:''}`;
  const order=pts.map((p,i)=>i).sort((a,b)=>pts[b].spend-pts[a].spend); // big dots first, small on top
  const defs=pts.map((p,i)=>p.thumb_url?`<clipPath id="cp${i}"><circle cx="${px(p.spend).toFixed(1)}" cy="${py(p.roas).toFixed(1)}" r="${rad(p.spend).toFixed(1)}"/></clipPath>`:'').join('');
  const dots=order.map(i=>{ const p=pts[i], b=BAND(p.roas), cx=px(p.spend), cy=py(p.roas), r=rad(p.spend);
    const img=p.thumb_url?`<image href="${esc(p.thumb_url)}" x="${(cx-r).toFixed(1)}" y="${(cy-r*1.15).toFixed(1)}" width="${(r*2).toFixed(1)}" height="${(r*2.3).toFixed(1)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})"/>`:'';
    const top=p.roas>yTop?`<text x="${cx.toFixed(1)}" y="${(cy-r-5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="800" fill="${BANDHEX[b]}">${p.roas.toFixed(1)}x ↑</text>`:'';
    return `<g class="cdot" data-i="${i}" onmouseenter="roasTip(this)" onmouseleave="roasTipHide()" onclick="openVideo('${esc(p.id)}')">${top}<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${BANDHEX[b]}" fill-opacity=".85"/>${img}<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="none" stroke="${BANDHEX[b]}" stroke-width="2.5"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r+1.6).toFixed(1)}" fill="none" stroke="#111419" stroke-width="1.5"/></g>`; }).join('');
  window.__rpts=pts;
  return `<div class="card" style="margin-top:14px"><div class="row between"><h3>Where your money is going</h3><span class="mini">${pts.length} videos</span></div>
   <div class="mini" style="margin:4px 0 10px">Each dot is one video. Further right = more ad spend behind it. Higher = ${S.mroas?'higher ROAS':'more Trybe sales per dollar'}. Tap one to open it.</div>
   <div class="chartwrap" id="cw"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend against return for each of your videos"><defs>${defs}</defs>${grid}${refs}${xax}${dots}</svg><div class="ctip" id="ctip"></div></div>
   <div class="clg"><span><i style="background:${BANDHEX.good}"></i>2x and up · winning</span><span><i style="background:${BANDHEX.warn}"></i>1–2x · working</span><span><i style="background:${BANDHEX.bad}"></i>under 1x · costing money</span></div></div>`;
}
function roasTip(el){ const d=(window.__rpts||[])[+el.dataset.i]; const tip=$('#ctip'), wrap=$('#cw'); if(!d||!tip||!wrap) return; const b=BAND(d.roas);
  tip.innerHTML=`<b>${esc(d.title||'Video')}</b><div class="r"><span>Spend</span><i>${money(d.spend)}</i></div><div class="r"><span>Trybe sales</span><i>${money(d.sales)}</i></div><div class="r"><span>${RL()}</span><i style="color:${BANDHEX[b]}">${roasX(d.roas)}</i></div><div class="r"><span>Hook rate</span><i>${d.hook==null?'—':Math.round(d.hook)+'%'}</i></div>${d.hold!=null?`<div class="r"><span>Hold rate</span><i>${pct(d.hold)}</i></div>`:''}${d.atc!=null?`<div class="r"><span>ATC rate</span><i>${pct(d.atc)}</i></div>`:''}`;
  const r=wrap.getBoundingClientRect(), c=el.getBoundingClientRect(); tip.classList.add('on'); const half=tip.offsetWidth/2, pad=6;
  tip.style.left=Math.max(half+pad,Math.min(r.width-half-pad,c.left-r.left+c.width/2))+'px'; tip.style.top=Math.max(tip.offsetHeight*0.2,c.top-r.top)+'px';
  wrap.querySelectorAll('.cdot').forEach(o=>o.style.opacity=(o===el?'1':'.35')); }

/* ---------------- Video stat sheet (Austin, Oct 14): every number from Trybe's video panel, next to your average.
   Every sales number is Trybe-attributed. ROAS matches Trybe's ROAS column (Oct 27); Meta also supplies hold rate and add-to-cart rate. */
const VS_GROUPS=[
  ['💰 Results',[['sales','Sales (Trybe)','money',1],['roas','ROAS','x',1],['spend','Ad spend','money',0]]],
  ['👀 Hook and watch time',[['thumbstop','Thumbstop (hook rate)','pct1',1],['avg_watch_s','Avg watched','watch',1],['v3s','3-sec views','int',0]]],
  ['👆 Reach and clicks',[['impressions','Impressions','int',0],['ctr','CTR (link)','pct2',1],['link_clicks','Link clicks','int',0],['cpc_link','Cost per click','usd2',-1],['cpm','CPM','usd2',-1]]],
  ['🛒 Add to cart',[]],
];
function vsFmt(k,f,o){ const v=o?.[k]; if(v==null||!isFinite(v)) return '—'; const n=Number(v);
  return f==='money'?money(n):f==='usd2'?fmt.usd2(n):f==='x'?n.toFixed(2)+'x':f==='pct1'?n.toFixed(1)+'%':f==='pct2'?n.toFixed(2)+'%':f==='int'?fmt.int(Math.round(n)):f==='num1'?(Number.isInteger(n)?fmt.int(n):n.toFixed(1)):f==='watch'?`${n.toFixed(1)}s${o.avg_watch_pct!=null?` <small>(${Number(o.avg_watch_pct).toFixed(0)}%)</small>`:''}`:String(n); }
function vsDelta(k,better,x,me){ const a=Number(x?.[k]), b=Number(me?.[k]); if(!isFinite(a)||!isFinite(b)||x?.[k]==null||me?.[k]==null||b===0) return '';
  const p=(a-b)/Math.abs(b)*100; if(Math.abs(p)<3) return `<span class="vsd eq">≈ your avg</span>`;
  const up=p>0, cls=better===0?'n':((up?1:-1)*better>0?'g':'b'); const t=Math.abs(p)>=900?Math.round(a/b)+'x':Math.round(Math.abs(p))+'%';
  return `<span class="vsd ${cls}">${up?'▲':'▼'} ${t}</span>`; }
function vsTips(x,me){ if(!x||!me) return []; const T=[]; const lo=(k,f=0.85)=>x[k]!=null&&me[k]!=null&&Number(me[k])>0&&Number(x[k])<Number(me[k])*f; const hi=(k,f=1.15)=>x[k]!=null&&me[k]!=null&&Number(me[k])>0&&Number(x[k])>Number(me[k])*f;
  if(lo('thumbstop')) T.push('👀 Fewer people stopped on this one than on your usual video. Test a stronger first 2 seconds: movement, a bold visual or a question right away.');
  if(lo('avg_watch_pct')) T.push('⏱️ People left earlier than usual. Cut the slow parts and get to the point sooner.');
  if(lo('ctr')) T.push('👆 Fewer clicks than your average. Make the reason to tap clearer near the end.');
  if(!T.length&&hi('thumbstop')&&hi('ctr',1.0)) T.push('🔥 This one beats your average on hook and clicks. Make more like it: same opening style, new angle.');
  else if(!T.length&&hi('roas')) T.push('🔥 Better ROAS than your average. Study what this one does differently and repeat it.');
  return T.slice(0,2); }
function vsRetention(x,me){ const P=[['25%','ret25'],['50%','ret50'],['75%','ret75'],['End','ret100']]; if(P.every(([,k])=>x?.[k]==null)) return '';
  return `<div class="vsret">${P.map(([l,k])=>{ const a=clamp(Number(x[k])||0,0,100), b=me?.[k]!=null?clamp(Number(me[k]),0,100):null; return `<div class="rc"><div class="rbar"><i style="height:${a}%"></i>${b!=null?`<b style="bottom:${b}%" title="Your avg ${Math.round(b)}%"></b>`:''}</div><span>${Math.round(a)}%</span><small>${l}</small></div>`; }).join('')}</div>
    <div class="mini" style="margin-top:6px">Share of viewers still watching at each point${x.duration?` of the ${x.duration}s video`:''}. The white line is your average.</div>`; }
function vsHtml(d,rk,v){ const R=d[rk]||{}, x=R.video, me=R.me, rv=R.ravine; if(x&&Object.prototype.hasOwnProperty.call(x,'ad_sales')) S.mroas=true; const lbl=rk==='month'?'October':'All time';
  const tabs=`<div class="vstabs" role="tablist">${[['month','October'],['all','All time']].map(([k,t])=>`<button role="tab" aria-selected="${rk===k}" class="${rk===k?'on':''}" onclick="S.ui.vsr='${k}';saveUI();renderVideoStats()">${t}</button>`).join('')}</div>`;
  if(!x) return `<section><div class="row between"><h3 style="margin:0">📊 Stat sheet</h3>${tabs}</div><div class="note" style="margin-top:10px">No ad stats for this video ${rk==='month'?'in October':'yet'}. Stats show once it has $1 or more in ad spend${rk==='month'?' this month':''}.</div></section>`;
  const tips=vsTips(x,me);
  return `<section><div class="row between"><h3 style="margin:0">📊 Stat sheet</h3>${tabs}</div>
    <div class="mini" style="margin-top:6px">${lbl} · compared to your average video${me?.n?` (${me.n} with ad spend)`:''}. Green = better than your average, red = worse.</div>
    ${tips.length?`<div class="vstips">${tips.map(t=>`<div>${esc(t)}</div>`).join('')}${typeof KB_COURSE_URL!=='undefined'&&tips.some(t=>!t.startsWith('🔥'))?`<div class="vskb"><a class="btn gh sm" ${openExt(KB_COURSE_URL)}>📚 Learn the fix in Chris's Knowledge Bombs ${ico('ext',12)}</a></div>`:''}</div>`:''}
    ${VS_GROUPS.filter(([g])=>!g.startsWith('🛒')||(rk==='month'?v.oct_atc_rate:v.atc_rate)!=null).map(([g,rows])=>`<div class="vsgrp"><div class="vsg">${g}</div>${rows.map(([k,label,f,better])=>{ const dl=vsDelta(k,better,x,me);
      return `<div class="vsrow"><div class="vsl">${esc(k==='roas'?RL():label)}</div><div class="vsv">${vsFmt(k,f,x)}</div><div class="vss">${dl}${me?`<span>Your avg ${vsFmt(k,f,me)}</span>`:''}${rv?`<span>Ravine ${vsFmt(k,f,rv)}</span>`:''}</div></div>`; }).join('')}
      ${g.startsWith('🛒')&&(rk==='month'?v.oct_atc_rate:v.atc_rate)!=null?`<div class="vsrow"><div class="vsl">Add-to-cart rate</div><div class="vsv">${pct(rk==='month'?v.oct_atc_rate:v.atc_rate)}</div><div class="vss"><span>Adds to cart ÷ landing page views</span></div></div>`:''}
      ${g.startsWith('👀')?vsRetention(x,me):''}${g.startsWith('👀')&&(rk==='month'?v.oct_hold_rate:v.hold_rate)!=null?`<div class="vsrow"><div class="vsl">Hold rate</div><div class="vsv">${pct(rk==='month'?v.oct_hold_rate:v.hold_rate)}</div><div class="vss"><span>ThruPlays ÷ 3-second plays</span></div></div>`:''}</div>`).join('')}
    <div class="mini" style="margin-top:10px">Sales are Trybe-attributed, the same numbers you are paid on. ${RDEF()} Hold rate and add-to-cart rate come from Meta. Stats from ${esc(fmt.dt(d.data_through)||'the last update')}.</div></section>`; }

/* 5th column = cover photo key → ph/angle-<key>.jpg (a frame from an approved Ravine video, cropped 16:10, chosen by hand Oct 19) */
const SETTINGS=['🎯 Range','🌲 Hunting','🦆 Waterfowl','🔨 Work & Yard','🏡 Everyday','📦 Any'];
const FORMATS=['Talking Head','Faceless / B-roll VO','This vs That','Skit','Story Time','Humor','Reverse Psychology','Tier List','Listicle','Split Screen','Explainer','Unboxing / Test','Game / Quiz','Interview','AI','Music / Song','Spanish'];
const SORTS=[['mix','Mixed up'],['spend','Highest ad spend'],['hook','Best 3s hook rate'],['watch','Longest watch (seconds)'],['ctr','Best video CTR'],['new','Newest'],['old','Oldest']];
const CTA_TYPES=[['link','Link'],['offer','Offer'],['urgency','Urgency'],['gift','Gift'],['soft','Soft close']];
const VIEWS=[['grid','Videos'],['list','Hooks'],['cta','CTAs']];
const RECENT_DAYS=14;
const LIB=()=>window.ANGLE_LIBRARY||{meta:{},videos:[]};
async function loadLib(){ if(!window.ANGLE_LIBRARY){ const r=await fetch('./data/angle_library.json?v='+(window.BUILD||'')); if(!r.ok) throw new Error('could not load the Angle Library'); window.ANGLE_LIBRARY=await r.json(); } }
async function loadScripts(){ if(!window.ANGLE_SCRIPTS){ const r=await fetch('./data/angle_scripts.json?v='+(window.BUILD||'')); window.ANGLE_SCRIPTS=r.ok?await r.json():{}; } return window.ANGLE_SCRIPTS; }
const LSAVED='rcg_saved_lib';
function libSaved(){ try{ return new Set(JSON.parse(localStorage.getItem(LSAVED)||'[]')); }catch(e){ return new Set(); } }
function libToggleSaved(id,ev){ if(ev){ ev.stopPropagation(); ev.preventDefault(); } const s=libSaved(); s.has(id)?s.delete(id):s.add(id); try{ localStorage.setItem(LSAVED,JSON.stringify([...s])); }catch(e){}
  const on=s.has(id); toast(on?'Saved on this device':'Removed from saved');
  $$(`[data-save="${id}"]`).forEach(b=>{ b.setAttribute('aria-pressed',on); b.classList.toggle('on',on); b.setAttribute('aria-label',on?'Remove from saved':'Save'); if(b.dataset.label) b.innerHTML=`${ico('star',14)} ${on?'Saved':'Save'}`; });
  const sb=$('#lsavedbtn'); if(sb) sb.innerHTML=`${ico('star',14)} Saved (${s.size})`; const ls=libLS(); if(ls.sv) libGrid(); }
const angleOf=k=>ANGLES.find(a=>a[0]===k);
const plain=s=>String(s||'').replace(/^[^\w¿¡"'(]+\s*/u,'');
const lmoney=v=>v==null?'—':'$'+Math.round(v).toLocaleString('en-US');
const pct1=v=>v==null?'—':Number(v).toFixed(1)+'%';
const secs=v=>v==null?'—':Number(v).toFixed(1)+'s';
const dur=v=>v==null?'':Math.round(v)+'s';
const recentCut=()=>{ const d=new Date(); d.setDate(d.getDate()-RECENT_DAYS); return d.toISOString().slice(0,10); };
const libLS=()=>{ const u=S.ui; return {a:u.la||'All',s:u.ls||'All',f:u.lf||'All',q:u.lq||'',co:!!u.lco,ran:!!u.lran,sv:!!u.lsv,nw:!!u.lnew,sort:u.lsort||'mix',view:u.lview||'grid',ct:u.lct||'All'}; };
const nFilters=st=>[st.s!=='All',st.f!=='All',st.co,st.ran,st.sv,st.nw].filter(Boolean).length;

function libFilterWith(st){ const {a,s,f,q,co,ran,sv,nw,view,ct}=st; const saved=libSaved(); const qq=q.trim().toLowerCase(); const SC=window.ANGLE_SCRIPTS||null; const cut=recentCut();
  return LIB().videos.filter(v=>(a==='All'||v.a===a)&&(s==='All'||v.s===s)&&(f==='All'||(v.f||[]).includes(f))&&(!co||v.co)&&(!ran||v.sp>=50)&&(!sv||saved.has(v.id))&&(!nw||(v.d&&v.d>=cut))
    &&(view!=='cta'||(v.ct&&(ct==='All'||(v.cty||[]).includes(ct))))&&(view!=='list'||v.h)
    &&(!qq||(v.h+' '+(v.ct||'')+' '+v.w+' '+v.c+' '+v.t+' '+(v.f||[]).join(' ')+' '+(SC&&SC[v.id]||'')).toLowerCase().includes(qq))); }
function libFilter(){ return libFilterWith(libLS()); }
function libSort(L,sort=libLS().sort){ const n=x=>x==null?-1:Number(x); const rel=x=>x.sp>=50?1:0;
  const by={mix:(x,y)=>x.o-y.o, spend:(x,y)=>n(y.sp)-n(x.sp)||x.o-y.o, hook:(x,y)=>rel(y)-rel(x)||n(y.hr)-n(x.hr)||n(y.sp)-n(x.sp), watch:(x,y)=>rel(y)-rel(x)||n(y.ws)-n(x.ws)||n(y.sp)-n(x.sp), ctr:(x,y)=>rel(y)-rel(x)||n(y.ctr)-n(x.ctr)||n(y.sp)-n(x.sp), new:(x,y)=>(y.d||'').localeCompare(x.d||'')||x.o-y.o, old:(x,y)=>(x.d||'').localeCompare(y.d||'')||x.o-y.o}[sort]||((x,y)=>x.o-y.o);
  return L.slice().sort(by); }
/* Austin, Oct 19: never show the same creator's videos back to back, on every sort. Pull the next different creator
   forward whenever two neighbours share one (the ranking stays almost exactly in place). */
function libSpread(L){ const out=L.slice();
  for(let i=1;i<out.length;i++){ if(out[i].c!==out[i-1].c) continue; const c=out[i].c; let j=i+1; while(j<out.length&&out[j].c===c) j++;
    if(j<out.length){ const [x]=out.splice(j,1); out.splice(i,0,x); }
    else { for(let p=i-2;p>=0;p--){ if(out[p].c!==c&&out[p+1].c!==c){ const [x]=out.splice(i,1); out.splice(p+1,0,x); break; } } } }
  return out; }
function libList(){ return libSpread(libSort(libFilter())); }

/* ---------- page ---------- */
route('library',async(p)=>{ await loadLib(); const D=LIB(); const M=D.meta||{};
  if(p.a&&(p.a==='All'||angleOf(p.a))) S.ui.la=p.a; if(p.f&&(p.f==='All'||FORMATS.includes(p.f))) S.ui.lf=p.f;   // Oct 24: quests link straight to a format (AI) if(p.view&&VIEWS.some(v=>v[0]===p.view)) S.ui.lview=p.view;
  if(p.id){ const v=D.videos.find(x=>x.id===p.id); if(v) setTimeout(()=>openLibVideo(v.id),80); }
  S.ui.lpage=1; saveUI(); const st=libLS(); const saved=libSaved();
  setTimeout(()=>{ libRail(); libToolbar(); libGrid(); libRestoreScroll(); },0);
  const upd=M.metrics_at?fmt.dt(M.metrics_at):'';
  return `<div class="lib">
  <header class="lhead">
   <div class="lhead-l"><div class="eyebrow">Create</div><h1>Angle Library</h1><p class="lsub">Find a structure. Film your own version.</p>
    <div class="lmeta"><span>${(M.n||0).toLocaleString()} videos</span><i>·</i><span>${(M.ran||0).toLocaleString()} ad tested</span><i>·</i><span>${M.coached||0} coached</span>
     <details class="linfo"><summary aria-label="About these numbers">${ico('info',14)}</summary><div class="linfo-pop"><b>What the numbers are</b><p>${M.creators||0} creators. Ad numbers come from Trybe and cover each video's ads, all time. <b>3s hook rate</b>: share of impressions that watched past 3 seconds. <b>Avg watch</b>: seconds and share of the video. <b>Video CTR</b>: link clicks per impression for the whole ad. Sales and earnings are never shown.</p><p class="mini">Ad numbers updated ${upd||'—'}. Library refreshed ${M.at?fmt.dt(M.at):'—'}. A new approval can show before its ad numbers exist.</p></div></details></div>
   </div>
   <div class="lhead-r"><button id="lsavedbtn" class="btn gh sm" onclick="libSet({lsv:!S.ui.lsv})" aria-pressed="${st.sv}">${ico('star',14)} Saved (${saved.size})</button><span class="lupd">Updated ${esc(upd)}</span></div>
  </header>
  <div class="lrail-wrap"><button class="lrail-arr l" aria-label="Scroll angles left" onclick="libRailScroll(-1)">${ico('arrow',18)}</button><div class="lrail" id="lrail" role="tablist" aria-label="Angles"></div><button class="lrail-arr r" aria-label="Scroll angles right" onclick="libRailScroll(1)">${ico('arrow',18)}</button></div>
  <div class="ltool" id="ltool"></div>
  <div class="lsrow" id="lsrow" hidden><input type="search" placeholder="Search hooks, closes, scripts, creators" value="${esc(st.q)}" aria-label="Search the library" oninput="libSet({lq:this.value},{keep:true})"></div>
  <div class="lactive" id="lactive"></div>
  <div class="lres" id="lres"></div>
  <div id="lfeat"></div>
  <div id="lgrid" class="lgrid"></div>
  <p class="lfoot">Use the structure. Film your own version.</p>
  </div>
  <div class="lsheet" id="lsheet" hidden></div>
  <div class="lv" id="lviewer" hidden></div>`;
});

/* state changes. keep:true re-renders only the results (typing); otherwise toolbar + results */
window.libSet=(patch,{keep=false}={})=>{ Object.assign(S.ui,patch); S.ui.lpage=1; saveUI(); if(!keep){ libToolbar(); } else { libActive(); } libRail(); libGrid(); };
window.libReset=()=>{ Object.assign(S.ui,{la:'All',ls:'All',lf:'All',lq:'',lco:false,lran:false,lsv:false,lnew:false,lsort:'mix',lct:'All',lpage:1}); saveUI(); const i=$('#lsrow input'); if(i) i.value=''; libRail(); libToolbar(); libGrid(); };
window.libView=(view)=>{ const cur=libLS().view; if(cur===view) return; S.ui.lsc=S.ui.lsc||{}; S.ui.lsc[cur]=window.scrollY; S.ui.lview=view; S.ui.lpage=1; saveUI(); libToolbar(); libGrid(); libRestoreScroll(); };
function libRestoreScroll(){ const y=(S.ui.lsc||{})[libLS().view]; if(y!=null) requestAnimationFrame(()=>window.scrollTo({top:y})); }

/* ---------- angle rail ---------- */
window.libRail=()=>{ const g=$('#lrail'); if(!g) return; const D=LIB(); const st=libLS(); const counts={}; for(const v of D.videos){ if(v.a) counts[v.a]=(counts[v.a]||0)+1; }
  const tile=([k,name,tag,col,ph])=>{ const on=st.a===k; return `<button class="ltile ${on?'on':''}" role="tab" aria-selected="${on}" style="--ac:${col}" onclick="libPickAngle('${esc(k)}')"><img src="./ph/angle-${ph}.jpg" alt="" width="640" height="400" loading="lazy" decoding="async"><span class="ltile-sh"></span><span class="ltile-tx"><b>${esc(name)}</b><small>${(counts[k]||0).toLocaleString()}</small></span>${on?`<span class="ltile-ck">${ico('check',12)}</span>`:''}</button>`; };
  g.innerHTML=`<button class="ltile all ${st.a==='All'?'on':''}" role="tab" aria-selected="${st.a==='All'}" onclick="libPickAngle('All')">${ico('grid',22)}<span class="ltile-tx"><b>All videos</b><small>${D.videos.length.toLocaleString()}</small></span>${st.a==='All'?`<span class="ltile-ck">${ico('check',12)}</span>`:''}</button>`+ANGLES.map(tile).join('');
  requestAnimationFrame(libRailArrows); g.onscroll=libRailArrows; };
window.libPickAngle=(k)=>{ const was=libLS().a; S.ui.la=(k!=='All'&&was===k)?'All':k; S.ui.lpage=1; saveUI(); libRail(); libGrid(); };
window.libRailScroll=(dir)=>{ const g=$('#lrail'); if(g) g.scrollBy({left:dir*Math.round(g.clientWidth*.8),behavior:'smooth'}); };
function libRailArrows(){ const g=$('#lrail'); if(!g) return; const l=$('.lrail-arr.l'), r=$('.lrail-arr.r'); const more=g.scrollWidth-g.clientWidth>4; if(l) l.hidden=!(more&&g.scrollLeft>4); if(r) r.hidden=!(more&&g.scrollLeft<g.scrollWidth-g.clientWidth-4); }
window.addEventListener('resize',()=>libRailArrows());

/* ---------- toolbar, active filters, sheet ---------- */
window.libToolbar=()=>{ const t=$('#ltool'); if(!t) return; const st=libLS(); const n=nFilters(st); const srow=$('#lsrow');
  t.innerHTML=`<div class="seg lseg" role="tablist" aria-label="Browse as">${VIEWS.map(([k,l])=>`<button role="tab" aria-selected="${st.view===k}" class="${st.view===k?'on':''}" onclick="libView('${k}')">${l}</button>`).join('')}</div>
   <label class="lsearch"><span class="sr">Search</span>${ico('search',16)}<input type="search" placeholder="Search hooks, closes, scripts, creators" value="${esc(st.q)}" oninput="libSet({lq:this.value},{keep:true})"></label>

   <select class="lsel" aria-label="Setting" onchange="libSet({ls:this.value})"><option value="All">Any setting</option>${SETTINGS.map(s=>`<option value="${esc(s)}" ${st.s===s?'selected':''}>${esc(plain(s))}</option>`).join('')}</select>
   <select class="lsel" aria-label="Format" onchange="libSet({lf:this.value})"><option value="All">Any format</option>${FORMATS.map(f=>`<option ${st.f===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
   <select class="lsel" aria-label="Sort" onchange="libSet({lsort:this.value})">${SORTS.map(([k,l])=>`<option value="${k}" ${st.sort===k?'selected':''}>${l}</option>`).join('')}</select>
   <button id="lfbtn" class="btn gh sm lfbtn ${n?'has':''}" onclick="libOpenSheet()" aria-haspopup="dialog">${ico('gear',14)} <span>Filters</span>${n?` <b>${n}</b>`:''}</button>`;
  const sb=$('#lsavedbtn'); if(sb) sb.setAttribute('aria-pressed',st.sv);
  libActive(); };
window.libToggleSearch=()=>{ const r=$('#lsrow'); if(!r) return; r.hidden=!r.hidden; const b=$('#ltool .lsbtn'); if(b) b.setAttribute('aria-expanded',!r.hidden); if(!r.hidden){ const i=r.querySelector('input'); i.value=libLS().q; i.focus(); } };
function libActive(){ const w=$('#lactive'); if(!w) return; const st=libLS(); const chips=[];
  const chip=(l,patch)=>chips.push(`<button class="lchip" onclick='libSet(${JSON.stringify(patch)})'>${esc(l)} ${ico('x',12)}</button>`);
  if(st.q) chip(`“${st.q.length>24?st.q.slice(0,24)+'…':st.q}”`,{lq:''});
  if(st.s!=='All') chip(plain(st.s),{ls:'All'}); if(st.f!=='All') chip(st.f,{lf:'All'});
  if(st.co) chip('Coached',{lco:false}); if(st.ran) chip('Ad tested',{lran:false}); if(st.sv) chip('Saved',{lsv:false}); if(st.nw) chip('Recently added',{lnew:false});
  if(st.view==='cta'&&st.ct!=='All') chip('Close: '+(CTA_TYPES.find(x=>x[0]===st.ct)||[])[1],{lct:'All'});
  if(st.sort!=='mix') chip((SORTS.find(x=>x[0]===st.sort)||[])[1],{lsort:'mix'});
  w.innerHTML=chips.length?chips.join('')+`<button class="lchip clear" onclick="libReset()">Clear all</button>`:''; w.hidden=!chips.length; }

let LDRAFT=null, LSHEET_FOCUS=null;
window.libOpenSheet=()=>{ const sh=$('#lsheet'); if(!sh) return; const st=libLS(); LDRAFT={s:st.s,f:st.f,sort:st.sort,co:st.co,ran:st.ran,sv:st.sv,nw:st.nw,ct:st.ct,fq:''}; LSHEET_FOCUS=document.activeElement; sh.hidden=false; document.body.style.overflow='hidden'; libSheetRender(); requestAnimationFrame(()=>{ sh.classList.add('open'); const f=sh.querySelector('.lsheet-close'); if(f) f.focus(); }); try{ history.pushState({lsheet:1},''); }catch(e){} };
function libCloseSheet(apply){ const sh=$('#lsheet'); if(!sh||sh.hidden) return; if(apply&&LDRAFT){ Object.assign(S.ui,{ls:LDRAFT.s,lf:LDRAFT.f,lsort:LDRAFT.sort,lco:LDRAFT.co,lran:LDRAFT.ran,lsv:LDRAFT.sv,lnew:LDRAFT.nw,lct:LDRAFT.ct,lpage:1}); saveUI(); }
  sh.classList.remove('open'); document.body.style.overflow=''; setTimeout(()=>{ sh.hidden=true; sh.innerHTML=''; },220); LDRAFT=null; if(history.state&&history.state.lsheet){ LIB_SKIP_POP=true; history.back(); }
  libToolbar(); libGrid(); const f=LSHEET_FOCUS||$('#lfbtn'); if(f&&f.focus) f.focus(); LSHEET_FOCUS=null; }
window.libSheetApply=()=>libCloseSheet(true); window.libSheetCancel=()=>libCloseSheet(false);
window.libDraft=(patch)=>{ Object.assign(LDRAFT,patch); libSheetRender(); };
function libSheetRender(){ const sh=$('#lsheet'); if(!sh||!LDRAFT) return; const d=LDRAFT; const st=libLS(); const n=libFilterWith({...st,s:d.s,f:d.f,co:d.co,ran:d.ran,sv:d.sv,nw:d.nw,ct:d.ct}).length; const saved=libSaved().size; const cut=recentCut(); const hasRecent=LIB().videos.some(v=>v.d&&v.d>=cut);
  const fq=d.fq.trim().toLowerCase(); const fmts=FORMATS.filter(f=>!fq||f.toLowerCase().includes(fq));
  const tog=(k,l,sub)=>`<button class="ltog" role="switch" aria-checked="${!!d[k]}" onclick="libDraft({${k}:${!d[k]}})"><span><b>${l}</b>${sub?`<small>${sub}</small>`:''}</span><i></i></button>`;
  const noun=st.view==='cta'?'closes':st.view==='list'?'hooks':'videos';
  sh.innerHTML=`<div class="lsheet-bg" onclick="libSheetCancel()"></div><div class="lsheet-panel" role="dialog" aria-modal="true" aria-label="Filters">
   <header><b>Filters</b><button class="lsheet-close licon" aria-label="Close" onclick="libSheetCancel()">${ico('x',18)}</button></header>
   <div class="lsheet-body">
    <section class="mob-only"><h4>Setting</h4><div class="lopts">${['All',...SETTINGS].map(s=>`<button class="lopt ${d.s===s?'on':''}" aria-pressed="${d.s===s}" onclick="libDraft({s:'${esc(s)}'})">${s==='All'?'Any':esc(plain(s))}</button>`).join('')}</div></section>
    <section class="mob-only"><h4>Format</h4><input type="search" class="lfq" placeholder="Find a format" value="${esc(d.fq)}" oninput="LDRAFT.fq=this.value;libSheetRender();const i=document.querySelector('#lsheet .lfq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"><div class="lopts">${(fq?[]:['All']).concat(fmts).map(f=>`<button class="lopt ${d.f===f?'on':''}" aria-pressed="${d.f===f}" onclick="libDraft({f:'${esc(f)}'})">${f==='All'?'Any':esc(f)}</button>`).join('')||'<span class="mini">No format matches.</span>'}</div></section>
    <section class="mob-only"><h4>Sort</h4><div class="lopts col">${SORTS.map(([k,l])=>`<button class="lopt ${d.sort===k?'on':''}" role="radio" aria-checked="${d.sort===k}" onclick="libDraft({sort:'${k}'})">${l}</button>`).join('')}</div></section>
    ${st.view==='cta'?`<section><h4>Type of close</h4><div class="lopts">${[['All','Any'],...CTA_TYPES].map(([k,l])=>`<button class="lopt ${d.ct===k?'on':''}" aria-pressed="${d.ct===k}" onclick="libDraft({ct:'${k}'})">${l}</button>`).join('')}</div></section>`:''}
    <section><h4>Show only</h4>${tog('co','Coached','Hand-reviewed, with coach notes')}${tog('ran','Ad tested','$50 or more in ad spend')}${tog('sv',`Saved${saved?` (${saved})`:''}`,'Saved on this device')}${hasRecent?tog('nw','Recently added',`Approved in the last ${RECENT_DAYS} days. New approvals may have no ad history yet.`):''}</section>
   </div>
   <footer><button class="btn gh" onclick="libDraft({s:'All',f:'All',sort:'mix',co:false,ran:false,sv:false,nw:false,ct:'All'})">Reset</button><button class="btn" onclick="libSheetApply()">Show ${n.toLocaleString()} ${noun}</button></footer></div>`; }
let LIB_SKIP_POP=false;
window.addEventListener('popstate',()=>{ if(LIB_SKIP_POP){ LIB_SKIP_POP=false; return; } const sh=$('#lsheet'); if(sh&&!sh.hidden){ LDRAFT=null; sh.classList.remove('open'); sh.hidden=true; sh.innerHTML=''; document.body.style.overflow=''; } const lv=$('#lviewer'); if(lv&&!lv.hidden) closeLibVideo(true); });

/* ---------- results ---------- */
function metricPair(v,sort){ const na=v.sp==null||(v.sp<1&&v.hr==null&&v.ctr==null);
  if(na) return `<span class="lc-m na">No ad data yet</span>`;
  const right=sort==='watch'?['Avg watch',v.ws!=null?`${secs(v.ws)}${v.wp!=null?` <i>· ${Math.round(v.wp)}%</i>`:''}`:'—']:sort==='ctr'?['Video CTR',pct1(v.ctr)]:['3s hook rate',pct1(v.hr)];
  return `<span class="lc-m"><span><small>Ad spend</small><b>${lmoney(v.sp)}</b></span><span><small>${right[0]}</small><b>${right[1]}</b></span></span>`; }
function libCard(v,sort){ const a=angleOf(v.a); const saved=libSaved().has(v.id);
  return `<article class="lc ${v.co?'coached':''}"><button class="lc-main" onclick="openLibVideo('${v.id}',this)" aria-label="${esc(v.h||v.t)}">
    <span class="lc-th"><img src="${esc(v.th||'')}" alt="" width="270" height="480" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">${v.co?`<span class="lc-coached">Coached</span>`:''}${v.sec?`<span class="lc-dur">${dur(v.sec)}</span>`:''}<span class="lc-play">${ico('play',12)} Play opening</span></span>
    <span class="lc-b"><span class="lc-ang" style="--ac:${a?a[3]:'#848C99'}"><i></i>${a?esc(a[1]):'Not tagged yet'}</span><span class="lc-hook">${esc(v.h||v.w||v.t)}</span><span class="lc-who">${esc(v.c)}${v.s?` · ${esc(plain(v.s))}`:''}${v.cl?` · <em class="lc-claim">Claims note</em>`:''}</span>${metricPair(v,sort)}</span></button>
    <button class="lc-save ${saved?'on':''}" data-save="${v.id}" aria-pressed="${saved}" aria-label="${saved?'Remove from saved':'Save'}" onclick="libToggleSaved('${v.id}',event)">${ico('star',16)}</button></article>`; }
function libRow(v,kind){ const a=angleOf(v.a); const saved=libSaved().has(v.id); const q=kind==='cta'?v.ct:(v.h||v.w||v.t);
  const m1=kind==='cta'?[pct1(v.ctr),'Video CTR']:[pct1(v.hr),'3s hook rate']; const types=kind==='cta'?(v.cty||[]).map(t=>(CTA_TYPES.find(x=>x[0]===t)||[])[1]).filter(Boolean):[];
  return `<article class="lrow"><button class="lrow-main" onclick="openLibVideo('${v.id}',this)" aria-label="Open ${esc(v.c)}"><span class="lrow-th"><img src="${esc(v.th||'')}" alt="" width="45" height="80" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'"></span></button>
    <div class="lrow-b"><p class="lq" onclick="this.classList.toggle('open')">“${esc(q)}”</p><div class="lrow-meta"><span>${esc(v.c)}</span>${a?`<span style="--ac:${a[3]}"><i></i>${esc(a[1])}</span>`:''}${(v.f||[]).slice(0,1).map(f=>`<span>${esc(f)}</span>`).join('')}${types.slice(0,2).map(t=>`<span>${esc(t)}</span>`).join('')}${v.co?`<span class="gold">Coached</span>`:''}${v.cl?`<span class="warn">Claims note</span>`:''}</div>

    <div class="lrow-m"><div><b>${m1[0]}</b><small>${m1[1]}</small></div><div><b>${lmoney(v.sp)}</b><small>Ad spend</small></div></div></article>`; }
window.libCopy=async(btn,text)=>{ try{ await navigator.clipboard.writeText(text); }catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e2){} t.remove(); }
  const was=btn.innerHTML; btn.innerHTML=`${ico('check',13)} Copied`; btn.disabled=true; toast('Copied'); setTimeout(()=>{ btn.innerHTML=was; btn.disabled=false; },1500); };

function libFeatured(st,L){ const w=$('#lfeat'); if(!w) return []; w.innerHTML='';
  const discovery=st.view==='grid'&&!st.q&&st.sort==='mix'&&!st.co&&!st.ran&&!st.sv&&!st.nw&&st.s==='All'&&st.f==='All';
  if(!discovery) return [];
  const distinct=(arr,n)=>{ const out=[],seen=new Set(); for(const v of arr){ if(seen.has(v.c)) continue; seen.add(v.c); out.push(v); if(out.length>=n) break; } return out; };
  if(st.a==='All'){ const picks=distinct(L.filter(v=>v.co&&v.cn),6); if(picks.length<3) return [];
    w.innerHTML=`<section class="lfeat"><div class="lfeat-h"><h2>Coached examples</h2><span class="mini">Reviewed by hand, with notes on what they went for.</span></div><div class="lgrid feat">${picks.map(v=>libCard(v,'mix')).join('')}</div></section>`; return picks.map(v=>v.id); }
  const a=angleOf(st.a); const picks=distinct(L.filter(v=>v.sp>=50&&v.hr!=null&&v.h).sort((x,y)=>y.hr-x.hr),3); if(picks.length<2) return [];
  w.innerHTML=`<section class="lfeat"><div class="lfeat-h"><h2>Study the opening</h2><span class="mini">The first three seconds that held ${a?esc(a[1]):'this angle'}'s audience best.</span></div><div class="lgrid feat three">${picks.map(v=>libCard(v,'hook')).join('')}</div></section>`; return picks.map(v=>v.id); }

window.libGrid=(more)=>{ const st=libLS(); const all=libList(); if(more) S.ui.lpage=(S.ui.lpage||1)+1; const n=48*(S.ui.lpage||1); const g=$('#lgrid'); if(!g) return;
  const featured=more?(g.dataset.feat||'').split(',').filter(Boolean):libFeatured(st,all); if(!more) g.dataset.feat=featured.join(','); const fs=new Set(featured); const L=fs.size?all.filter(v=>!fs.has(v.id)):all;
  const noun=st.view==='cta'?'close':st.view==='list'?'hook':'video'; const a=angleOf(st.a);
  const rh=$('#lres'); if(rh&&!more){ rh.classList.toggle('all',!a&&st.view==='grid'&&!st.q); } if(rh&&!more) rh.innerHTML=`<div><h2>${a?esc(a[1]):'All videos'}</h2><span class="lcount" id="lcount">${all.length.toLocaleString()} ${noun}${all.length===1?'':'s'}</span></div>${a?`<details class="labout"><summary>About this angle</summary><p>${esc(a[2])}</p></details>`:''}`;
  if(!L.length){ g.className='lgrid empty'; g.innerHTML=emptyState('Nothing matches','Loosen a filter or clear the search.',`<button class="btn gh" onclick="libReset()">Clear filters</button>`,'video'); return; }
  g.className=st.view==='grid'?'lgrid':'lrows';
  const render=st.view==='grid'?(v=>libCard(v,st.sort)):(v=>libRow(v,st.view==='cta'?'cta':'hook'));
  g.innerHTML=L.slice(0,n).map(render).join('')+(L.length>n?`<div class="lmore"><button class="btn gh" onclick="libGrid(true)">Show more <span class="mini">(${(L.length-n).toLocaleString()} left)</span></button></div>`:''); };

/* ---- Faster reviews (Austin, Oct 24): oldest first, filter by quest type, one-tap approve that clears the entry in place,
   reusable notes, keyboard shortcuts. Every decision still goes through approve_quest / return_quest / reject_quest. ---- */
const aqLeft=()=>(window.__AQ?.Q||[]).filter(q=>!q._done);
function aqHead(){ const L=aqLeft(); const xp=L.reduce((n,q)=>n+(q.requested_xp||0),0); return `${L.length} quest entr${L.length===1?'y':'ies'} waiting${L.length?` · +${xp} XP requested · oldest first`:''}. Approve awards XP once; the database enforces caps and duplicates.`; }
function aqTabs(){ const {CAT}=window.__AQ; const L=aqLeft(); const cats=[...new Set(L.map(q=>CAT[q.quest_key]||'Other'))]; const keys=['All',...['Film','Improve','Community','Academy','Boss','Other'].filter(k=>cats.includes(k))];
  return keys.map(k=>{ const n=k==='All'?L.length:L.filter(q=>(CAT[q.quest_key]||'Other')===k).length; const on=S.ui.aqf===k; return `<button role="tab" aria-selected="${on}" class="${on?'on':''}" onclick="S.ui.aqf='${k}';saveUI();aqRefresh()">${esc(k==='Academy'?'Academy':k)}<i>${n}</i></button>`; }).join(''); }
function aqList(){ const {LBL,CAT}=window.__AQ; const L=aqLeft().filter(q=>S.ui.aqf==='All'||(CAT[q.quest_key]||'Other')===S.ui.aqf);
  if(!L.length) return emptyState('Nothing here','No entries of this type are waiting.','','review');
  return L.map(q=>`<div class="card aq" id="aq_${q.id}" tabindex="0" data-id="${q.id}" onfocus="aqFocus('${q.id}')"><div class="admin-row"><div><div class="row"><b>${esc(q.display_name)}</b><span class="mini">· ${esc(q.title)} · ${PERIOD_LABEL(q.period_key)} · entry ${q.seq}</span>${q.duplicate_registration?badge('v','Duplicate registration'):''}${q.same_evidence_elsewhere?badge('x','Same evidence as another creator'):''}</div>
     <div class="mini" style="margin-top:4px">Submitted ${fmt.dt(q.submitted_at)||'—'} (${esc(fmt.ago(q.submitted_at)||'')}) · requests +${q.requested_xp} XP · ${q.done_in_period}/${q.per_period_limit} already awarded this period</div>
     <div class="proofv" style="margin-top:8px;font-size:13.5px">${Object.entries(q.draft||{}).map(([k,v])=>`<div><b>${esc(LBL[q.quest_key+':'+k]||k)}:</b> ${proofValueHtml(v)}</div>`).join('')}</div></div>
     <div class="stack aq-acts"><button class="btn sm" onclick="aqApprove('${q.id}')">${ico('check',14)} Approve +${q.requested_xp} XP</button><button class="btn gh sm" onclick="adminNote('return_quest','${q.id}')">Request changes</button><button class="btn danger sm" onclick="adminNote('reject_quest','${q.id}')">Reject</button></div></div></div>`).join(''); }
function aqRefresh(){ const h=$('#aq_head'); if(h) h.innerHTML=aqHead(); const t=$('#aq_tabs'); if(t) t.innerHTML=aqTabs(); const l=$('#aq_list'); if(l) l.innerHTML=aqLeft().length?aqList():emptyState('Queue is empty','Nothing is waiting for review.','','review'); }
let AQ_FOCUS=null; window.aqFocus=id=>{ AQ_FOCUS=id; };
function aqDone(id,html){ const q=(window.__AQ?.Q||[]).find(x=>x.id===id); if(q) q._done=true; const el=$('#aq_'+id); API.bust();

    <div class="mini" style="margin-top:6px">Hitting the top tier of a level unlocks the next. Creators pick their level at each reset (first 3 days of a half, until they claim). Sales = Trybe sales in that half from videos not marked BOF.</div>
    <div class="sec"><h2>Who has prestige</h2><span class="mini">${who.length} creator${who.length===1?'':'s'} unlocked a level</span></div>
    <div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Creator</th><th>Highest unlocked</th><th>Playing now</th><th>Picked for next half</th></tr></thead><tbody>${who.map(w=>`<tr><td><b>${esc(w.display_name)}</b></td><td>${nm(w.unlocked)}</td><td>${nm(w.level_now)}</td><td>${w.next_pick!=null?nm(w.next_pick):'<span class="muted">same as now</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="mini">Nobody has unlocked Prestige I yet. It unlocks when a creator hits the top Rookie tier in a half.</td></tr>'}</tbody></table></div></div>`; })()}
  <div class="sec"><h2>Claims</h2><span class="mini">Approve, then mark paid once it goes out</span></div><div class="card pad0"><div class="tblwrap"><table class="tbl"><thead><tr><th>Creator</th><th>Tier</th><th class="num">Amount</th><th>State</th><th>Requested</th><th></th></tr></thead><tbody>${(A.claims||[]).map(c=>`<tr><td>${esc(c.display_name)}</td><td>${esc(c.milestone)}</td><td class="num">${fmt.usd(c.amount_cents,{cents:true})}</td><td>${badge(CL[c.state]||'n',c.state.replace(/_/g,' '))}${c.payment_ref?`<div class="mini">${esc(c.payment_ref)}</div>`:''}</td><td class="mono">${fmt.dt(c.requested_at)}</td>
    <td>${c.state==='claim_requested'?`<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" onclick="claimAct('${c.id}','approve')">Approve</button><button class="btn danger sm" onclick="claimAsk('${c.id}','reject')">Reject</button></div>`:c.state==='approved_for_payment'?`<button class="btn sm" onclick="claimAsk('${c.id}','paid')">Mark paid</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mini">No claims yet. Creators claim from Rewards once both bars are full.</td></tr>'}</tbody></table></div></div>
  <div class="sec"><h2>Exposure</h2></div><div class="card"><p style="font-size:14px">No stacking: at most ${fmt.usd(top.cash_total_cents,{cents:true})} per creator per half at Rookie, ${fmt.usd(top.cash_total_cents*2,{cents:true})} per month.${(()=>{ const mx=Math.max(0,...ALLM.map(m=>m.cash_total_cents||0)); return mx>top.cash_total_cents?` From Oct 16, a Prestige Master creator can earn up to ${fmt.usd(mx,{cents:true})} in a half, gated by Trybe sales.`:''; })()} ${on} creators on the roster → at most ${fmt.usd(on*top.cash_total_cents/100*2)} in reward payouts this month if every single one hit Elite in both halves, plus the separate $25,000 GMV incentive.</p></div>`; });
function claimAsk(id,action){ const paid=action==='paid'; openDrawer(`<h2>${paid?'Mark claim paid':'Reject claim'}</h2><div class="field"><label for="cnote">${paid?'Payment reference':'Reason (the creator sees this)'}</label>${paid?`<input id="cnote" value="Paid through Trybe">`:`<textarea id="cnote"></textarea>`}</div>
  <div class="row" style="margin-top:12px"><button class="btn ${paid?'':'danger'}" onclick="(async()=>{const n=$('#cnote').value.trim(); if(!n){toast('Required','bad');return;} closeDrawer(true); await claimAct('${id}','${action}',n);})()">${paid?'Mark paid':'Reject'}</button><button class="btn gh" onclick="closeDrawer()">Cancel</button></div>`); }
async function claimAct(id,action,txt){ try{ const r=await API.rpc('decide_claim',{p_claim:id,p_action:action,p_note:action==='reject'?txt:null,p_payment_ref:action==='paid'?txt:null}); toast(r.why||r.state,r.ok?'good':'bad'); API.bust(); render(); }catch(e){ toast(e.message,'bad'); } }
</script>
</body>
</html>
