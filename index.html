<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ravine Creator Games</title>
<link rel="icon" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#07080A">
<style>/* Ravine Creator Games · October build · design tokens from the live app, extended */
@font-face{font-family:'BC';font-weight:600;font-style:normal;font-display:swap;src:url('./fonts/bc-600.woff2') format('woff2')}
@font-face{font-family:'BC';font-weight:700;font-style:normal;font-display:swap;src:url('./fonts/bc-700.woff2') format('woff2')}
@font-face{font-family:'BC';font-weight:800;font-style:normal;font-display:swap;src:url('./fonts/bc-800.woff2') format('woff2')}
:root{
  --bg:#07080A;--bg2:#0B0D11;--sf:#111419;--sf2:#161A21;--sf3:#1D222B;
  --ln:rgba(255,255,255,.085);--ln2:rgba(255,255,255,.14);
  --tx:#EDEFF2;--tx2:#B4BAC5;--tx3:#848C99;--tx4:#5A6270;
  --o:#FF6E20;--o2:#FFA25C;--o-ink:#1A0A00;--o-soft:rgba(255,110,32,.14);
  --gold:#E8B64A;--gold-soft:rgba(232,182,74,.14);
  --gr:#3DDC84;--gr-soft:rgba(61,220,132,.14);--bl:#5B9DFF;--bl-soft:rgba(91,157,255,.14);
  --warn:#FFB020;--warn-soft:rgba(255,176,32,.16);--bad:#FF5C4D;--bad-soft:rgba(255,92,77,.14);
  --r:18px;--r2:12px;--r3:8px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --disp:'BC',var(--f);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,1,.36,1);
  --sb:248px;--gut:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:var(--o2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r3);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--o);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
img{max-width:100%;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);letter-spacing:.2px}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.1;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
p{color:var(--tx2)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shell */
.shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--ln);background:var(--bg2);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-family:var(--disp);font-size:18px;letter-spacing:.3px}
.brand small{display:block;color:var(--tx3);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.ngrp{margin-top:8px}
.nlbl{font-size:11px;letter-spacing:1.6px;color:var(--tx4);font-weight:700;padding:6px 10px 4px}
.nitm{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:var(--tx2);font-weight:600;font-size:14px;text-align:left}
.nitm:hover{background:var(--sf);color:var(--tx)}
.nitm.on{background:var(--o-soft);color:var(--o2)}
.nitm svg{width:18px;height:18px;flex:none}
.nitm .pip{margin-left:auto;background:var(--o);color:var(--o-ink);font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;font-family:var(--mono)}
.main{min-width:0;padding:24px clamp(16px,3vw,40px) 90px}
.who{margin-top:auto;padding:12px 10px;border-top:1px solid var(--ln);font-size:13px;color:var(--tx3)}
.who b{display:block;color:var(--tx);font-size:14px}
.mobbar,.mobtop{display:none}
.mode{position:fixed;top:10px;right:12px;z-index:60;background:var(--sf2);border:1px solid var(--ln2);color:var(--tx2);font-size:12px;padding:6px 10px;border-radius:99px;box-shadow:var(--sh);font-family:var(--mono)}
.mode.fx{border-color:var(--warn);color:var(--warn)}
.mode:not(.fx){display:none}
@media (max-width:900px){
  :root{--gut:16px}
  .mode{top:auto;bottom:78px;right:8px;font-size:11px}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobtop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;background:rgba(7,8,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px var(--gut)}
  .mobtop .brand{padding:0}.mobtop .brand b{font-size:16px}
  .mobtop button.menu{padding:8px 10px;border:1px solid var(--ln2);border-radius:10px;color:var(--tx2);font-weight:600;font-size:13px}
  .main{padding:16px var(--gut) 96px}
  .mobbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,13,17,.96);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--tx3);padding:6px 2px;border-radius:10px}
  .mobbar button svg{width:20px;height:20px}
  .mobbar button.on{color:var(--o2)}
  .mode{bottom:78px}
  .sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none}
  .sheet.open{display:block}
  .sheet .inner{position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--bg2);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--ln2)}
}
@media (min-width:901px){.sheet{display:none}}

/* ---- page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--o2);font-weight:700;margin-bottom:6px}
.ph p{margin-top:6px;max-width:640px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---- surfaces */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card.hi{border-color:rgba(255,110,32,.4);background:linear-gradient(180deg,rgba(255,110,32,.07),transparent 60%),var(--sf)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gauto{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2{font-size:19px}
.sec .mini{color:var(--tx3)}
.mini{font-size:13px;color:var(--tx3)}
.small{font-size:13px;color:var(--tx2)}
.muted{color:var(--tx3)}
.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-weight:700}
.hr{height:1px;background:var(--ln);margin:14px 0}
.divider{border-top:1px solid var(--ln);margin:14px 0}

/* ---- metric cards */
.metric{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:14px 16px;min-width:0}
.metric .k{font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.3px}
.metric .v{font-family:var(--disp);font-size:28px;font-weight:800;margin-top:4px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.metric .v.na{color:var(--tx4);font-size:18px;font-family:var(--f);font-weight:600}
.metric .sub{font-size:12px;color:var(--tx3);margin-top:3px}
.metric.gold .v{color:var(--gold)}.metric.orange .v{color:var(--o2)}.metric.green .v{color:var(--gr)}

/* ---- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--o);color:var(--o-ink);border:1px solid transparent;min-height:40px;transition:transform .12s var(--ease),filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.07);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.gh{background:transparent;color:var(--tx);border-color:var(--ln2)}
.btn.gh:hover{background:var(--sf2)}
.btn.soft{background:var(--o-soft);color:var(--o2)}
.btn.sm{padding:7px 12px;min-height:32px;font-size:13px;border-radius:9px}
.btn.gold{background:var(--gold);color:#241A05}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled],.btn.pending{opacity:.55;cursor:not-allowed;filter:none}
.btn.pending::after{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn svg{width:16px;height:16px}
.link{color:var(--o2);font-weight:600}

/* ---- badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.2px;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.n{background:var(--sf3);color:var(--tx2)}         /* neutral / available */
.badge.p{background:var(--bl-soft);color:var(--bl)}      /* in progress */
.badge.r{background:var(--warn-soft);color:var(--warn)}  /* in review / pending */
.badge.g{background:var(--gr-soft);color:var(--gr)}      /* approved / eligible */
.badge.c{background:var(--o-soft);color:var(--o2)}       /* changes needed */
.badge.x{background:var(--bad-soft);color:var(--bad)}    /* rejected / excluded */
.badge.d{background:var(--gold-soft);color:var(--gold)}  /* draft / gold */
.badge.v{background:var(--sf3);color:var(--tx3);border-color:var(--ln2);border-style:dashed}  /* verification needed */
.badge.noicon::before{display:none}
.xp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:13px}

/* ---- progress */
.bar{height:8px;background:var(--sf3);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--o);border-radius:99px;transition:width .5s var(--ease)}
.bar.gold i{background:var(--gold)}.bar.green i{background:var(--gr)}.bar.blue i{background:var(--bl)}
.bar .tick{position:absolute;top:-3px;width:2px;height:14px;background:var(--tx2)}
.plabel{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-bottom:5px;font-weight:600}
.plabel b{color:var(--tx)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:6px;border-radius:99px;background:var(--sf3)}.steps i.on{background:var(--o)}.steps i.pend{background:var(--warn)}

/* ---- quest cards */
.qcard{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s var(--ease);cursor:pointer;text-align:left;width:100%;color:inherit}
.qcard:hover{border-color:var(--ln2);transform:translateY(-1px)}
.qcard:focus-visible{outline:2px solid var(--o)}
.qcard .art{width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--sf3);flex:none}
.qcard .art svg{width:100%;height:100%}
.qcard .ttl{font-family:var(--disp);font-size:18px;font-weight:700;line-height:1.15}
.qcard .out{color:var(--tx2);font-size:13.5px;margin-top:3px;line-height:1.45}
.qcard .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.qcard .foot .btn{margin-left:auto}
.qcard.done{opacity:.85}
.qcard .prog{margin-top:10px}
@media (max-width:640px){.qcard{grid-template-columns:72px 1fr}.qcard .art{width:72px;height:72px}.qcard .foot .btn{margin-left:0;width:100%}}
.featured{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center}
@media (max-width:800px){.featured{grid-template-columns:1fr}}
.featured .art{border-radius:14px;overflow:hidden;background:var(--sf3);aspect-ratio:16/7;max-height:220px}
.featured .art svg{width:100%;height:100%}

/* ---- filters / tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--tx2);font-weight:600;font-size:13px;background:var(--sf)}
.tabs button.on{background:var(--o-soft);color:var(--o2);border-color:rgba(255,110,32,.4)}
.tabs button i{font-style:normal;font-family:var(--mono);color:var(--tx3);margin-left:5px;font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.filters input[type=search]{max-width:280px}
.filters select{width:auto}

/* ---- drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg2);border-left:1px solid var(--ln2);z-index:81;transform:translateX(100%);transition:transform .28s var(--ease);overflow:auto;padding:20px 22px 40px;box-shadow:var(--sh)}
.drawer.open{transform:none}
.drawer .close{position:sticky;top:0;float:right;z-index:2;background:var(--sf2);border:1px solid var(--ln2);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;color:var(--tx2)}
.drawer h2{margin-top:6px;padding-right:48px}
.drawer .art{aspect-ratio:16/7;max-height:200px;border-radius:14px;overflow:hidden;background:var(--sf3);margin:14px 0}
.drawer .art svg,.drawer .art img{width:100%;height:100%;object-fit:cover}
.drawer section{margin-top:18px}
.drawer section h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-family:var(--f);margin-bottom:8px}
.drawer ol,.drawer ul{padding-left:20px;color:var(--tx2);font-size:14px;display:grid;gap:5px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer;color:var(--tx2);font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--o)}
.chk.on{color:var(--tx)}
.field{margin-top:12px}.field label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.field .help{font-size:12px;color:var(--tx3);margin-top:4px}
.field.err input,.field.err textarea{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12px;margin-top:4px;font-weight:600}
.note{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:12px 14px;font-size:13.5px;color:var(--tx2)}
.note.warn{border-color:rgba(255,176,32,.4);background:var(--warn-soft);color:var(--tx)}
.note.good{border-color:rgba(61,220,132,.35);background:var(--gr-soft);color:var(--tx)}
.note.bad{border-color:rgba(255,92,77,.4);background:var(--bad-soft);color:var(--tx)}
.note.draft{border-color:rgba(232,182,74,.4);background:var(--gold-soft);color:var(--tx)}
.timeline{display:grid;gap:8px;font-size:13px}
.timeline div{display:grid;grid-template-columns:150px 1fr;gap:10px;color:var(--tx2)}
.timeline time{color:var(--tx3);font-family:var(--mono);font-size:12px}

/* ---- toast / xp pop */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--sf2);border:1px solid var(--ln2);padding:10px 16px;border-radius:12px;z-index:100;opacity:0;transition:all .25s var(--ease);box-shadow:var(--sh);font-weight:600;font-size:14px;max-width:min(92vw,520px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:var(--gr)}.toast.bad{border-color:var(--bad)}
.xppop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:54px;font-weight:800;color:var(--gold);z-index:101;pointer-events:none;animation:pop 1.2s var(--ease) forwards;text-shadow:0 6px 30px rgba(232,182,74,.5)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@media (max-width:900px){.toast{bottom:84px}}

/* ---- skeleton / empty / error */
.sk{background:linear-gradient(90deg,var(--sf) 25%,var(--sf3) 50%,var(--sf) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px;min-height:16px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--ln2);border-radius:var(--r);color:var(--tx2)}
.empty h3{color:var(--tx);margin-bottom:6px}
.empty .ill{width:84px;height:84px;margin:0 auto 12px;opacity:.9}
.state{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--tx3)}
.state .dot{width:8px;height:8px;border-radius:50%;background:var(--gr)}
.state.stale .dot{background:var(--warn)}.state.err .dot{background:var(--bad)}

/* ---- tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);padding:8px 10px;border-bottom:1px solid var(--ln);font-weight:700}
.tbl td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
.tbl tr.me td{background:var(--o-soft)}
.tbl td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tblwrap{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---- 20-slot board */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.slot{position:relative;aspect-ratio:4/5;border-radius:12px;border:1px solid var(--ln);background:var(--sf);overflow:hidden;text-align:left;padding:0;color:inherit;transition:border-color .15s,transform .15s var(--ease)}
.slot:hover{border-color:var(--ln2);transform:translateY(-1px)}
.slot .n{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:12px;font-weight:800;background:rgba(0,0,0,.55);color:var(--tx);padding:2px 7px;border-radius:99px;z-index:2}
.slot .th{position:absolute;inset:0;background:var(--sf3)}
.slot .th img{width:100%;height:100%;object-fit:cover}
.slot .th svg{width:100%;height:100%}
.slot .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 9px 9px;background:linear-gradient(transparent,rgba(0,0,0,.88) 60%);font-size:12px;line-height:1.3}
.slot .cap b{display:block;color:var(--tx);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.slot.empty{border-style:dashed;background:var(--bg2)}
.slot.empty .cap{background:none;color:var(--tx4);font-weight:600}
.slot.q{border-color:rgba(61,220,132,.5)}.slot.r{border-color:rgba(255,176,32,.5)}.slot.x{border-color:rgba(255,92,77,.45)}.slot.v{border-color:rgba(255,255,255,.25);border-style:dashed}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.podium{grid-template-columns:1fr}}
.podium .p{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:16px;text-align:center}

/* ---- rewards */
.plad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1180px){.plad{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.plad{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{position:relative;text-align:left;border:1px solid var(--ln);border-radius:var(--r);padding:14px;background:var(--sf);color:inherit;cursor:pointer;font:inherit;width:100%;transition:border-color .15s,transform .15s var(--ease)}
.pcard:hover{border-color:var(--ln2);transform:translateY(-1px)}
.pcard.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pcard.lock{opacity:.75}
.pcard .em{font-size:30px;line-height:1}
.pcard .pn{font-weight:800;margin-top:8px}
.pcard .pp{font-family:var(--mono);color:var(--gold);font-weight:700;margin-top:4px;font-size:13px}
.pcard .pr{font-size:12px;color:var(--tx3);margin-top:8px;line-height:1.45}
.pcard .tag{position:absolute;top:10px;right:10px}
.pstat .em{font-size:44px;line-height:1}
.pstat .pnow{font-family:var(--disp);font-size:26px;font-weight:800}
.pstat .pnext{margin-left:auto;text-align:right}
.qcard.lock{opacity:.6;filter:grayscale(1)}
.qcard.lock:hover{opacity:.8}
.rcard{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;width:100%;color:inherit;display:flex;flex-direction:column}

.rcard .art svg{width:100%;height:100%}
.rcard .body{padding:16px}

.rcard.lock .amt{color:var(--tx2)}
.rcard .req{display:grid;gap:10px;margin-top:12px}

/* ---- video cards */
.vcard{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;cursor:pointer;text-align:left;width:100%;color:inherit;display:flex;flex-direction:column}
.vcard .th{aspect-ratio:16/9;background:var(--sf3);position:relative}
.vcard .th img{width:100%;height:100%;object-fit:cover}
.vcard .th svg{width:100%;height:100%}
.vcard .th .tag{position:absolute;top:8px;left:8px}
.vcard .body{padding:12px 14px}
.vcard .ttl{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .meta{font-size:12px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.vcard .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--tx3)}
.vcard .kv .muted{font-family:var(--f);font-weight:500;font-size:11.5px}
.vcard .kv b{color:var(--tx);font-family:var(--mono);font-weight:600}
.icard .body .hook{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sf3);color:var(--tx2)}
.chip.o{background:var(--o-soft);color:var(--o2)}

/* ---- charts */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--sf2);border:1px solid var(--ln2);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---- misc */
.kpi{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.kpi .big{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1}
.ol{counter-reset:s;display:grid;gap:8px;list-style:none}
.ol li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:var(--tx2);font-size:14px}
.ol li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--o-soft);color:var(--o2);display:grid;place-items:center;font-weight:800;font-size:12px}
details.rules summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--tx)}
.anim{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.login{max-width:420px;margin:12vh auto;padding:0 var(--gut)}
.login .card{padding:26px}
kbd{font-family:var(--mono);background:var(--sf3);padding:1px 6px;border-radius:5px;font-size:12px}
.admin-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--ln)}
@media (max-width:640px){.admin-row{grid-template-columns:1fr}}

/* ---- analytics (September layout, refreshed) */
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.g5{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.rtoggle{display:inline-flex;background:var(--sf);border:1px solid var(--ln2);border-radius:99px;padding:3px;gap:2px}

.rtoggle button.on{background:var(--o);color:var(--o-ink)}
.ahero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--ln);padding:22px 22px 18px;
  background:radial-gradient(120% 160% at 100% 0%,rgba(255,110,32,.17),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--sf)}

.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.st{background:rgba(0,0,0,.22);border:1px solid var(--ln);border-radius:var(--r2);padding:12px 14px;min-width:0}

.brow{display:grid;grid-template-columns:24px 48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 10px;border-radius:var(--r2);width:100%;text-align:left;color:inherit;transition:background .15s}
.brow+.brow{border-top:1px solid var(--ln);border-top-left-radius:0;border-top-right-radius:0}
.brow:hover{background:var(--sf2)}
.brow .rn{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--tx4);text-align:center}
.vthumb{width:48px;height:64px;border-radius:9px;overflow:hidden;background:var(--sf3);border:1px solid var(--ln)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;border:1px solid var(--ln2);background:var(--sf2);color:var(--tx3);font-family:var(--mono);white-space:nowrap}

.bmeta b{color:var(--tx);font-family:var(--mono);font-weight:700}
.bbar{height:4px;background:var(--sf3);border-radius:99px;margin-top:7px;overflow:hidden}
.bbar i{display:block;height:100%;border-radius:99px}
.bright{text-align:right}
.bright .rx{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--tx)}
.chartwrap{position:relative;max-width:680px;margin:0 auto}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .cdot{cursor:pointer;transition:opacity .15s}
.ctip{position:absolute;pointer-events:none;z-index:8;opacity:0;transform:translate(-50%,-112%);transition:opacity .12s;background:var(--sf2);border:1px solid var(--ln2);border-radius:10px;padding:9px 11px;min-width:170px;box-shadow:var(--sh)}

.clg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}
.clg span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx3)}
.clg i{width:9px;height:9px;border-radius:50%;display:block}
.vplay{border-radius:14px;overflow:hidden;background:#000;margin:14px 0;display:flex;justify-content:center}

  .stat3{gap:8px}.st{padding:10px}.st .v{font-size:19px}.st .k{font-size:9.5px;letter-spacing:.8px}

  .brow{grid-template-columns:20px 42px minmax(0,1fr);gap:10px}
  .brow .bright{grid-column:3;text-align:left;display:flex;gap:6px;align-items:baseline}
  .vthumb{width:42px;height:56px}
}

/* ---- October leaderboard / incentive */
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:800;color:#fff;flex:none;font-family:var(--f);letter-spacing:-.2px;
  box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lbhero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border-radius:var(--r);padding:24px 26px;
  border:1px solid rgba(232,182,74,.32);background:radial-gradient(90% 140% at 0% 0%,rgba(232,182,74,.18),transparent 60%),radial-gradient(80% 120% at 100% 100%,rgba(255,110,32,.16),transparent 60%),var(--sf)}

.lbh-pz span{font-size:12px;color:var(--tx3);font-weight:700}.lbh-pz b{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--tx)}

.cd span{font-size:9.5px;letter-spacing:1.3px;font-weight:800;color:var(--tx3);margin-top:4px;display:block}
.lbme{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:0;margin:16px 0 4px;border-radius:var(--r);border:1px solid rgba(255,110,32,.35);background:linear-gradient(110deg,rgba(255,110,32,.12),transparent 60%),var(--sf);overflow:hidden}
.lbme>div{padding:18px 22px}.lbme>div+div{border-left:1px solid var(--ln)}

.lbme-gmv{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1;margin-top:8px;color:var(--gold)}
.lbme-next{font-size:18px;font-weight:700;margin-top:8px}.lbme-next b{font-family:var(--disp);font-size:30px;color:var(--tx)}
.podium2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pc2{position:relative;text-align:center;padding:22px 12px 18px;border-radius:var(--r);border:1px solid var(--ln);background:var(--sf);transition:transform .2s var(--ease)}
.pc2:hover{transform:translateY(-3px)}
.pc2.p1{padding-top:34px;padding-bottom:24px;border-color:rgba(232,182,74,.45);background:linear-gradient(170deg,rgba(232,182,74,.16),var(--sf) 70%);box-shadow:0 14px 44px rgba(232,182,74,.12)}
.pc2.p2{border-color:rgba(200,210,225,.28)}.pc2.p3{border-color:rgba(205,127,50,.32)}
.pc2.me{box-shadow:inset 0 0 0 1px rgba(255,110,32,.5)}
.pc2 .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:24px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.pc2 .n{font-weight:700;font-size:14px;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc2 .pl{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx3);font-weight:800;margin-top:6px}
.pc2 .amt{font-family:var(--disp);font-size:24px;font-weight:800;color:var(--gold);margin-top:2px}
.pc2.p1 .amt{font-size:30px}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);transition:background .15s}
.lbrow+.lbrow{border-top:1px solid var(--ln);border-top-left-radius:0;border-top-right-radius:0}
.lbrow:hover{background:var(--sf2)}
.lbrow.me{background:linear-gradient(90deg,rgba(255,110,32,.16),transparent 75%);box-shadow:inset 0 0 0 1px rgba(255,110,32,.32);border-radius:var(--r2)}
.lbrow .rn{width:34px;text-align:center;font-family:var(--mono);font-weight:800;font-size:13px;color:var(--tx3);flex:none}

.lbrow .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .rv{text-align:right;flex:none}.lbrow .rv b{display:block;font-family:var(--mono);font-weight:800;font-size:15px;color:var(--gold)}
.lbrow .rv b.priv{color:var(--tx4);display:inline-flex}.lbrow .rv span{font-size:11px;color:var(--tx3)}
.you{display:inline-block;vertical-align:middle;margin-left:6px;font-size:9.5px;letter-spacing:1.2px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--o);color:var(--o-ink)}

/* ---- facelift: depth, light and motion, same layout */
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(255,110,32,.07),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(91,157,255,.04),transparent 60%),var(--bg);background-attachment:fixed}
.card,.metric{position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);pointer-events:none}
.card.pad0::before{display:none}
.card[onclick]{transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.card[onclick]:hover{transform:translateY(-2px);border-color:var(--ln2);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.ph h1{font-size:34px;letter-spacing:.3px}
.ph .eyebrow{display:inline-flex;align-items:center;gap:6px}
.nitm{position:relative;transition:background .15s,color .15s}
.nitm.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--o)}
.btn:not(.gh):not(.soft):not(.danger){box-shadow:0 6px 18px rgba(255,110,32,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.gold{box-shadow:0 6px 18px rgba(232,182,74,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.metric{transition:border-color .2s}
.metric:hover{border-color:var(--ln2)}
.metric.gold{border-color:rgba(232,182,74,.22)}.metric.green{border-color:rgba(61,220,132,.2)}.metric.orange{border-color:rgba(255,110,32,.22)}
.vcard,.qcard,.rcard{transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.vcard:hover,.rcard:hover{transform:translateY(-2px);border-color:var(--ln2);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.tabs button{transition:background .15s,color .15s,border-color .15s}
.tabs button:hover{color:var(--tx);border-color:var(--ln2)}
.sec h2{display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--o)}
.lbh-prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:420px}
.lbh-pz{min-width:0}
@media (max-width:760px){.lbh-pz{padding:8px 10px}.lbh-pz b{font-size:18px}}
.slot.empty .th{display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 10px,transparent 10px 20px),var(--bg2)}
.slot.empty .th svg{width:46%;height:46%;opacity:.35}
.slot.empty:hover .th svg{opacity:.6}

/* ---- brand photos */
.rcard .art.ph{height:170px;position:relative;overflow:hidden}
.rcard .art.ph img{width:100%;height:100%;object-fit:cover;object-position:center 45%;transition:transform .5s var(--ease)}
.rcard:hover .art.ph img{transform:scale(1.04)}
.rcard .art.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,10,0) 35%,rgba(17,20,25,.92))}
.rcard.lock .art.ph img{filter:saturate(.55) brightness(.8)}
.tierchip{position:absolute;left:14px;bottom:12px;z-index:2;display:flex;align-items:baseline;gap:8px}
.tierchip b{font-family:var(--disp);font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.tierchip span{font-family:var(--disp);font-size:18px;font-weight:800;color:var(--gold)}
.qcard .art.ph img{width:100%;height:100%;object-fit:cover}
.featured .art.ph{position:relative}.featured .art.ph img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.drawer .art img{object-position:center 40%}
.rwhero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid rgba(232,182,74,.3);background:linear-gradient(100deg,rgba(17,20,25,1) 38%,rgba(17,20,25,.55) 70%,rgba(17,20,25,.2)),var(--sf);min-height:170px}
.rwhero-photo{position:absolute;right:0;top:0;bottom:0;width:55%;background-size:cover;background-position:center 60%;z-index:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.75}
.rwhero-in{position:relative;z-index:1;padding:22px 24px;max-width:640px}
.rwhero-amt{font-family:var(--disp);font-size:54px;font-weight:800;color:var(--gold);line-height:.95;margin-top:8px;text-shadow:0 6px 30px rgba(232,182,74,.3)}
.rwhero-sub{color:var(--tx2);margin-top:8px;font-size:14.5px}.rwhero-sub b{color:var(--tx)}
.rwhero-steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rwhero-steps span{padding:7px 11px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid var(--ln2);font-family:var(--disp);font-weight:800;font-size:16px;color:var(--tx)}
.rwhero-steps span i{font-style:normal;font-family:var(--f);font-weight:600;font-size:11.5px;color:var(--tx3);margin-left:4px}
.rwhero-steps span.on{border-color:rgba(61,220,132,.5);background:rgba(61,220,132,.12);color:var(--gr)}
.lbh-photo{position:absolute;right:0;top:0;bottom:0;width:48%;background-size:cover;background-position:center 55%;opacity:.33;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);pointer-events:none}
.lbhero>.lbh-l,.lbhero>.lbh-r{position:relative;z-index:1}
@media (max-width:760px){.rwhero-photo{width:100%;opacity:.28;-webkit-mask-image:linear-gradient(180deg,transparent,#000 70%);mask-image:linear-gradient(180deg,transparent,#000 70%)}.rwhero-amt{font-size:42px}.lbh-photo{width:100%;opacity:.18}}
.pframe{position:relative;width:100%;height:100%;overflow:hidden;background:#000;display:flex;justify-content:center}
.pframe .pbg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55) saturate(1.2);transform:scale(1.1)}
.pframe img{position:relative;height:100%!important;width:auto!important;max-width:100%;object-fit:contain!important;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.qcard{grid-template-columns:116px 1fr}.qcard .art{width:116px;height:116px}
@media (max-width:640px){.qcard{grid-template-columns:88px 1fr}.qcard .art{width:88px;height:88px}}
/* ---- Spyboard: Knowledge Bomb #2 */
.spytop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px;margin-bottom:14px;align-items:stretch}
.spytop .note{display:block}
.kbcard{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:var(--r);border:1px solid rgba(255,110,32,.45);color:inherit;text-decoration:none!important;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 0% 0%,rgba(255,110,32,.2),transparent 60%),var(--sf);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.kbcard:hover{transform:translateY(-2px);border-color:rgba(255,110,32,.75);box-shadow:0 14px 34px rgba(255,110,32,.18)}
.kbplay{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--o);color:var(--o-ink);box-shadow:0 0 0 8px rgba(255,110,32,.15),0 8px 24px rgba(255,110,32,.35)}
.kbplay svg{margin-left:3px;fill:currentColor}
.kbt{font-family:var(--disp);font-size:20px;font-weight:800;margin-top:4px;line-height:1.1}
.kbs{font-size:13.5px;color:var(--tx2);margin-top:5px;line-height:1.45}
.kbgo{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:700;font-size:13px;color:var(--o2)}
@media (max-width:900px){.spytop{grid-template-columns:1fr}.spytop .kbcard{order:-1}}
@media (max-width:900px){.kbbtn{display:none!important}}
.spytop{grid-template-columns:1fr}

/* ---- movement arrows */
.mv{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;vertical-align:middle;margin-left:4px}
.mv.up{color:var(--gr);background:var(--gr-soft)}.mv.dn{color:var(--bad);background:var(--bad-soft)}.mv.new{color:var(--bl);background:var(--bl-soft);font-family:var(--f);letter-spacing:.6px}
.mvline{margin-top:6px;font-size:12.5px;font-weight:800;font-family:var(--mono)}.mvline.up{color:var(--gr)}.mvline.dn{color:var(--bad)}

/* ---- Book a 1:1 */
.bookcta{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;text-decoration:none!important;color:var(--tx);position:relative;overflow:hidden;
  border:1px solid rgba(232,182,74,.45);background:linear-gradient(135deg,rgba(232,182,74,.2),rgba(255,110,32,.12) 60%,transparent),var(--sf);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.bookcta:hover{transform:translateY(-2px);border-color:rgba(232,182,74,.8);box-shadow:0 12px 30px rgba(232,182,74,.18)}
.bookcta::after{content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:bkshine 4.5s ease-in-out infinite}
@keyframes bkshine{0%,70%{left:-60%}100%{left:130%}}
.bk-ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--gold);color:#241A05;box-shadow:0 6px 16px rgba(232,182,74,.35)}
.bk-tx{min-width:0;flex:1;display:flex;flex-direction:column}.bk-tx b{font-size:13.5px;font-weight:800;line-height:1.2}.bk-tx small{font-size:11.5px;color:var(--tx3);margin-top:2px;line-height:1.3}
.bk-go{color:var(--gold);flex:none}
.bookcta.bk-side{margin:16px 2px 4px}
.bookcta.sheet{margin:6px 0 12px}
.bookcta.mini{padding:9px 11px}.bookcta.mini .bk-ic{width:32px;height:32px}

/* ---- Home activity */
.actrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:var(--r2);text-align:left;color:inherit;transition:background .15s}
.actrow+.actrow{border-top:1px solid var(--ln);border-top-left-radius:0;border-top-right-radius:0}
button.actrow:hover{background:var(--sf2)}
.act-th{flex:none;width:40px;height:52px;border-radius:8px;overflow:hidden;background:var(--sf3);display:grid;place-items:center}
.act-th img,.act-th svg{width:100%;height:100%;object-fit:cover}
.act-ic{color:var(--o2)}
.act-t{font-weight:700;font-size:14px}
.gmvq{font-weight:600;text-transform:none;letter-spacing:0;color:var(--tx3)}
.stat3.stat5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat3.stat4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rules{margin:10px 0 0;padding-left:18px;display:grid;gap:10px}.rules li{line-height:1.55}
@media (max-width:760px){.stat3.stat4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.stat3.stat5{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ================= Oct 14: quest reset clock, claim banner, quest progress, easier proof ================= */
.qtimer{display:inline-flex;align-items:center;gap:8px;background:rgba(17,20,25,.94);border:1px solid rgba(255,110,32,.5);color:var(--tx);border-radius:99px;padding:7px 14px 7px 12px;font-weight:700;font-size:13px;box-shadow:var(--sh);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qtimer[hidden]{display:none!important}
.qtimer:hover{border-color:var(--o)}
.qtimer .qt-l{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--o2);font-weight:800}
.qtimer .qt-l::before{content:"⏳ "}
.qtimer .qt-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.qtimer.soon{border-color:var(--bad);animation:qtpulse 2s ease-in-out infinite}
.qtimer.soon .qt-l{color:var(--bad)}
@keyframes qtpulse{50%{box-shadow:0 0 0 4px rgba(255,92,77,.2)}}
.qtimer.d{position:fixed;top:14px;right:18px;z-index:45}
.qtimer.m{display:none}
@media (min-width:901px){.main{padding-top:64px}.mode{top:auto;bottom:14px}}
@media (max-width:900px){
  .qtimer.d{display:none!important}
  .qtimer.m{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 11px;box-shadow:none;margin-left:auto;margin-right:8px;line-height:1.25}
  .qtimer.m .qt-l{font-size:9px;letter-spacing:1.1px}.qtimer.m .qt-v{font-size:12.5px}
  .mobtop .brand small{font-size:9.5px;letter-spacing:1.2px}
}
/* claim banner */
.claimwrap{display:grid;gap:10px;margin-bottom:16px}
.claimbar{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r);border:1px solid rgba(232,182,74,.65);background:linear-gradient(110deg,rgba(232,182,74,.26),rgba(255,110,32,.16) 60%,rgba(232,182,74,.10)),var(--sf);box-shadow:0 10px 40px rgba(232,182,74,.16);animation:cbin .5s var(--ease) both}
.claimbar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);transform:translateX(-100%);animation:cbshine 3.4s ease-in-out .6s infinite;pointer-events:none}
.cb-ic{font-size:36px;line-height:1}
.cb-k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.cb-tx b{display:block;font-family:var(--disp);font-size:28px;font-weight:800;line-height:1.08;margin-top:3px;color:var(--tx)}
.cb-tx span{display:block;font-size:13.5px;color:var(--tx2);margin-top:5px;max-width:660px}
.cb-go{font-size:15px;padding:12px 18px;position:relative;z-index:1;white-space:nowrap}
@keyframes cbin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes cbshine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@media (max-width:640px){.claimbar{grid-template-columns:auto minmax(0,1fr);padding:16px;gap:12px}.cb-go{grid-column:1/-1;width:100%;justify-content:center}.cb-tx b{font-size:23px}.cb-ic{font-size:30px}}
/* quest progress hero */
.qhero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.qh-bar{position:relative;height:14px;background:var(--sf3);border-radius:99px;margin:16px 6px 40px}
.qh-bar i.e{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--o),var(--gold));border-radius:99px;transition:width .6s var(--ease)}
.qh-bar i.p{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,176,32,.6) 0 6px,rgba(255,176,32,.25) 6px 12px);border-radius:0 99px 99px 0}
.qh-mk{position:absolute;top:-4px;transform:translateX(-50%);text-align:center}
.qh-mk i{display:block;width:4px;height:22px;margin:0 auto;background:var(--tx4);border-radius:2px}
.qh-mk.on i{background:var(--gold)}
.qh-mk span{display:block;margin-top:3px;font-size:10.5px;color:var(--tx3);white-space:nowrap;font-family:var(--mono)}
.qh-mk span b{display:block;font-size:12.5px;color:var(--tx2);font-family:var(--f)}
.qh-mk.on span b{color:var(--gold)}
.qh-mk:last-child{transform:translateX(-100%);text-align:right}.qh-mk:last-child i{margin:0 0 0 auto}
.qh-next{font-size:14px;color:var(--tx2);line-height:1.5}
.qh-next b{color:var(--tx)}
.qh-next.good{color:var(--gr)}
.qh-tag{display:inline-block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:var(--o-ink);background:var(--o);padding:2px 7px;border-radius:99px;margin-right:4px;vertical-align:1px}
.qh-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.qh-chips span{font-size:12.5px;color:var(--tx2);background:var(--sf2);border:1px solid var(--ln);border-radius:99px;padding:5px 10px}
.qh-chips b{color:var(--tx)}
.rclock{text-align:center;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,110,32,.35)}
.rclock .lbl{color:var(--o2)}
.rclock .cd{justify-content:center}
.rclock .cd b{font-variant-numeric:tabular-nums}
.rclock.soon{border-color:rgba(255,92,77,.6)}.rclock.soon .cd b{color:var(--bad)}
.rclock .mini{max-width:270px;margin-left:auto;margin-right:auto}
@media (max-width:800px){.qhero{grid-template-columns:1fr}.rclock .cd div{min-width:0;flex:1}}
.qimpact{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(232,182,74,.3);border-radius:10px;padding:5px 10px;display:inline-block;line-height:1.35}
.qimpact.hit{color:var(--gr);background:var(--gr-soft);border-color:rgba(61,220,132,.35)}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:-1px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sf3);border:1px solid var(--ln2)}
.dots i.on{background:var(--gr);border-color:var(--gr)}
/* data freshness */
.syncline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--tx3);margin:0 0 10px;line-height:1.45}
.syncline .dot{width:8px;height:8px;border-radius:50%;background:var(--gr);flex:none;margin-top:5px}
.syncline b{color:var(--tx2)}
/* proof: helper line, paste, screenshots */
.field .help{line-height:1.45}
.shotrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shotbtn{cursor:pointer}
.shotbtn[hidden]{display:none!important}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shots:not(:empty){margin-top:8px}
.shotchip{display:inline-flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--ln2);border-radius:12px;padding:5px 8px 5px 5px;font-size:12.5px;color:var(--tx2)}
.shotchip img{width:42px;height:42px;object-fit:cover;border-radius:8px;background:var(--sf3);display:block}
.shotchip button{color:var(--tx3);display:grid;place-items:center;width:26px;height:26px;border-radius:99px}
.shotchip button:hover{background:var(--sf3);color:var(--tx)}
.shotlink{display:inline-flex;align-items:center;gap:8px;margin:4px 0}
.shotlink img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--ln2);background:var(--sf3)}
.aa-prog{margin-top:16px}.aa-prog[hidden]{display:none}
/* ---- Video stat sheet (Oct 14) */
.vstabs{display:inline-flex;background:var(--sf2);border:1px solid var(--ln);border-radius:99px;padding:3px;gap:2px}
.vstabs button{font-size:12.5px;font-weight:700;color:var(--tx3);padding:5px 12px;border-radius:99px}
.vstabs button.on{background:var(--o);color:var(--o-ink)}
.vstips{display:grid;gap:6px;margin-top:10px}
.vstips div{font-size:13px;color:var(--tx);background:var(--o-soft);border:1px solid rgba(255,110,32,.3);border-radius:10px;padding:8px 11px;line-height:1.45}
.vsgrp{margin-top:14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);padding:4px 12px 8px}
.vsg{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:var(--tx3);padding:8px 0 2px}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--ln)}
.vsg+.vsrow{border-top:0}
.vsl{font-size:13.5px;color:var(--tx2);font-weight:600;align-self:center}
.vsv{font-family:var(--disp);font-size:20px;font-weight:800;text-align:right;align-self:center;white-space:nowrap}
.vsv small{font-family:var(--f);font-size:12px;color:var(--tx3);font-weight:600}
.vss{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--tx3)}
.vsd{font-weight:800;font-size:12px;padding:1px 7px;border-radius:99px;font-family:var(--mono)}
.vsd.g{color:var(--gr);background:var(--gr-soft)}.vsd.b{color:var(--bad);background:var(--bad-soft)}.vsd.n{color:var(--bl);background:var(--bl-soft)}.vsd.eq{color:var(--tx2);background:var(--sf2);font-family:var(--f)}
.vsret{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 0 2px;border-top:1px solid var(--ln)}
.vsret .rc{text-align:center}
.vsret .rbar{position:relative;height:74px;background:var(--sf3);border-radius:8px;overflow:hidden}
.vsret .rbar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--gold),var(--o));border-radius:8px 8px 0 0}
.vsret .rbar b{position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.vsret span{display:block;font-family:var(--mono);font-weight:700;font-size:13px;margin-top:5px}
.vsret small{display:block;font-size:10.5px;color:var(--tx3);letter-spacing:.6px;text-transform:uppercase}

/* Team goal thermometer (Oct 17 redesign): a glass fundraiser thermometer. Molten-orange mercury in a dark glass
   tube, a glowing bulb that carries the %, graduation ticks underneath, gold checks on passed checkpoints.
   One load moment (mercury rises, numbers count up), then still. */
.card.tg{position:relative;overflow:hidden;margin-bottom:14px;padding:22px 22px 20px;border-color:rgba(255,122,46,.32);
  background:radial-gradient(120% 90% at 0% 0%,rgba(255,110,32,.16),transparent 55%),radial-gradient(80% 70% at 100% 100%,rgba(232,182,74,.07),transparent 60%),linear-gradient(180deg,#14171D,#0F1116)}
.tg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tg-title{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.2px;line-height:1.05;color:var(--tx)}
.tg-sub{font-size:13px;color:var(--tx3);margin-top:3px}
.tg-pot{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-weight:700;font-size:13px;color:#F6D58E;
  background:linear-gradient(180deg,rgba(232,182,74,.2),rgba(232,182,74,.08));border:1px solid rgba(232,182,74,.38);box-shadow:0 0 22px rgba(232,182,74,.12)}
.tg-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px}
.tg-num{font-family:var(--disp);font-size:60px;font-weight:800;line-height:.92;letter-spacing:-.5px;color:#fff;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFFFFF 30%,#FFD9BD);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tg-of{font-size:15px;color:var(--tx2);font-weight:600}
/* the thermometer */
.tgm{position:relative;display:flex;align-items:center;margin-top:20px;height:66px}
.tgm-bulb{position:relative;z-index:2;flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#FFD2AE 0%,#FF8A3D 30%,#F26414 62%,#B8430A 100%);
  box-shadow:0 0 0 5px #12151A,0 0 0 6px rgba(255,255,255,.09),0 0 34px rgba(255,110,32,.6),inset 0 -6px 12px rgba(120,35,0,.45)}
.tgm-bulb::after{content:'';position:absolute;left:15px;top:11px;width:18px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);filter:blur(2px);transform:rotate(-24deg)}
.tgm-bulb span{position:relative;z-index:1;font-family:var(--disp);font-weight:800;font-size:23px;color:#fff;line-height:1;text-shadow:0 1px 6px rgba(110,30,0,.55)}
.tgm-bulb small{font-size:13px;margin-left:1px}
.tgm-tube{position:relative;flex:1;height:28px;margin-left:-16px;border-radius:0 99px 99px 0;overflow:hidden;
  background:linear-gradient(180deg,#0B0D11,#171A21 55%,#0D0F13);border:1px solid rgba(255,255,255,.1);border-left:0;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.04)}
.tgm-tube::after{content:'';position:absolute;z-index:3;left:18px;right:12px;top:4px;height:4px;border-radius:99px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.32),rgba(255,255,255,.08) 55%,rgba(255,255,255,.02))}
.tgm-merc{position:relative;z-index:1;height:100%;min-width:20px;border-radius:0 99px 99px 0;
  background:linear-gradient(180deg,#FFC08F 0%,#FF8A3D 30%,#FF6E20 58%,#C94C0C 100%);
  box-shadow:0 0 18px rgba(255,110,32,.55),inset -3px 0 6px rgba(255,220,190,.35);animation:tgrise 1.4s var(--ease) .1s both}
.tgm-merc::after{content:'';position:absolute;right:3px;top:5px;bottom:5px;width:5px;border-radius:99px;background:rgba(255,236,220,.75);filter:blur(1.5px)}
.tgm-notch{position:absolute;z-index:2;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(0,0,0,.42)}
.tgm-notch.hit{background:rgba(90,30,0,.35)}
.tgm-notch i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:900;color:#2A1C02;background:radial-gradient(circle at 35% 30%,#FFF0C2,#E8B64A 60%,#B88A24);box-shadow:0 0 0 2px rgba(80,25,0,.45),0 0 8px rgba(232,182,74,.6)}
.tgm.won .tgm-bulb{background:radial-gradient(circle at 34% 28%,#FFF1C8 0%,#F2CC6A 32%,#E0A93A 62%,#9C6E14 100%);box-shadow:0 0 0 5px #12151A,0 0 0 6px rgba(255,255,255,.09),0 0 38px rgba(232,182,74,.7),inset 0 -6px 12px rgba(90,60,0,.45)}

@keyframes tgrise{from{width:0}}
.tg.still .tgm-merc{animation:none}
/* graduation ticks + checkpoint labels, aligned to the tube (bulb overlap = 50px) */
.tgm-under{margin:6px 0 0 50px}
.tgm-grad{position:relative;height:9px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 2.5%)}

/* stats row */
.tg-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}

/* the pot rule */

  background:linear-gradient(90deg,rgba(232,182,74,.13),rgba(232,182,74,.04));border:1px solid rgba(232,182,74,.22)}
.tg-rule b{color:#F6D58E;font-weight:700}
/* your contribution */
.tg-you{display:flex;align-items:center;gap:16px;margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--ln)}

.tg-you-txt{min-width:0}
.tg-you-h{font-size:13px;font-weight:700;color:var(--tx3)}

.tg-you-v span{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1;color:var(--tx);font-variant-numeric:tabular-nums}
.tg-you-v small{font-size:13.5px;color:var(--tx2)}
.tg-cut{margin-top:6px;font-size:14px;color:var(--tx2)}
.tg-cut b{color:var(--gold);font-weight:800;font-size:15px}
.tg-priv{margin-top:4px;font-size:12px;color:var(--tx4)}
@media (max-width:560px){
  .card.tg{padding:18px 16px 16px}

  .tg-num{font-size:48px}
  .tgm{height:56px} .tgm-bulb{width:56px;height:56px} .tgm-bulb span{font-size:19px} .tgm-bulb::after{left:12px;top:9px;width:15px}
  .tgm-tube{height:24px;margin-left:-14px} .tgm-under{margin-left:42px} .tgm-notch i{width:14px;height:14px;font-size:9px}
  .tgm-scale{font-size:11.5px} .tgm-scale em.flag{display:none}
  .tg-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tg-stat:nth-child(3){border-left:0;padding-left:0}

  .tg-you{padding:12px;gap:12px} .tg-ringwrap{width:66px;height:66px} .tg-you-v span{font-size:28px}
}
@media (prefers-reduced-motion:reduce){ .tgm-merc{animation:none} }

  async rpc(name,args={}){

    if(!force&&S.cache[k]&&Date.now()-(S.cacheAt[k]||0)<API.TTL) return S.cache[k];

    const cat=m.quests.catalog.find(c=>c.quest_key===i.quest_key); const errs=validateEvidence(cat.proof,i.draft); if(errs.length) return {ok:false,state:i.state,errors:errs,why:'evidence incomplete'};
    const h=JSON.stringify(Object.values(i.draft).flat().map(x=>String(x).toLowerCase().trim()).sort());
    if(m.quests.instances.some(o=>o.id!==i.id&&o.quest_key===i.quest_key&&o._h===h&&['submitted','approved'].includes(o.state))) return {ok:false,state:i.state,errors:['This evidence was already submitted for this quest.'],why:'duplicate evidence'};
    i._h=h; i.state='submitted'; i.submitted_at=new Date().toISOString(); i.submit_request_id=a.p_request_id; i.evidence.push({at:i.submitted_at,data:JSON.parse(JSON.stringify(i.draft))}); i.history.push({at:i.submitted_at,event:'submitted'}); return {ok:true,state:'submitted',errors:[],why:'received'}; },
  claim(m,a){ const r=m.rewards; const t=r.tiers.find(t=>t.id===a.p_milestone_id); if(!t) return {ok:false,why:'no such milestone'};
    if(!t.published) return {ok:false,why:'cash claims are not open yet: reward terms are draft'};
    const ex=FX.claims.find(c=>c.request_id===a.p_request_id); if(ex) return {ok:true,claim_id:ex.id,state:ex.state,amount_cents:ex.amount_cents,why:'already received'};
    if(r.xp<t.xp_required) return {ok:false,why:`needs ${t.xp_required} XP, has ${r.xp}`}; if(r.concepts<t.concepts_required) return {ok:false,why:`needs ${t.concepts_required} approved concepts, has ${r.concepts}`};
    const amt=Math.max(t.cash_total_cents-FX.ledger,0); if(!amt) return {ok:false,why:'this tier total is already reserved or paid'}; FX.ledger+=amt;
    const c={id:uid(),milestone_id:t.id,state:'claim_requested',amount_cents:amt,requested_at:new Date().toISOString(),request_id:a.p_request_id}; FX.claims.push(c); r.ledger={reserved_cents:FX.ledger,paid_cents:0}; r.history.unshift({claim_id:c.id,event:'requested',amount_cents:amt,at:c.requested_at}); return {ok:true,claim_id:c.id,state:'claim_requested',amount_cents:amt,why:'claim submitted'}; },
  adminDecide(name,a){ for(const k of Object.keys(FX.data.creators)){ const m=FX.data.creators[k]; const i=m.quests.instances.find(x=>x.id===a.p_instance); if(!i) continue; if(i.state!=='submitted') return {ok:false,awarded:false,why:'instance is not in review'};
      const cat=m.quests.catalog.find(c=>c.quest_key===i.quest_key); const now=new Date().toISOString(); const qrow=(FX.data.admin.queue||[]).find(x=>x.id===i.id);
      if(qrow){ qrow.state=name==='approve_quest'?'approved':name==='return_quest'?'needs_changes':'rejected'; qrow.review_note=a.p_note||a.p_reason||null; }
      if(name==='approve_quest'){ i.state='approved'; i.xp=cat.xp_value; i.reviewed_at=now; i.history.push({at:now,event:'approved',detail:{xp:cat.xp_value}}); m.quests.xp_earned+=cat.xp_value; m.rewards.xp+=cat.xp_value; cat.done_in_period++; cat.xp_this_month+=cat.xp_value; cat.completions_total++; return {ok:true,awarded:true,xp:cat.xp_value,why:'awarded'}; }
      if(name==='return_quest'){ if(!a.p_note) return {ok:false,why:'feedback is required'}; i.state='needs_changes'; i.review_note=a.p_note; i.history.push({at:now,event:'changes_requested',detail:{note:a.p_note}}); return {ok:true,why:'returned'}; }
      if(name==='reject_quest'){ if(!a.p_reason) return {ok:false,why:'reason is required'}; i.state='rejected'; i.review_note=a.p_reason; i.history.push({at:now,event:'rejected',detail:{reason:a.p_reason}}); return {ok:true,why:'rejected'}; }
    } return {ok:false,why:'no such quest instance'}; },
};
/* same validator as app.validate_evidence, so the client can pre-check and the server stays authoritative */
function validateEvidence(proof,draft){ const errs=[]; const isUrl=u=>/^https?:\/\/\S+$/i.test(String(u||''));
  for(const f of proof||[]){ let v=draft?.[f.field]; const empty=v==null||v===''||(Array.isArray(v)&&v.filter(x=>String(x).trim()).length===0);
    if(f.required&&empty){ errs.push(`${f.label} is required`); continue; } if(empty) continue;
    if(f.type==='url'&&!isUrl(v)) errs.push(`${f.label} must be a full link starting with http`);
    if(f.type==='url_list'||f.type==='submission_list'){ const arr=(Array.isArray(v)?v:String(v).split(/\n+/)).map(x=>String(x).trim()).filter(Boolean);
      if(f.min&&arr.length<f.min) errs.push(`${f.label} needs ${f.min} items, has ${arr.length}`); if(f.max&&arr.length>f.max) errs.push(`${f.label} allows at most ${f.max} items`);
      if(f.type==='url_list'){ arr.forEach(u=>{ if(!isUrl(u)) errs.push(`${f.label}: "${u.slice(0,40)}" is not a full link`); }); if(new Set(arr.map(x=>x.toLowerCase())).size<arr.length) errs.push(`${f.label} has duplicate links`); } }
    if(f.type==='text'&&String(v).trim().length<(f.min||1)) errs.push(`${f.label} needs at least ${f.min||1} characters`);
    if(f.type==='date'&&isNaN(new Date(v))) errs.push(`${f.label} is not a date`);
    if(f.type==='choice'&&!(f.options||[]).includes(v)) errs.push(`${f.label} must be one of the listed options`); }
  return errs; }

/* live backend: Supabase REST + anonymous auth. Publishable key only. */
const LIVE={
  url:window.SUPABASE_URL, key:window.SUPABASE_KEY, session:null,
  hdr(){ return {'apikey':LIVE.key,'Authorization':'Bearer '+(LIVE.session?.access_token||LIVE.key),'Content-Type':'application/json','Accept-Profile':'app','Content-Profile':'app'}; },
  async ensureSession(){
    if(LIVE.session&&LIVE.session.expires_at*1000>Date.now()+60000) return LIVE.session;
    try{ const saved=JSON.parse(localStorage.getItem('rcg_session')||'null'); if(saved?.refresh_token){ const r=await fetch(`${LIVE.url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':LIVE.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:saved.refresh_token})}); if(r.ok){ LIVE.session=await r.json(); localStorage.setItem('rcg_session',JSON.stringify(LIVE.session)); return LIVE.session; } } }catch(e){}
    const r=await fetch(`${LIVE.url}/auth/v1/signup`,{method:'POST',headers:{'apikey':LIVE.key,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok){ const t=await r.text(); throw new Error('anonymous sign-in is not enabled on this project ('+r.status+'): '+t.slice(0,120)); }
    LIVE.session=await r.json(); localStorage.setItem('rcg_session',JSON.stringify(LIVE.session)); return LIVE.session;
  },
  async rpc(name,args={}){
    await LIVE.ensureSession();
    const r=await fetch(`${LIVE.url}/rest/v1/rpc/${name}`,{method:'POST',headers:LIVE.hdr(),body:JSON.stringify(args)});
    if(r.status===404){ const e=new Error('backend not set up: app.'+name+' is missing'); e.code='NO_BACKEND'; throw e; }
    if(!r.ok){ const e=new Error((await r.text()).slice(0,200)); e.code=r.status; throw e; }
    const j=await r.json(); return Array.isArray(j)&&j.length===1&&name!=='leaderboard'?j[0]:j;
  },
  async login(code){ const r=await LIVE.rpc('link_code',{p_code:code,p_user_agent:navigator.userAgent}); return r; },
  logout(){ localStorage.removeItem('rcg_session'); LIVE.session=null; },
};

/* ---- charts (single axis, thin marks, hover tooltip) */
function drawChart(el){ const spec=JSON.parse(el.dataset.chart); const W=el.clientWidth||600, H=spec.h||180, P={l:44,r:10,t:10,b:26};
  const rows=spec.rows||[]; if(!rows.length){ el.innerHTML='<div class="mini">No daily rows in this range.</div>'; return; }
  const series=spec.series; const max=Math.max(1,...rows.flatMap(r=>series.map(s=>Number(r[s.key])||0)));
  const x=i=>P.l+(rows.length>1?i/(rows.length-1):0.5)*(W-P.l-P.r), y=v=>P.t+(1-v/max)*(H-P.t-P.b);
  const ticks=[0,.5,1].map(t=>t*max);
  const grid=ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.08)"/><text x="${P.l-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#848C99">${fmt.usd(t)}</text>`).join('');
  const paths=series.map(s=>`<path d="${rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(Number(r[s.key])||0).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`).join('');
  const dots=series.map(s=>rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(Number(r[s.key])||0)}" r="3.5" fill="${s.color}" stroke="#111419" stroke-width="2"/>`).join('')).join('');
  const labels=rows.map((r,i)=>(rows.length<=8||i%Math.ceil(rows.length/6)===0||i===rows.length-1)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#848C99">${fmt.date(r.day)}</text>`:'').join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||'chart')}">${grid}${paths}${dots}${labels}<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg><div class="tip"></div><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
  const tip=el.querySelector('.tip'), svg=el.querySelector('svg');
  svg.addEventListener('mousemove',e=>{ const b=svg.getBoundingClientRect(); const px=(e.clientX-b.left)*W/b.width; let i=Math.round((px-P.l)/((W-P.l-P.r)/Math.max(1,rows.length-1))); i=clamp(i,0,rows.length-1); const r=rows[i];
    tip.style.display='block'; tip.style.left=(x(i)*b.width/W)+'px'; tip.style.top=(y(Math.max(...series.map(s=>Number(r[s.key])||0)))*b.height/H)+'px'; tip.innerHTML=`<b>${fmt.date(r.day)}</b><br>${series.map(s=>`${esc(s.label)}: ${fmt.usd2(r[s.key]||0)}`).join('<br>')}`; });
  svg.addEventListener('mouseleave',()=>tip.style.display='none'); }

'use strict';
const PERIOD_LABEL=k=>((S.cache['my_quests{}']?.periods||[]).find(p=>p.key===k)?.label)||({'2026-10-P1':'Oct 1–15','2026-10-P2':'Oct 16–31','2026-10':'October'})[k]||(/^\d{4}-\d{2}-\d{2}$/.test(k||'')?fmt.date(k+'T12:00:00Z'):k);
function periodNow(q){ return (q.periods||[]).find(p=>p.key===q.period_now); }
function daysLeft(ends){ return Math.max(0,Math.ceil((new Date(ends)-Date.now())/86400000)); }
function nextTier(r){ return (r.tiers||[]).find(t=>t.status==='locked'); }
/* Half-month rewards (Austin, Oct 9): XP, approved videos, quests and cash tiers reset at 12:00 am CT on the 1st and 16th. No stacking. */
function halfLabel(k){ return PERIOD_LABEL(k||S.cache['my_quests{}']?.period_now||'2026-10-P1'); }
function halfReset(r,k){ if(r?.period?.ends_at) return fmt.date(r.period.ends_at); const key=k||S.cache['my_quests{}']?.period_now; const pn=(S.cache['my_quests{}']?.periods||[]).find(p=>p.key===key); return pn?fmt.date(pn.ends_at):(({'2026-10-P1':'Oct 16','2026-10-P2':'Nov 1'})[key]||'the 16th'); }
/* Payday = the day the half closes (its ends_at). Paid after the close because a creator can still climb a tier until then. */
function payday(ctx){ const e=ctx?.period?.ends_at||ctx?.ends_at; return e?fmt.date(e):halfReset(ctx); }
function paydayText(ctx){ const e=ctx?.period?.ends_at||ctx?.ends_at; return e&&new Date(e)<=Date.now()?'payout going out now':`paid on ${payday(ctx)}`; }
/* ---------------- Prestige (Austin, Oct 10): Rookie -> Prestige I -> II -> III -> Prestige Master, live from the Oct 16 reset.
   Hit the top tier of the level you play to unlock the next. Pick any unlocked level at each reset (drop back allowed).
   Higher levels pay more and need more: XP, approved videos, boss quests, and from Prestige II, Trybe sales in the half. */
const PNAMES=['Rookie','Prestige I','Prestige II','Prestige III','Prestige Master'], PEMB=['🎯','🥉','🥈','🥇','👑'];
const PLV=(r,l)=>(r?.prestige?.levels||[]).find(x=>x.level===l)||{level:l,name:PNAMES[l]||'Rookie',emblem:PEMB[l]||'🎯',tiers:[],boss:[]};
const usd0=c=>fmt.usd(c,{cents:true});
const rookieTiers=r=>((r?.prestige?.levels||[])[0]?.tiers||[]).length?r.prestige.levels[0].tiers:(r?.tiers||[]);
function tierReq(t){ return `${t.xp_required} XP · ${t.concepts_required} videos${t.sales_required_cents>0?` · ${usd0(t.sales_required_cents)} in sales`:''}`; }
function prestigeLive(r){ const la=r?.prestige?.launch_at; return !la||new Date(la)<=Date.now(); }
function pickWhen(r){ const P=r.prestige||{}, nx=P.next; return P.can_change_current?`for ${r.period?.label||'this half'} (you can still change it until ${fmt.date(new Date(new Date(P.change_until)-1))})`:(nx&&nx.has_prestige?`for ${nx.label}, starting ${fmt.date(nx.starts_at)}`:''); }
function prestigeSection(r){ const P=r.prestige; if(!P||!(P.levels||[]).length) return '';
  const cur=PLV(r,P.level), unl=P.unlocked||0, nx=P.next, live=prestigeLive(r), up=PLV(r,Math.min(P.level+1,4));
  const canPick=unl>0&&(P.can_change_current||(nx&&nx.has_prestige)); const chosenNext=P.can_change_current?P.level:(nx?nx.level:P.level);

  <div class="card hi pstat" style="margin-bottom:12px"><div class="row" style="gap:14px;align-items:center"><div class="em">${cur.emblem}</div><div><div class="lbl">You play this half</div><div class="pnow">${esc(cur.name)}</div></div>${nx&&nx.has_prestige&&nx.level!==P.level&&!P.can_change_current?`<div class="pnext"><div class="lbl">${esc(nx.label)}</div><div><b>${PLV(r,nx.level).emblem} ${esc(PLV(r,nx.level).name)}</b></div></div>`:''}</div>
    <p style="margin-top:10px">${status}</p>
    ${canPick?`<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px">${P.levels.filter(l=>l.unlocked).map(l=>{ const on=l.level===chosenNext; return `<button class="btn ${on?'':'gh'} sm" ${on?'disabled aria-pressed="true"':''} onclick="pickPrestige(${l.level})">${l.emblem} ${esc(l.name)}${on?' ✓':''}</button>`; }).join('')}</div><div class="mini" style="margin-top:6px">Your pick applies ${esc(pickWhen(r))}. Dropping back is always allowed.</div>`:''}

  <div class="plad">${P.levels.map(l=>`<button class="pcard ${l.level===P.level?'cur':''} ${l.unlocked?'':'lock'}" onclick="openPrestige(${l.level})" aria-label="${esc(l.name)}"><span class="tag">${l.level===P.level?badge('g','You'):l.unlocked?badge('p','Unlocked'):badge('n','🔒 Preview')}</span><div class="em">${l.emblem}</div><div class="pn">${esc(l.name)}</div><div class="pp">${(l.tiers||[]).map(t=>usd0(t.cash_total_cents)).join(' · ')}</div><div class="pr">${(l.tiers||[]).length?`Top tier: ${esc(tierReq(l.tiers[l.tiers.length-1]))}`:''}${(l.boss||[]).length?`<br>⚔️ ${l.boss.length} new boss quest${l.boss.length===1?'':'s'}`:''}</div></button>`).join('')}</div>`; }
async function openPrestige(level){ const r=await API.page('my_rewards'); const P=r.prestige||{}; const l=PLV(r,level); const nx=P.next;
  const canPick=l.unlocked&&(P.can_change_current||(nx&&nx.has_prestige)); const chosen=P.can_change_current?P.level:(nx?nx.level:P.level);

   <section><h3>Cash tiers, every half</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Tier</th><th class="num">Pays</th><th class="num">XP</th><th class="num">Approved videos</th><th class="num">Trybe sales</th></tr></thead><tbody>${(l.tiers||[]).map(t=>`<tr><td>${esc(t.name)}</td><td class="num"><b style="color:var(--gold)">${usd0(t.cash_total_cents)}</b></td><td class="num">${t.xp_required}</td><td class="num">${t.concepts_required}</td><td class="num">${t.sales_required_cents>0?usd0(t.sales_required_cents):'—'}</td></tr>`).join('')}</tbody></table></div>
   <div class="mini" style="margin-top:6px">Everything counts inside one half. No stacking: your highest tier is your total. Sales = Trybe sales in that half from your videos (not marked BOF). Paid after the half closes.</div></section>
   ${(l.boss||[]).length?`<section><h3>⚔️ Boss quests that open here</h3><ul>${l.boss.map(b=>`<li><b>${esc(b.title)}</b> · +${b.xp_value} XP</li>`).join('')}</ul><div class="mini">Boss quests from lower levels stay open too.</div></section>`:''}
   <section><h3>How to get here</h3><p>${level===0?'Everyone starts here.':`Hit the top tier (${esc((PLV(r,level-1).tiers||[]).slice(-1)[0]?.name||'Elite')}) of ${esc(PLV(r,level-1).name)} in a half. Once unlocked it stays unlocked.`}</p></section>
   ${canPick&&level!==chosen?`<section><button class="btn gold" id="pickbtn" onclick="pickPrestige(${level})">${l.emblem} Play ${esc(l.name)}</button><div class="mini" style="margin-top:8px">Applies ${esc(pickWhen(r))}.</div></section>`:''}`); }
async function pickPrestige(level){ const b=$('#pickbtn'); if(b){ b.classList.add('pending'); b.disabled=true; }
  try{ const r=await API.rpc('choose_prestige',{p_level:level}); toast(r.why||(r.ok?'Saved':'Not saved'),r.ok?'good':'bad'); if(r.ok){ API.bust(); closeDrawer(true); render(); } }
  catch(e){ toast(e.message,'bad'); } finally{ if(b){ b.classList.remove('pending'); b.disabled=false; } } }

function eliteStatus(E){ const N=E.roster||0, D=E.move_down||20, line=N-D+1, place=E.place||N, worst=place+(E.tied||1)-1, zero=!(Number(E.gmv)>0);
  if(N<=D) return {k:'safe',line,place,worst,zero,above:null};
  if(place>=line||(zero&&worst>=line)) return {k:'in',line,place,worst,zero,above:0};
  if(worst>=line) return {k:'line',line,place,worst,zero,above:0};
  const above=line-1-worst; return {k:above<=5?'close':'safe',line,place,worst,zero,above}; }

    ${row(calls>0,'Weekly calls',calls||cp?`<b>${calls}</b> attended${cp?` · ${cp} in review`:''}`:'None yet',`<a class="es-a" href="#/quests" onclick="S.ui.qcat='Community';saveUI()">Claim a call</a>`)}
    ${row(coach,'1:1 with Austin',coach?'Done':coachP?'In review':'Not yet',coach?'':`<a class="es-a" ${openExt(BOOK_CALL)}>Book a 1:1</a>`)}
    ${row(!(st.k==='in'||st.k==='line'),'Sales rank',st.zero?'No sales yet':`#${st.place} of ${N}`)}
   </div>
   <div class="mini" style="margin-top:10px">Ranked by ${esc(monthName(E))} sales from videos posted in ${esc(monthName(E))}, same as the leaderboard. Last day: ${esc(lastDay)}. Only you see your own sales.</div></div>`; }
/* ---- Weekly pace (Austin, Oct 24): 5 videos a week minimum. Monday to Sunday, Central. Originals only, no revisions or statics. ---- */
const WEEK_MIN=5;
const ctDay=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:TZ});
function ctWeek(now=new Date()){ const today=ctDay(now); const [y,m,dd]=today.split('-').map(Number); const base=new Date(Date.UTC(y,m-1,dd,12)); const dow=(base.getUTCDay()+6)%7;   // 0 = Monday
  return [...Array(7)].map((_,i)=>{ const x=new Date(base); x.setUTCDate(base.getUTCDate()-dow+i); return x.toISOString().slice(0,10); }); }
function paceCard(vids,src){ if(!Array.isArray(vids)) return ''; const days=ctWeek(); const today=ctDay(new Date()); const ti=days.indexOf(today);
  const mine=vids.filter(v=>v.submitted_at&&!v.is_revision&&!v.parent_id&&v.media_type!=='IMAGE');
  const per=days.map(d=>mine.filter(v=>ctDay(v.submitted_at)===d).length); const n=per.reduce((a,b)=>a+b,0);
  const left=6-ti, need=Math.max(0,WEEK_MIN-n), done=n>=WEEK_MIN;
  const DN=['M','T','W','T','F','S','S'];
  const msg=done?`You hit the ${WEEK_MIN}-a-week minimum. Anything more is a bonus.`
    :left===0?`Last day of the week. ${need} more today keeps you on pace.`
    :`${need} more by Sunday keeps you on pace. ${left+1} day${left+1===1?'':'s'} left, today included.`;
  return `<div class="card pace ${done?'done':''}" role="region" aria-label="This week's pace"><div class="row between"><div class="lbl">This week · ${fmt.date(days[0]+'T12:00:00Z')} to ${fmt.date(days[6]+'T12:00:00Z')}</div>${done?badge('g','On pace'):''}</div>
   <div class="pace-row"><div class="pace-n"><b>${n}</b> of ${WEEK_MIN} videos</div>
    <div class="pace-days" aria-hidden="true">${per.map((c,i)=>`<span class="pd ${c?'on':''} ${i===ti?'today':''} ${i>ti?'future':''}"><i>${c||''}</i><small>${DN[i]}</small></span>`).join('')}</div></div>
   <div class="pace-bar"><i style="width:${Math.min(100,Math.round(n/WEEK_MIN*100))}%"></i></div>
   <div class="mini" style="margin-top:8px">${esc(msg)}${src?.last_run?` Updated ${esc(fmt.ago(src.last_run))}.`:''}</div></div>`; }
/* ---- Milestone badges (Austin, Oct 24). Worked out from the creator's own videos; nothing new is stored. ---- */
function badgesOf(vids){ const V=(vids||[]).filter(v=>v.media_type!=='IMAGE');
  const orig=V.filter(v=>!v.is_revision&&!v.parent_id&&v.submitted_at);
  const appr=V.filter(v=>v.status==='approved'&&v.approved_at).sort((a,b)=>new Date(a.approved_at)-new Date(b.approved_at));
  const nth=n=>appr.length>=n?appr[n-1].approved_at:null;
  const salesV=t=>V.filter(v=>Number(v.sales)>=t).sort((a,b)=>Number(b.sales)-Number(a.sales))[0];
  const hookV=V.filter(v=>Number(v.hook_rate)>=30&&Number(v.spend)>=50).sort((a,b)=>Number(b.hook_rate)-Number(a.hook_rate))[0];
  const days=[...new Set(orig.map(v=>ctDay(v.submitted_at)))].sort(); let run=0,best=0,bestEnd=null,prev=null;
  for(const d of days){ const p=prev&&new Date(Date.parse(prev+'T12:00:00Z')+864e5).toISOString().slice(0,10); run=(p===d)?run+1:1; if(run>best){best=run;bestEnd=d;} prev=d; }
  const weeks={}; orig.forEach(v=>{ const w=ctWeek(new Date(v.submitted_at))[0]; weeks[w]=(weeks[w]||0)+1; }); const bestWeek=Math.max(0,...Object.values(weeks));
  const B=[
    {k:'appr1',ic:'✅',t:'First approval',d:'Your first Ravine video approved.',got:appr.length>=1,at:nth(1),prog:[appr.length,1]},
    {k:'appr10',ic:'🔟',t:'10 approved',d:'Ten approved videos.',got:appr.length>=10,at:nth(10),prog:[appr.length,10]},
    {k:'appr25',ic:'🏅',t:'25 approved',d:'Twenty-five approved videos.',got:appr.length>=25,at:nth(25),prog:[appr.length,25]},
    {k:'appr50',ic:'🏆',t:'50 approved',d:'Fifty approved videos.',got:appr.length>=50,at:nth(50),prog:[appr.length,50]},
    {k:'k1',ic:'💵',t:'First $1K video',d:'One video past $1,000 in Trybe sales.',got:!!salesV(1000),vid:salesV(1000),money:true},
    {k:'k5',ic:'💰',t:'First $5K video',d:'One video past $5,000 in Trybe sales.',got:!!salesV(5000),vid:salesV(5000),money:true},
    {k:'hook30',ic:'🎣',t:'Hook master',d:'A 30%+ hook rate on a video with $50+ in ad spend.',got:!!hookV,vid:hookV},
    {k:'week5',ic:'📅',t:'5-video week',d:'Five original videos in one week (Monday to Sunday).',got:bestWeek>=5,prog:[Math.min(bestWeek,5),5]},
    {k:'streak7',ic:'🔥',t:'7-day streak',d:'A video posted 7 days in a row.',got:best>=7,at:best>=7?bestEnd+'T18:00:00Z':null,prog:[Math.min(best,7),7]},
  ];
  return B; }
const BADGE_SEEN='rcg_badges_seen';
function badgesSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(BADGE_SEEN+'_'+(S.me?.code||S.me?.id||'me'))||'[]')); }catch(e){ return new Set(); } }
function badgesMarkSeen(keys){ try{ localStorage.setItem(BADGE_SEEN+'_'+(S.me?.code||S.me?.id||'me'),JSON.stringify(keys)); }catch(e){} }
function badgesCard(vids){ if(!Array.isArray(vids)) return ''; const B=badgesOf(vids); const got=B.filter(b=>b.got); const seen=badgesSeen(); window.__badges=B;
  const html=`<div class="card bdg"><div class="row between"><div class="lbl">Your badges · ${got.length} of ${B.length}</div><span class="mini">Tap one to share it</span></div>
