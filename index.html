window.go=k=>{QS=null;LSEL=null;ASEL=null;
 if(k==='angles'){FMODE='angles';LANG='All';LQ='';k='feed'}
 else if(k==='inspo'){FMODE='inspo';LANG='All';LQ='';k='feed'}
 VIEW=k;render();scrollTop()};

/* ===================== AUTH =====================
   No creator's sales or payout ships inside this app. The roster carries names,
   approved-video counts and rank only. Your own figures live in a private file
   keyed to your personal code and are fetched after you enter it. */
const SKEY='ravine_creator_games_v2';
function saveSession(code){try{localStorage.setItem(SKEY,String(code));return}catch(e){}
 try{document.cookie=SKEY+'='+code+';path=/;max-age=31536000'}catch(e){}}
function readSession(){try{const v=localStorage.getItem(SKEY);if(v)return v}catch(e){}
 try{const m=document.cookie.match(new RegExp(SKEY+'=([A-Z0-9]+)'));if(m)return m[1]}catch(e){}
 return null}
function clearSession(){try{localStorage.removeItem(SKEY)}catch(e){}
 try{document.cookie=SKEY+'=;path=/;max-age=0'}catch(e){}}
const normCode=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function applyMine(d){
 const c=CR.find(x=>x.id===d.id); if(!c)return null;
 ['sales','$','v','sub','xp'].forEach(k=>{ if(d[k]!=null)c[k]=d[k] });
 if(d.rank!=null)c.rank=d.rank;
 if(d.pool)c.pool=d.pool;
 if(d.an)c.an=d.an;
 if(d.up)c.up=d.up;                          // weekly ad update, private to this code
 if(d.hist)c.hist=d.hist;                    // RAVINE-MOMENTUM-V1: own daily series only
 if(d.antot)window.ANTOT=d.antot;
 if(Array.isArray(d.all)){                    // brand admin gets the whole table
  d.all.forEach(r=>{const x=CR.find(y=>y.id===r.id); if(!x)return;
   ['sales','$','v','sub','rank'].forEach(k=>{ if(r[k]!=null)x[k]=r[k] });
   if(r.pool)x.pool=r.pool;});
 }
 return c;
}
async function fetchMine(code){
 const r=await fetch('./u/'+code+'.json?t='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw new Error('bad code');
 return await r.json();
}
function paintLogin(){
 // Nothing to paint. The picker used to list every creator's name and approved
 // count to anyone who opened the URL, signed in or not. The code alone decides
 // who you are, so the list was a liability with no purpose.
 const el=$('#lpick'); if(el)el.innerHTML='';
}
function enter(id,greet){ME=id;VIEW='home';$('#lerr').textContent='';
 try{scopeAdminKey()}catch(e){}    // drop the approval key unless this is the brand account
 $('#login').classList.add('gone');$('#app').style.display='block';
 render();if(greet)setTimeout(()=>toast(`Welcome back, ${me().n.split(' ')[0]}`),420)}
/* The code IS the identity. Asking people to also pick their name off a
   47-person list was pure friction: the list was in roster order with no
   search, so anyone past the first few rows tapped whoever was visible and got
   told their own code belonged to someone else. The ?k= link path never asked
   this, which is why some creators sailed in and others were stuck. Now both
   paths do the same thing — enter the code, land in your own account. */
window.doLogin=async()=>{
 const code=normCode($('#lpw').value);
 if(!code){$('#lerr').textContent='Enter the code Austin sent you.';return}
 $('#lerr').textContent='Checking…';
 let d; try{ d=await fetchMine(code) }
 catch(e){ $('#lerr').textContent='That code did not work. Check it and try again — it looks like RVAB12CD34.'; return }
 const c=applyMine(d);
 if(!c){ $('#lerr').textContent='That code did not match an account. Send it to Austin and he will sort it.'; return }
 AUTH=c.id;
 const stay=$('#lstay')?$('#lstay').checked:true;
 if(stay)saveSession(code);else clearSession();
 $('#lerr').textContent='';
 enter(c.id,true)};
window.logout=()=>{
 // the approval key is per-device; leaving it behind would hand approval power
 // to whoever signs in on this machine next
 try{const c=lsGet('rcg_backend',null);if(c){c.adminKey='';lsSet('rcg_backend',c)}}catch(e){}
 BACKEND.adminKey='';
 clearSession();AUTH=null;$('#lpw').value='';$('#app').style.display='none';
 location.reload()};
$('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
(function boot(){
 try{ startFeed() }catch(e){}
 const url=new URLSearchParams(location.search).get('k');
 const saved=normCode(url)||readSession();
 if(saved){
  fetchMine(saved).then(d=>{
   const c=applyMine(d);
   if(!c)throw new Error('unknown account');
   if(url)saveSession(saved);
   AUTH=c.id; enter(c.id,true);
  }).catch(()=>{ clearSession(); AUTH=CR.find(c=>c.admin).id; paintLogin(); });
  return;
 }
 AUTH=CR.find(c=>c.admin).id;paintLogin();
})();

/* ===== 30-DAY AD UPDATE =====
   Lives in the existing "My ad reviews" tab rather than a tab of its own.
   The video id rides in the private per-code file, not in the shipped bundle,
   so a creator only ever gets their own. V.reviews is wrapped, not rewritten. */
(function(){
  if(typeof V!=='object'||typeof V.reviews!=='function')return;
  function updCard(){
    var c; try{ c=me() }catch(e){ return '' }
    if(!c||c.admin||!c.up||!c.up.y)return '';
    return '<div class="g p" style="margin-bottom:15px;border-left:3px solid #E4633A">'
      +'<h3>30-day ad update</h3>'
      +'<div class="sub">Your full 30-day walkthrough — how your ads performed and where to go next.</div>'
      +'<div style="position:relative;width:100%;padding-top:56.25%;border-radius:8px;overflow:hidden;background:#000;margin-top:14px">'
      +'<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(c.up.y)+'" '
      +'style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" '
      +'allow="accelerometer;clipboard-write;encrypted-media;picture-in-picture" '
      +'allowfullscreen loading="lazy"></iframe></div>'
      +'<div class="note" style="margin-top:12px">Private to you. Nobody else can open it.</div></div>';
  }
  var orig=V.reviews;
  V.reviews=function(){
    var html=orig.apply(this,arguments);
    var card=updCard();
    if(!card)return html;
    var k=html.indexOf('<div class="anim narrow">');
    return k<0 ? html : html.slice(0,k+25)+card+html.slice(k+25);
  };
})();
